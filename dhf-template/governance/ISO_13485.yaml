id: ISO_13485
title: Medical devices - Quality management systems - Requirements for regulatory purposes
type: standard
version: "2016"
policies:

  # -----------------------------------------------------------------------
  # Clause 4 — Quality management system
  # -----------------------------------------------------------------------

  # 4.1 — General requirements
  - id: "4.1.a"
    section: "4.1"
    text: "The organization shall establish, document, implement, maintain and keep effective a quality management system."
    status: "approved"
    automation:
      check: "file_existence"
      params:
        path: "documents/plans/development_plan.md"

  - id: "4.1.b"
    section: "4.1"
    text: "The organization shall determine the processes needed for the QMS and their application throughout the organization."
    status: "approved"
    manual: true
    evidence_guidance: >
      The Software Development Plan (documents/plans/development_plan.md) and associated
      plans (verification, validation, configuration management, maintenance) collectively
      define the QMS processes applicable to the software product. Confirm that all
      plan documents are present, up to date, and cross-referenced to one another.

  # 4.2 — Documentation requirements
  - id: "4.2.1.a"
    section: "4.2.1"
    text: "The QMS documentation shall include a quality manual, documented procedures, and records required by this standard."
    status: "approved"
    manual: true
    evidence_guidance: >
      Confirm that a quality manual exists (either as a standalone document or
      through the combination of the Software Development Plan and associated
      procedure documents). The DHF specification documents and plans collectively
      satisfy the documented procedure requirement. A single quality manual document
      at documents/quality/quality_manual.md is the preferred form for this evidence.

  - id: "4.2.2.a"
    section: "4.2.2"
    text: "The organization shall establish a quality manual that includes the scope of the QMS, documented procedures or reference to them, and a description of the interaction of processes."
    status: "approved"
    manual: true
    evidence_guidance: >
      The quality manual must describe the scope of the QMS (which products and
      processes are covered), reference all documented procedures (or include them),
      and show how the processes interact. The AGENTS.md and Software Development Plan
      together describe process interactions; a formal quality manual consolidating
      these is required for a regulatory submission.

  - id: "4.2.3.a"
    section: "4.2.3"
    text: "Documents required by the quality management system shall be controlled. A documented procedure shall be established to define controls needed."
    status: "approved"
    automation:
      check: "file_existence"
      params:
        path: "documents/plans/configuration_management_plan.md"

  - id: "4.2.4.a"
    section: "4.2.4"
    text: "Records required to provide evidence of conformity to requirements and effective operation of the QMS shall be controlled."
    status: "approved"
    manual: true
    evidence_guidance: >
      Records are controlled through the GitOps model: all DHF items and documents
      are versioned in Git, with an immutable commit history. CI-generated artifacts
      (compliance reports, test result imports) are committed back to the DHF with
      timestamps and commit SHAs. Confirm that a record retention policy is documented
      — either in the configuration_management_plan.md or a dedicated record control
      procedure — specifying retention periods and access controls.

  # -----------------------------------------------------------------------
  # Clause 5 — Management responsibility
  # -----------------------------------------------------------------------

  - id: "5.1.a"
    section: "5.1"
    text: "Top management shall provide evidence of its commitment to the development and implementation of the quality management system and maintaining its effectiveness."
    status: "approved"
    manual: true
    evidence_guidance: >
      Provide signed management review records, quality policy statements, and
      evidence of resource allocation (budget, personnel assignments) demonstrating
      top management engagement with the QMS. Management review minutes addressing
      compliance status, customer feedback, and corrective actions constitute the
      primary evidence.

  - id: "5.2.a"
    section: "5.2"
    text: "Top management shall ensure that customer requirements and applicable regulatory requirements are determined and met."
    status: "approved"
    automation:
      check: "item_existence"
      params:
        type_code: "CRS"

  - id: "5.3.a"
    section: "5.3"
    text: "Top management shall ensure that the quality policy is appropriate to the purpose of the organization, includes a commitment to comply with requirements and to maintain the effectiveness of the QMS."
    status: "approved"
    manual: true
    evidence_guidance: >
      The quality policy must be a documented, management-approved statement. It
      should appear in the quality manual or as a standalone document. Confirm it
      references the applicable regulatory standards (ISO 13485, IEC 62304, ISO 14971)
      and includes measurable quality objectives.

  - id: "5.4.1.a"
    section: "5.4.1"
    text: "Top management shall ensure that quality objectives are established at relevant functions and levels within the organization."
    status: "approved"
    manual: true
    evidence_guidance: >
      Quality objectives should be documented, measurable, and consistent with the
      quality policy. Examples for a SaMD company: zero critical open defects at
      release, 100% requirement traceability, compliance CI gate passing on all
      merges. Confirm that objectives are reviewed in management review and updated
      when not met.

  - id: "5.5.1.a"
    section: "5.5.1"
    text: "Top management shall ensure that responsibilities and authorities are defined and communicated within the organization."
    status: "approved"
    manual: true
    evidence_guidance: >
      The Software Development Plan (or quality manual) shall identify the roles
      responsible for each QMS process: QA/RA owner, software development lead,
      risk management responsible, clinical/regulatory affairs. Confirm that each
      person named has acknowledged their responsibilities.

  - id: "5.6.1.a"
    section: "5.6.1"
    text: "Top management shall review the organization's quality management system, at planned intervals, to ensure its continuing suitability, adequacy and effectiveness."
    status: "approved"
    manual: true
    evidence_guidance: >
      Management review meeting minutes shall be maintained, covering: results of
      audits and CI compliance runs, customer feedback, process performance (CI
      pass rate, defect trends), corrective actions, and recommendations for
      improvement. Reviews must occur at planned intervals (at minimum annually,
      or before major product releases).

  # -----------------------------------------------------------------------
  # Clause 6 — Resource management
  # -----------------------------------------------------------------------

  - id: "6.2.a"
    section: "6.2"
    text: "Personnel performing work affecting product quality shall be competent on the basis of appropriate education, training, skills and experience."
    status: "approved"
    manual: true
    evidence_guidance: >
      Provide training records, CVs, or competency assessments for all personnel
      performing QMS-relevant work (software development, verification, validation,
      risk management, regulatory affairs). Training records should document both
      initial qualification and ongoing updates for standard changes (e.g. IEC 62304
      amendments).

  - id: "6.3.a"
    section: "6.3"
    text: "The organization shall determine, provide and maintain the infrastructure needed to achieve conformity to product requirements."
    status: "approved"
    manual: true
    evidence_guidance: >
      Infrastructure for a SaMD product includes: CI/CD pipeline, version control
      system (Git/GitHub), DHF tooling (CompliantFlow), and development environments.
      Confirm that the CI system is documented, access-controlled, and its
      configuration is version-controlled. The GitHub Actions pipeline and
      compliantflow-dhf repository configurations constitute the primary evidence.

  - id: "6.4.1.a"
    section: "6.4.1"
    text: "The organization shall determine and manage the work environment needed to achieve conformity to product requirements."
    status: "approved"
    manual: true
    evidence_guidance: >
      For SaMD development, the work environment controls include: access control
      to production branches (branch protection rules), separation of development
      and production environments, and controls on who can approve merges to main.
      Confirm that GitHub branch protection rules enforce review requirements and
      that CI gates cannot be bypassed without a documented exception process.

  # -----------------------------------------------------------------------
  # Clause 7 — Product realization
  # -----------------------------------------------------------------------

  # 7.1 — Planning of product realization
  - id: "7.1.a"
    section: "7.1"
    text: "The organization shall plan and develop the processes needed for product realization."
    status: "approved"
    automation:
      check: "file_existence"
      params:
        path: "documents/plans/development_plan.md"

  # 7.2 — Customer-related processes
  - id: "7.2.1.a"
    section: "7.2.1"
    text: "The organization shall determine requirements specified by the customer and requirements not stated by the customer but necessary for specified or intended use."
    status: "approved"
    automation:
      check: "item_existence"
      params:
        type_code: "CRS"

  - id: "7.2.1.b"
    section: "7.2.1"
    text: "Applicable regulatory and legal requirements related to the product shall be determined."
    status: "approved"
    manual: true
    evidence_guidance: >
      The Software Development Plan shall explicitly identify the applicable
      regulatory standards (ISO 13485, IEC 62304, ISO 14971, IEC 82304-1,
      applicable FDA/MDR requirements). Confirm this list is current and reflects
      the intended markets and product classification.

  - id: "7.2.2.a"
    section: "7.2.2"
    text: "The organization shall review requirements related to the product prior to committing to supply a product."
    status: "approved"
    manual: true
    evidence_guidance: >
      Requirement review records (e.g. CRS review meeting notes, customer requirement
      sign-off) shall demonstrate that requirements were evaluated for completeness,
      consistency, and feasibility before development commitment. CRS items in the
      DHF with documented approval serve as the primary evidence.

  # 7.3 — Design and development
  # NOTE: Clauses 7.3 overlap significantly with IEC 62304 Clauses 5.1–5.8.
  # These checks use distinct ISO 13485 framing; IEC 62304 provides more
  # detailed automated verification of the same activities.

  - id: "7.3.2.a"
    section: "7.3.2"
    text: "Design and development inputs relating to product requirements shall be determined and records maintained."
    status: "approved"
    automation:
      check: "item_existence"
      params:
        type_code: "SRS"

  - id: "7.3.3.a"
    section: "7.3.3"
    text: "Design and development outputs shall be provided in a form that enables verification against design and development inputs."
    status: "approved"
    automation:
      check: "item_existence"
      params:
        type_code: "SWDD"

  - id: "7.3.3.b"
    section: "7.3.3"
    text: "Design and development outputs shall trace to design and development inputs."
    status: "approved"
    automation:
      check: "trace_coverage"
      params:
        source_type: "SWDD"
        target_type: "SRS"
        min_coverage: 1.0

  - id: "7.3.4.a"
    section: "7.3.4"
    text: "Systematic reviews of design and development shall be performed at suitable stages."
    status: "approved"
    automation:
      check: "verification_complete"
      params:
        type_code: "SYS"

  - id: "7.3.5.a"
    section: "7.3.5"
    text: "Verification shall be performed to ensure that design and development outputs have met design and development input requirements."
    status: "approved"
    automation:
      check: "all_tests_passing"
      params:
        type_code: "SYS"

  - id: "7.3.6.a"
    section: "7.3.6"
    text: "Design and development validation shall be performed to ensure that the resulting product is capable of meeting the requirements for the specified application or intended use."
    status: "approved"
    automation:
      check: "all_tests_passing"
      params:
        type_code: "CRS"

  - id: "7.3.7.a"
    section: "7.3.7"
    text: "All design and development changes shall be identified, and records maintained."
    status: "approved"
    automation:
      check: "item_existence"
      params:
        type_code: "CR"

  - id: "7.3.9.a"
    section: "7.3.9"
    text: "The organization shall document and maintain a DHF for each type of medical device. The DHF shall contain, or reference, documents necessary to demonstrate that the design and development requirements are met."
    status: "approved"
    automation:
      check: "file_existence"
      params:
        path: "documents/plans/development_plan.md"

  # 7.4 — Purchasing
  - id: "7.4.1.a"
    section: "7.4.1"
    text: "The organization shall establish documented procedures to ensure that purchased product conforms to specified purchasing requirements."
    status: "approved"
    automation:
      check: "item_existence"
      params:
        type_code: "SOUP"

  - id: "7.4.1.b"
    section: "7.4.1"
    text: "SOUP items used in the medical device software shall be evaluated and documented."
    status: "approved"
    automation:
      check: "attribute_presence"
      params:
        type_code: "SOUP"
        attribute: "version"

  # 7.5 — Production and service provision
  - id: "7.5.1.a"
    section: "7.5.1"
    text: "The organization shall plan and carry out production and service provision under controlled conditions."
    status: "approved"
    automation:
      check: "file_existence"
      params:
        path: "documents/plans/configuration_management_plan.md"

  - id: "7.5.6.a"
    section: "7.5.6"
    text: "The organization shall validate processes for production and service provision where the resulting output cannot be verified by subsequent monitoring or measurement."
    status: "approved"
    automation:
      check: "file_existence"
      params:
        path: "documents/plans/validation_plan.md"

  # -----------------------------------------------------------------------
  # Clause 8 — Measurement, analysis and improvement
  # -----------------------------------------------------------------------

  # 8.2 — Monitoring and measurement
  - id: "8.2.1.a"
    section: "8.2.1"
    text: "The organization shall establish documented procedures for feedback on product and process performance from post-production activities."
    status: "approved"
    manual: true
    evidence_guidance: >
      A post-market surveillance plan or SOP shall describe how customer feedback,
      field incidents, and near-misses are collected, reviewed, and fed back into
      the QMS (risk management process, corrective action). DEF items in the DHF
      track identified problems. Confirm that a formal feedback collection process
      is documented and that it references the problem resolution procedure.

  - id: "8.2.2.a"
    section: "8.2.2"
    text: "The organization shall conduct internal audits at planned intervals to determine whether the QMS conforms to requirements."
    status: "approved"
    manual: true
    evidence_guidance: >
      Internal audit records shall document: audit scope, criteria, findings, and
      corrective actions. The CI compliance gate (running on every merge) provides
      continuous automated verification as a supplement to periodic manual audits.
      Formal audit reports, typically annual, are required as QMS records.

  - id: "8.2.3.a"
    section: "8.2.3"
    text: "The organization shall apply suitable methods for monitoring and measurement of processes to demonstrate the ability of the processes to achieve planned results."
    status: "approved"
    automation:
      check: "all_tests_passing"
      params:
        type_code: "SYS"

  - id: "8.2.4.a"
    section: "8.2.4"
    text: "The organization shall monitor and measure characteristics of the product to verify that product requirements have been met."
    status: "approved"
    automation:
      check: "verification_complete"
      params:
        type_code: "SYS"

  # 8.3 — Control of nonconforming product
  - id: "8.3.a"
    section: "8.3"
    text: "The organization shall ensure that product which does not conform to product requirements is identified and controlled to prevent its unintended use or delivery."
    status: "approved"
    automation:
      check: "item_existence"
      params:
        type_code: "DEF"

  - id: "8.3.b"
    section: "8.3"
    text: "Open nonconformances of significant severity shall not block product release."
    status: "approved"
    automation:
      check: "no_open_defects"
      params:
        severity_threshold:
          - "Critical"
          - "High"

  # 8.4 — Analysis of data
  - id: "8.4.a"
    section: "8.4"
    text: "The organization shall determine, collect and analyse appropriate data to demonstrate the suitability and effectiveness of the quality management system."
    status: "approved"
    manual: true
    evidence_guidance: >
      Compliance run history (persisted compliance-runs/ records in the DHF) and
      test result trends provide quantitative QMS effectiveness data. Review the
      compliance score trend across recent CI runs, defect closure rate, and
      traceability coverage metrics as the primary data sources. These should be
      summarised in management review records.

  # 8.5 — Improvement
  - id: "8.5.1.a"
    section: "8.5.1"
    text: "The organization shall identify and implement changes necessary to ensure and maintain the continued suitability, adequacy and effectiveness of the QMS."
    status: "approved"
    manual: true
    evidence_guidance: >
      Improvement actions are tracked as CR items in the DHF. Management review
      records shall identify QMS improvement opportunities; corresponding CRs shall
      be created, prioritised, and resolved through the standard change request
      process. The open_change_requests check ensures blocking CRs are not left
      unresolved indefinitely.

  - id: "8.5.2.a"
    section: "8.5.2"
    text: "The organization shall take corrective action to eliminate the cause of nonconformities in order to prevent recurrence."
    status: "approved"
    automation:
      check: "item_existence"
      params:
        type_code: "CR"

  - id: "8.5.2.b"
    section: "8.5.2"
    text: "Corrective actions shall be appropriate to the effects of the nonconformities encountered."
    status: "approved"
    manual: true
    evidence_guidance: >
      For each DEF item closed through the problem resolution process, confirm that
      the corresponding CR documents a root cause analysis and a corrective action
      proportionate to the severity of the nonconformity. CR implementation_notes
      shall describe the root cause and why the selected control prevents recurrence.

  - id: "8.5.3.a"
    section: "8.5.3"
    text: "The organization shall determine action to eliminate the causes of potential nonconformities in order to prevent their occurrence."
    status: "approved"
    manual: true
    evidence_guidance: >
      Preventive actions are tracked as CR items created proactively (not in response
      to an observed nonconformity). Risk management activities (RISK and RCM items
      in the DHF) serve as the primary preventive action mechanism — hazards are
      identified before harm occurs and controls are implemented. Confirm that the
      risk management process is applied during design changes, not only after
      incidents.
