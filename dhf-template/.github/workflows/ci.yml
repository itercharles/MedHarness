name: DHF CI

# Validates DHF structure and data integrity on every change.
# Compliance checks (IEC 62304, ISO 14971) live in the CompliantFlow
# tool CI, which runs against the DHF as part of the design gate
# and records verification evidence post-merge.

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize]

jobs:

  utils-tests:
    name: DHF Utils Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest click jinja2 markdown pydantic PyYAML gitpython

      - name: Run DHF utils tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}:${PWD}/DHF"
          pytest DHF/utils/tests/ -v --junitxml=dhf-utils-test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhf-utils-test-results
          path: dhf-utils-test-results.xml

  schema-validation:
    name: Schema Validation
    runs-on: ubuntu-latest
    needs: utils-tests
    steps:
      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install click jinja2 markdown pydantic PyYAML

      - name: Validate DHF schema
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}:${PWD}/DHF"
          python -m utils validate schema
