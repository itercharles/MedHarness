name: CR Lifecycle Transition

# Transitions a CR item to a new lifecycle state and commits the change.
#
# Triggered two ways:
#   1. Automatically by CompliantFlow's post-merge CI (passes cr_ids + to_state)
#   2. Manually from the Actions UI (e.g. close a CR after manual verification)
#
# Requires: DHF_REPO_TOKEN (or GITHUB_TOKEN for same-repo) with contents: write

on:
  workflow_dispatch:
    inputs:
      cr_ids:
        description: "Space-separated CR IDs to transition (e.g. 'CR-050 CR-051')"
        required: true
        type: string
      to_state:
        description: "Target lifecycle state"
        required: true
        type: choice
        options:
          - closed
          - planned
      triggered_by:
        description: "Who triggered this transition"
        required: false
        default: "Manual"
        type: string
      commit_sha:
        description: "Associated code commit SHA (optional, for audit trail)"
        required: false
        default: ""
        type: string

jobs:
  transition:
    name: Transition CR(s) to ${{ inputs.to_state }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install click jinja2 markdown pydantic PyYAML gitpython

      - name: Transition CR(s)
        env:
          CR_IDS: ${{ inputs.cr_ids }}
          TO_STATE: ${{ inputs.to_state }}
          TRIGGERED_BY: ${{ inputs.triggered_by }}
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}:${PWD}/DHF"
          FAILED=0
          for CR_ID in $CR_IDS; do
            echo "--- Transitioning $CR_ID → $TO_STATE ---" >&2
            python -m utils item transition "$CR_ID" "$TO_STATE" --by "$TRIGGERED_BY" \
              && echo "✓ $CR_ID transitioned to $TO_STATE" >&2 \
              || { echo "✗ Failed to transition $CR_ID" >&2; FAILED=1; }
          done
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Commit CR status changes
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
          CR_IDS: ${{ inputs.cr_ids }}
          TO_STATE: ${{ inputs.to_state }}
        run: |
          git config user.name "GitHub Actions [bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DHF/items/
          if ! git diff --staged --quiet; then
            MSG="chore: transition ${CR_IDS} to ${TO_STATE}"
            [ -n "$COMMIT_SHA" ] && MSG="${MSG} (code: ${COMMIT_SHA::7})"
            git commit -m "$MSG [skip ci]"
            git push
            echo "✓ Committed CR status changes to DHF" >&2
          else
            echo "No CR status changes to commit." >&2
          fi
