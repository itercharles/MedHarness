name: DHF CI

# DHF structural CI:
#   1. CR validation     — PR title CR references + CR state check
#   2. Design traceability — schema, traceability, design coverage
#
# CI for {{project_name}} — structure and traceability checks.

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  actions: read

jobs:

  # ── CR validation ────────────────────────────────────────────────────────

  cr-validation:
    name: CR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Extract CR IDs from PR title
        id: extract-cr
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          CR_IDS=$(echo "$PR_TITLE" | grep -oE 'CR-[0-9]+' | sort -u | tr '\n' ' ' || true)
          echo "cr_ids=$CR_IDS" >> "$GITHUB_OUTPUT"
          if [ -z "$CR_IDS" ]; then
            echo "✗ No CR ID found in PR title. Include a CR reference e.g. 'feat(CR-012): description'" >&2
            exit 1
          else
            echo "Found CR IDs in title: $CR_IDS" >&2
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dhfkit
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install medharness=={{medharness_version}} || \
            pip install git+https://github.com/{{medharness_repo}}@main

      - name: Check CR status for each referenced CR
        env:
          CR_IDS: ${{ steps.extract-cr.outputs.cr_ids }}
        run: |
          FAILED=0
          for CR_ID in $CR_IDS; do
            echo "--- Checking $CR_ID ---" >&2
            medharness dhf item get "$CR_ID" > /dev/null || {
              echo "✗ $CR_ID not found in DHF" >&2
              FAILED=1
            }
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "✗ One or more CR validations failed." >&2
            exit 1
          fi
          echo "✓ All referenced CRs are valid." >&2

  # ── Design traceability ──────────────────────────────────────────────────

  dhf-validation:
    name: Design Traceability (schema + coverage)
    runs-on: ubuntu-latest
    needs: cr-validation
    if: always() && (needs.cr-validation.result == 'success' || needs.cr-validation.result == 'skipped')
    steps:
      - name: Check out DHF repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install medharness=={{medharness_version}} || \
            pip install git+https://github.com/{{medharness_repo}}@main

      - name: Run design traceability validation
        run: |
          medharness ci dhf-validate \
            --dhf DHF \
            --run-schema \
            --run-traceability \
            --coverage-pair UC:CRS \
            --coverage-pair CRS:SYS \
            --coverage-pair SYS:SRS \
            --coverage-pair SRS:SWDD \
            --fail-on-uncovered
