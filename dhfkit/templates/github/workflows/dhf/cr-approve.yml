name: CR Approval Gate

on:
  issue_comment:
    types: [created]

jobs:
  approve:
    # Only run on PR comments (not issue comments) that contain a command.
    if: >
      github.event.issue.pull_request != null &&
      (contains(github.event.comment.body, '/approve') ||
       contains(github.event.comment.body, '/reject'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install medharness
        run: pip install medharness=={{medharness_version}} || pip install git+https://github.com/{{medharness_repo}}@main

      - name: Parse approval command
        id: cmd
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          RESULT=$(medharness ci parse-approval --comment "$COMMENT_BODY")
          echo "action=$(echo "$RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('action') or '')")" >> "$GITHUB_OUTPUT"
          echo "reason=$(echo "$RESULT" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('reason') or '')")" >> "$GITHUB_OUTPUT"

      - name: Authorize reviewer
        id: auth
        if: steps.cmd.outputs.action != ''
        env:
          AUTHOR_ASSOCIATION: ${{ github.event.comment.author_association }}
        run: |
          case "$AUTHOR_ASSOCIATION" in
            OWNER|MEMBER|COLLABORATOR)
              echo "authorized=true" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "authorized=false" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Get PR branch and CR ID
        id: pr
        if: steps.cmd.outputs.action != '' && steps.auth.outputs.authorized == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          PR_INFO=$(gh pr view "$PR_NUMBER" --json headRefName,labels)
          BRANCH=$(echo "$PR_INFO" | python3 -c "import json,sys; print(json.load(sys.stdin)['headRefName'])")
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          # Extract CR ID (e.g. spec/CR-034 → CR-034)
          CR_ID=$(echo "$BRANCH" | grep -oP 'CR-\d+' | head -n 1 || echo "")
          echo "cr_id=$CR_ID" >> "$GITHUB_OUTPUT"
          # Infer stage from branch prefix
          if [[ "$BRANCH" == spec/* ]]; then
            echo "stage=spec" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == design/* ]]; then
            echo "stage=design" >> "$GITHUB_OUTPUT"
          elif [[ "$BRANCH" == feat/* ]]; then
            echo "stage=develop" >> "$GITHUB_OUTPUT"
          else
            echo "stage=" >> "$GITHUB_OUTPUT"
          fi

      - name: Approve — add label and confirm
        if: steps.auth.outputs.authorized == 'true' && steps.cmd.outputs.action == 'approve' && steps.pr.outputs.cr_id != '' && steps.pr.outputs.stage != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          CR_ID: ${{ steps.pr.outputs.cr_id }}
          STAGE: ${{ steps.pr.outputs.stage }}
        run: |
          RESULT=$(medharness ci approve-gate --cr "$CR_ID" --stage "$STAGE" --pr "$PR_NUMBER" 2>/dev/null || true)
          LABEL=$(echo "$RESULT" | python3 -c "import json,sys; print(json.load(sys.stdin).get('label',''))" 2>/dev/null || echo "")
          # Add label (gh pr edit is idempotent)
          gh pr edit "$PR_NUMBER" --add-label "$LABEL" 2>/dev/null || \
            gh label create "$LABEL" --color "0e8a16" --description "CR stage approved" 2>/dev/null || true
          gh pr edit "$PR_NUMBER" --add-label "$LABEL"
          gh pr comment "$PR_NUMBER" --body "✅ **$CR_ID $STAGE approved** by @${{ github.actor }}. Label \`$LABEL\` added — the next workflow stage will proceed on merge."

      - name: Reject — close PR and transition CR
        if: steps.auth.outputs.authorized == 'true' && steps.cmd.outputs.action == 'reject' && steps.pr.outputs.cr_id != '' && steps.pr.outputs.stage != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
          CR_ID: ${{ steps.pr.outputs.cr_id }}
          STAGE: ${{ steps.pr.outputs.stage }}
          REASON: ${{ steps.cmd.outputs.reason }}
        run: |
          REASON_TEXT="${REASON:-no reason given}"
          gh pr comment "$PR_NUMBER" --body "❌ **$CR_ID $STAGE rejected** by @${{ github.actor }}. Reason: $REASON_TEXT. Closing PR."
          gh pr close "$PR_NUMBER"
          # Transition the DHF CR item to rejected
          medharness --dhf DHF dhf item transition "$CR_ID" rejected --by "${{ github.actor }}" 2>/dev/null || true
          git config user.name "GitHub Actions [bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "DHF/items/06_cr/$CR_ID.yaml" 2>/dev/null || true
          if ! git diff --staged --quiet 2>/dev/null; then
            git commit -m "chore: reject $CR_ID — $REASON_TEXT [skip ci]"
            git push
          fi

      - name: Warn — no CR ID or stage inferred
        if: steps.auth.outputs.authorized == 'true' && steps.cmd.outputs.action != '' && (steps.pr.outputs.cr_id == '' || steps.pr.outputs.stage == '')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "⚠️ Could not determine CR ID or stage from branch \`${{ steps.pr.outputs.branch }}\`. Expected branch prefix: \`spec/CR-NNN\`, \`design/CR-NNN\`, or \`feat/CR-NNN\`."

      - name: Warn — unauthorized reviewer
        if: steps.cmd.outputs.action != '' && steps.auth.outputs.authorized == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr comment "$PR_NUMBER" --body "⚠️ Approval commands are limited to repository owners, members, or collaborators. Ignored command from @${{ github.actor }} (${{ github.event.comment.author_association }})."
