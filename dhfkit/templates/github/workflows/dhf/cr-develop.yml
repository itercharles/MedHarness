name: Develop CR

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'DHF/documents/specs/CR-*-Spec.md'

jobs:
  develop:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract CR ID from merged spec
        id: cr
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          SPEC_FILE=$(git diff --name-only "$BASE_SHA" "$MERGE_SHA" | grep -E '^DHF/documents/specs/CR-.*-Spec\.md$' | head -n 1 || true)
          if [ -z "$SPEC_FILE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CR_ID=$(basename "$SPEC_FILE" -Spec.md)
          echo "cr_id=$CR_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.cr.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: Install dhfkit
        if: steps.cr.outputs.skip != 'true'
        run: pip install medharness=={{medharness_version}} || pip install git+https://github.com/{{medharness_repo}}@main

      - name: Validate spec front-matter
        id: validate
        if: steps.cr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          SPEC="DHF/documents/specs/${{ steps.cr.outputs.cr_id }}-Spec.md"
          if [ ! -f "$SPEC" ]; then
            echo "SPEC not found: $SPEC — aborting."
            exit 1
          fi
          DIR_FIT=$(python3 -c "
          import yaml, sys
          try:
              with open('$SPEC') as f:
                  content = f.read()
              if content.startswith('---'):
                  _, front, _ = content.split('---', 2)
                  fm = yaml.safe_load(front)
                  if isinstance(fm, dict):
                      print(fm.get('direction_fit', 'in-scope'))
              else:
                  print('missing-frontmatter')
          except Exception as e:
              print(f'parse-error: {e}')
          " 2>/dev/null || echo "parse-error")
          echo "direction_fit=$DIR_FIT" >> "$GITHUB_OUTPUT"
          if [ "$DIR_FIT" = "out-of-scope" ]; then
            echo "reject=true" >> "$GITHUB_OUTPUT"
            echo "reject_reason=out-of-scope" >> "$GITHUB_OUTPUT"
          elif [ "$DIR_FIT" = "missing-frontmatter" ] || [ "$DIR_FIT" = "parse-error" ]; then
            echo "✗ Spec front-matter missing or malformed (direction_fit=$DIR_FIT)." >&2
            echo "  Re-run the cr-analyze workflow to regenerate the spec." >&2
            exit 1
          else
            echo "reject=false" >> "$GITHUB_OUTPUT"
          fi
          APPROVED=$(gh pr view "$PR_NUMBER" --json labels --jq '[.labels[].name] | contains(["cr-spec-approved"])' 2>/dev/null || echo "false")
          echo "approved=$APPROVED" >> "$GITHUB_OUTPUT"
          if [ "$APPROVED" != "true" ]; then
            echo "✗ Spec PR missing required approval label: cr-spec-approved." >&2
            echo "  An authorized reviewer must comment /approve before this merge can advance the CR lifecycle." >&2
            exit 1
          fi

      - name: Reject CR (out-of-scope / invalid spec)
        if: steps.validate.outputs.reject == 'true'
        env:
          CR_ID: ${{ steps.cr.outputs.cr_id }}
        run: |
          medharness --dhf DHF dhf item transition "$CR_ID" rejected --by "github-actions[bot]"
          git config user.name "GitHub Actions [bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "DHF/items/06_cr/$CR_ID.yaml"
          git commit -m "chore: reject $CR_ID — direction_fit out-of-scope [skip ci]"
          git push
          echo "✓ $CR_ID transitioned to rejected and committed." >&2

      - name: Transition CR to developing
        if: steps.cr.outputs.skip != 'true' && steps.validate.outputs.reject != 'true'
        run: |
          medharness --dhf DHF dhf item transition "${{ steps.cr.outputs.cr_id }}" developing --by "github-actions[bot]"

      - uses: actions/setup-node@v4
        if: steps.cr.outputs.skip != 'true' && steps.validate.outputs.reject != 'true'
        with:
          node-version: '20'

      - name: Install Claude Code
        if: steps.cr.outputs.skip != 'true' && steps.validate.outputs.reject != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Implement approved spec
        if: steps.cr.outputs.skip != 'true' && steps.validate.outputs.reject != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CR_ID: ${{ steps.cr.outputs.cr_id }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            PROMPT=$(sed "s/{{cr_id}}/$CR_ID/g" .github/prompts/cr-develop.md)
            claude -p --dangerously-skip-permissions "$PROMPT"
          else
            echo "ANTHROPIC_API_KEY not set — writing stub implementation for pipeline testing."
            medharness --dhf DHF dhf item create --type SRS \
              --data "{\"title\": \"[STUB] Placeholder SRS for $CR_ID\", \"derives_from\": [], \"content\": \"Stub SRS — replace before merging.\"}"
            printf '# Stub implementation for %s\n\n> Generated by pipeline dry-run (no ANTHROPIC_API_KEY). Delete before merging.\n\nSee spec: DHF/documents/specs/%s-Spec.md\n' \
              "$CR_ID" "$CR_ID" > "stub-${CR_ID}.md"
          fi

      - name: Push implementation branch and open PR
        if: steps.cr.outputs.skip != 'true' && steps.validate.outputs.reject != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_ID: ${{ steps.cr.outputs.cr_id }}
        run: |
          git checkout -b "feat/$CR_ID"
          git config user.name "GitHub Actions [bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "feat: implement $CR_ID"
            git push --set-upstream origin "feat/$CR_ID"
            gh pr create \
              --head "feat/$CR_ID" \
              --base main \
              --title "feat($CR_ID): implement approved spec" \
              --body "Automated implementation for $CR_ID. DHF items and product code in a single PR."
          else
            echo "No changes to commit."
          fi
