name: Analyze CR

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'DHF/items/06_cr/CR-*.yaml'
  workflow_dispatch:
    inputs:
      cr_id:
        description: 'CR ID to analyze (e.g. CR-056)'
        required: true
        type: string

jobs:
  analyze:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find new CR items from merged PR
        id: crs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          MANUAL_CR_ID: ${{ inputs.cr_id }}
        run: |
          if [ -n "$MANUAL_CR_ID" ]; then
            echo "cr_id=$MANUAL_CR_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(git diff --name-status "$BASE_SHA" "$MERGE_SHA" | awk '$1 == "A" && $2 ~ /^DHF\/items\/06_cr\/CR-.*\.yaml$/ { print $2 }')
          if [ -z "$FILES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$FILES" > /tmp/cr_files.txt
          CR_ID=$(basename "$(head -n 1 /tmp/cr_files.txt)" .yaml)
          echo "cr_id=$CR_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.crs.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: Install dhfkit
        if: steps.crs.outputs.skip != 'true'
        run: pip install medharness=={{medharness_version}} || pip install git+https://github.com/{{medharness_repo}}@main

      - name: Transition CR to analyzing
        if: steps.crs.outputs.skip != 'true'
        run: |
          medharness --dhf DHF dhf item transition "${{ steps.crs.outputs.cr_id }}" analyzing --by "github-actions[bot]"

      - name: Fetch latest test results artifact
        if: steps.crs.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
        run: |
          mkdir -p /tmp/test-artifacts
          cd /tmp/test-artifacts
          RUN_ID=$(gh run list --repo ${{ github.repository }} --workflow engineering-control.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId' 2>/dev/null || echo "")
          if [ -n "$RUN_ID" ]; then
            gh run download "$RUN_ID" --repo ${{ github.repository }} --name test-results --dir /tmp/test-artifacts 2>/dev/null || echo "No test-results artifact found yet."
          else
            echo "No successful CI runs found — skipping test coverage."
          fi

      - name: Pre-compute DHF context
        if: steps.crs.outputs.skip != 'true'
        env:
          CR_ID: ${{ steps.crs.outputs.cr_id }}
        run: |
          DHF_CONTEXT=$(medharness --dhf DHF dhf context for-stage analyze --cr "$CR_ID" 2>/dev/null || echo '{}')
          echo "DHF_CONTEXT=$DHF_CONTEXT" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        if: steps.crs.outputs.skip != 'true'
        with:
          node-version: '20'

      - name: Install Claude Code
        if: steps.crs.outputs.skip != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate CR spec
        if: steps.crs.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CR_ID: ${{ steps.crs.outputs.cr_id }}
        run: |
          SPEC="DHF/documents/specs/${CR_ID}-Spec.md"
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            PROMPT=$(sed "s/{{cr_id}}/$CR_ID/g" .github/prompts/cr-analyze.md)
            claude -p --dangerously-skip-permissions "$PROMPT"
          else
            echo "ANTHROPIC_API_KEY not set — writing stub spec for pipeline testing."
            CR_TITLE=$(python3 -c "import yaml; d=yaml.safe_load(open('DHF/items/06_cr/${CR_ID}.yaml')); print(d.get('title','No title'))")
            printf '# %s Plan Spec (stub)\n\n> **Note:** Stub spec — no ANTHROPIC_API_KEY. Replace before approving.\n\n## Change Request\n\n**ID:** %s\n**Title:** %s\n\n## Technical Approach\n\n_To be filled in._\n\n## DHF Items to Create or Update\n\n_To be filled in._\n\n## Product Code Changes\n\n_To be filled in._\n\n## Verification and Test Cases\n\n_To be filled in._\n\n## Compliance and Traceability\n\n_To be filled in._\n' \
              "$CR_ID" "$CR_ID" "$CR_TITLE" > "$SPEC"
          fi

      - name: Commit spec branch
        if: steps.crs.outputs.skip != 'true'
        env:
          CR_ID: ${{ steps.crs.outputs.cr_id }}
        run: |
          git checkout -b "spec/$CR_ID"
          git config user.name "GitHub Actions [bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "DHF/items/06_cr/$CR_ID.yaml" "DHF/documents/specs/$CR_ID-Spec.md"
          git commit -m "feat: analyze $CR_ID"
          git push --set-upstream origin "spec/$CR_ID"

      - name: Open spec PR
        id: pr
        if: steps.crs.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_ID: ${{ steps.crs.outputs.cr_id }}
        run: |
          gh pr create \
            --head "spec/$CR_ID" \
            --base main \
            --title "spec($CR_ID): AI analysis plan" \
            --body "Automated spec generated for $CR_ID." > /tmp/pr_url.txt
          cat /tmp/pr_url.txt >> "$GITHUB_OUTPUT"

      - name: Update PR body with approval checklist
        if: steps.crs.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_ID: ${{ steps.crs.outputs.cr_id }}
        run: |
          SPEC="DHF/documents/specs/${CR_ID}-Spec.md"
          if [ -f "$SPEC" ]; then
            DIR_FIT=$(grep -oP 'direction_fit:\s*"\K[^"]+' "$SPEC" 2>/dev/null || echo "unknown")
            AFFECTED=$(grep -oP '^\s*-\s+\K[A-Z]+-\d+' "$SPEC" 2>/dev/null | head -5 | tr '\n' ', ' | sed 's/, $//')
            gh pr edit \
              --body "$(cat <<'EOF'
## Approval Checklist

- [ ] **Direction fit confirmed:** DIR_FIT_HERE
- [ ] **Affected DHF items reviewed:** AFFECTED_HERE
- [ ] **Test plan accepted:** auto-covered TCs confirmed, new TCs approved
- [ ] **Implementation approach approved**

> Merging this PR = explicit approval of the above. The spec will proceed to implementation (cr-develop.yml).
EOF
)"
            gh pr edit \
              --body "$(gh pr view --json body --jq '.body' | sed "s/DIR_FIT_HERE/${DIR_FIT}/" | sed "s/AFFECTED_HERE/${AFFECTED:-none}/")"
          fi
