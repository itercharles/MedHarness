name: DHF

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  dhf-validate:
    name: Validate DHF
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install medharness=={{medharness_version}}

      # --strict makes a requirement with no downstream design or test
      # block the build. Drop the flag while backfilling an existing DHF; coverage
      # gaps then report as WARN and only schema, required links, and dangling
      # links block.
      - name: Schema and traceability check
        run: medharness --dhf DHF verify dhf --strict

  change-check:
    name: Check the change request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install medharness=={{medharness_version}}

      # The CR is named by the branch: design/CR-012, develop/CR-012, cr/CR-012.
      # A branch that does not end in one is not a change request and is not checked.
      - name: Find the change request
        id: cr
        env:
          BRANCH: ${{ github.head_ref }}
        run: echo "id=$(echo "$BRANCH" | grep -oE 'CR-[0-9]+$' || true)" >> "$GITHUB_OUTPUT"

      - name: Impact record against the branch
        if: steps.cr.outputs.id != ''
        env:
          CR: ${{ steps.cr.outputs.id }}
          BASE: ${{ github.base_ref }}
        run: medharness --dhf DHF verify impact --cr "$CR" --since-ref "origin/$BASE"

      - name: Run the tests
        if: steps.cr.outputs.id != ''
        run: "{{test_command}}"

      - name: What the CR changed is verified, and the CR can close
        if: steps.cr.outputs.id != ''
        env:
          CR: ${{ steps.cr.outputs.id }}
        run: medharness --dhf DHF verify tests --cr "$CR" --junit test-results

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: dhf-validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - run: pip install medharness=={{medharness_version}}

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Every requirement must be verified by this run's JUnit: the release is cut
      # from the tests of the commit it ships, not from a result produced elsewhere.
      - name: Run the tests
        run: "{{test_command}}"

      - name: Build the release
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          medharness --dhf DHF build release \
            --version "$VERSION" \
            --out-dir artifacts \
            --junit test-results \
            --write

      # Through a pull request, not a push to main: a branch protection rule
      # requiring review is the normal configuration for a controlled repo, and
      # a REL item is a DHF record like any other.
      - name: Open a pull request for the REL item
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DHF/
          if git diff --cached --quiet; then
            echo "No DHF change to record for $VERSION."
            exit 0
          fi
          BRANCH="chore/release-$VERSION"
          git checkout -b "$BRANCH"
          git commit -m "ci: release $VERSION"
          git push origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" \
            --title "ci: release $VERSION" \
            --body "REL item and software BOM for version $VERSION, written by the release job. Artifacts are attached to the workflow run."

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.ver.outputs.version }}
          path: artifacts/
