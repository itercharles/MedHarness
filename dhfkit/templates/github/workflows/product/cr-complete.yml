name: Complete CR In DHF

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  complete-cr:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Extract CR ID from PR title
        id: cr
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          CR_ID=$(echo "$PR_TITLE" | grep -oE 'CR-[0-9]+' | head -n 1 || true)
          if [ -z "$CR_ID" ]; then
            echo "No CR ID found in PR title; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "cr_id=$CR_ID" >> "$GITHUB_OUTPUT"

      - name: Check out DHF repo
        if: steps.cr.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          repository: {{github_org}}/{{dhf_repo_name}}
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: dhf

      - name: Set up Python
        if: steps.cr.outputs.skip != 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install MedHarness
        if: steps.cr.outputs.skip != 'true'
        run: pip install medharness

      - name: Complete CR in DHF
        if: steps.cr.outputs.skip != 'true'
        run: |
          cd dhf
          git config user.name "GitHub Actions [bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cd ..
          medharness cr workflow complete-from-github-pr \
            --dhf-repo dhf \
            --event "$GITHUB_EVENT_PATH" \
            --by "github-actions[bot]" \
            --push
