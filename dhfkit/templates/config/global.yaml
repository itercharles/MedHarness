project_name: "My Medical Device Software"

global_lifecycle:
  states:
  - id: new
    label: New
    action_label: Submit
    icon: "\U0001F195"
    color: info
  - id: rejected
    label: Rejected
    action_label: Reject
    icon: "\u274C"
    color: danger
    is_stable: true
  - id: draft
    label: Draft
    action_label: Create
    icon: "\U0001F4DD"
    color: warning
    is_initial: true
  - id: open
    label: Open
    action_label: Submit
    icon: "\U0001F4C2"
    color: info
  - id: in_progress
    label: In Progress
    action_label: Start Work
    icon: "\U0001F527"
    color: warning
  - id: resolved
    label: Resolved
    action_label: Resolve
    icon: "\u2705"
    color: success
  - id: approved
    label: Approved
    action_label: Approve
    icon: "\u2705"
    color: success
  # The CR workflow's own states. cr.yaml transitions to `design` and `develop`
  # and this list had only `designing` and `developing`, so a scaffolded CR
  # could reach nothing but `rejected` — `completed` was unreachable, and with
  # it every gate and release baseline that requires a completed CR.
  - id: design
    label: Design
    action_label: Start Design
    icon: "\U0001F4D0"
    color: info
  - id: develop
    label: Develop
    action_label: Start Development
    icon: "\U0001F527"
    color: warning
  - id: completed
    label: Completed
    action_label: Complete
    icon: "\U0001F3AF"
    color: success
  - id: released
    label: Released
    action_label: Release
    icon: "\U0001F680"
    color: success
    is_stable: true
  - id: cancelled
    label: Cancelled
    action_label: Cancel
    icon: "\U0001F6AB"
    color: secondary
    is_stable: true
  - id: closed
    label: Closed
    action_label: Close
    icon: "\U0001F6AB"
    color: secondary
    is_stable: true
# Text in a title or content field that says nothing yet. `verify dhf` warns, and
# fails under --strict, so the starter items cannot ship in a release.
placeholder_patterns:
- '^\s*(TBD|TBC|TODO|N/A|\.\.\.|-)\s*$'
- 'replace (this )?with'
- 'lorem ipsum'
traceability_matrices:
- name: Complete Requirements Chain
  description: Full traceability from use cases through all requirement levels to
    detailed design
  path:
  - UC
  - CRS
  - SYS
  - SRS
  - SWDD
- name: System Requirements to System Architecture
  description: System requirements and their architectural designs
  path:
  - SYS
  - SYSARCH
- name: Module to Detailed Design
  description: Every software module has at least one detailed design item
  path:
  - MODULE
  - SWDD
- name: Risk to Control Measures
  description: Risks to risk control measures
  path:
  - RISK
  - RCM
required_traceability:
- source_type: SRS
  direction: upstream
  field: derives_from
  target_type: SYS
  min_count: 1
- source_type: SWDD
  direction: upstream
  field: implements
  target_type: SRS
  min_count: 1
- source_type: SWDD
  direction: upstream
  field: module
  target_type: MODULE
  min_count: 1
- source_type: RCM
  direction: upstream
  field: mitigates
  target_type: RISK
  min_count: 1
- source_type: RCM
  direction: upstream
  field: implements
  target_type: SYS
  min_count: 1
- source_type: CRS
  direction: downstream
  target_type: SYS
  min_count: 1
document_specifications:
  UC:
    source: requirements_specification.md.j2
    doc_type_name: Use Case
  CRS:
    source: customer_requirement_specification.md.j2
    doc_type_name: Customer Requirement
  SYS:
    source: requirements_specification.md.j2
    doc_type_name: System Requirement
  SRS:
    source: requirements_specification.md.j2
    doc_type_name: Software Requirement
  SOUP:
    source: soup_specification.md.j2
    doc_type_name: SOUP
  MODULE:
    source: software_design_document.md.j2
    doc_type_name: Software Module
  SWDD:
    source: requirements_specification.md.j2
    doc_type_name: Software Detailed Design Document
  SYSARCH:
    source: architecture_design_specification.md.j2
    doc_type_name: System Architecture Specification
  RISK:
    source: risk_specification.md.j2
    doc_type_name: Risk Analysis
  RCM:
    source: rcm_specification.md.j2
    doc_type_name: Risk Control Measures
  CR:
    source: change_request_specification.md.j2
    doc_type_name: Change Request
