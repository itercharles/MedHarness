code: SYS
role: system_requirement
name: System Requirement
description: |-
  Belongs here: behaviour observable at the system boundary, black-box, testable without knowing the software's structure.
  Not here: how a module achieves it (SRS or SWDD), or the user's need itself (CRS). An internal change that no one outside the system can observe needs no new SYS.
  Example: "The system shall display the software version in the About dialog."
prefix: SYS-
directory: 02_sys
properties:
- id
- name: title
  format: short_text
  label: Title
- name: content
  format: long_text
  label: Requirement Description
  required: true
- name: category
  format: select
  label: Category
  required: true
  options:
  - Functional
  - Performance
  - Security
  - Usability
  - Reliability
  - Maintainability
  - Change Control
  - Document Management
  default: Functional
- name: verification_method
  format: multiselect
  label: Verification Methods
  options:
  - Test
  - Inspection
  - Analysis
  - Demonstration
- name: critical_safety
  format: checkbox
  label: Critical Safety
- name: satisfies
  format: item_multiselect
  label: Satisfies (Customer Requirements)
  target_types:
  - CRS
- name: testing
  format: long_text
  label: Testing
- name: verification_criteria
  format: long_text
  label: Verification Criteria
- name: verification_method
  format: multiselect
  label: Verification Method
  options:
  - Test
  - Inspection
  - Analysis
  - Demonstration
has_verification: true
