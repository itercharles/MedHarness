code: MODULE
role: software_module
name: Software Module
description: |-
  Belongs here: one software unit, with its responsibility and interfaces. A module is described by what it owns, not by the requirement that created it.
  Not here: a design decision inside the module (SWDD).
prefix: MODULE-
directory: 04_modules
has_verification: false
properties:
- id
- name: title
  format: short_text
  label: Module Name
- name: content
  format: long_text
  label: Description
- name: safety_class
  format: short_text
  label: Safety Class
  # IEC 62304 §4.3(b): a software item may carry a lower class than the system
  # when segregation is documented. Leave unset to inherit the system class.
- name: segregation_rationale
  format: long_text
  label: Segregation Rationale
  # Required when safety_class is set below the system class — how separation
  # from higher-class items is achieved and assured.
- name: paths
  format: list
  label: Code Paths
  # Repository-relative paths this module owns: a directory ends in "/", anything
  # else is a file or a glob. Once any module declares them, `verify impact`
  # ties changed code to the module's SWDD and SRS items.
