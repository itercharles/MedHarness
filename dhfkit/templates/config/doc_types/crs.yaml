code: CRS
role: customer_requirement
name: Customer Requirement
description: |-
  Belongs here: a need a user or customer would state, in user language, with the value it delivers.
  Not here: how the system meets it, or a detail of one screen. A wording, styling or label change that leaves every existing need true needs no new CRS.
  Example: "The planner can see which software version produced a plan."
prefix: CRS-
directory: 01_crs
properties:
- id
- name: title
  format: short_text
  label: Title
- name: content
  format: long_text
  label: Content
- name: user_group
  format: short_text
  label: User Group
- name: source
  format: short_text
  label: Source
- name: derives_from
  format: relationship
  target_types:
  - UC
  label: Derives From
- name: rationale
  format: long_text
  label: Rationale
- name: stakeholder
  format: short_text
  label: Stakeholder
- name: priority
  format: select
  options:
  - Critical
  - High
  - Medium
  - Low
  default: Medium
  label: Priority
- name: testing
  format: long_text
  label: Testing
- name: verification_criteria
  format: long_text
  label: Verification Criteria
- name: verification_method
  format: multiselect
  label: Verification Method
  options:
  - Test
  - Inspection
  - Analysis
  - Demonstration
has_verification: true
