code: SRS
role: software_requirement
name: Software Requirement
description: |-
  Belongs here: the behaviour of a software item, specific enough to be tested at software level with a stated input and result.
  Not here: a restatement of a system requirement, or a design choice (SWDD). One shall per item; a second behaviour is a second SRS or a new test point.
  Example: "The About dialog shall list the version string from the build metadata."
prefix: SRS-
directory: 03_srs
properties:
- id
- name: title
  format: short_text
  label: Title
- name: content
  format: long_text
  label: Content
- name: derives_from
  format: relationship
  target_types:
  - SYS
  label: Derives From
- name: performance
  format: long_text
  label: Performance
- name: testing
  format: long_text
  label: Testing
- name: verification_criteria
  format: long_text
  label: Verification Criteria
- name: verification_method
  format: multiselect
  label: Verification Method
  options:
  - Test
  - Inspection
  - Analysis
  - Demonstration
has_verification: true
verification_states:
- not_verified
- verified
- failed
