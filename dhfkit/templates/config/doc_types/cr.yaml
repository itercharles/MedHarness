code: CR
role: change_request
name: Change Request
prefix: CR-
directory: 07_cr
properties:
- id
- name: title
  format: short_text
  label: Title
- name: content
  format: long_text
  label: Content
- name: description
  format: long_text
  label: Description
- name: justification
  format: long_text
  label: Justification
- name: impact_assessment
  format: long_text
  label: Impact Assessment
- name: priority
  format: select
  options:
  - High
  - Medium
  - Low
  label: Priority
- name: requested_by
  format: short_text
  label: Requested By
- name: assigned_to
  format: short_text
  label: Assigned To
- name: affected_items
  format: relationship
  label: Affected Items
- name: reviewed_items
  format: relationship
  label: Reviewed Items
  description: Items that depend on a changed item and were reviewed, needing no change
- name: affected_risk_items
  format: relationship
  target_types:
  - RISK
  - RCM
  label: Affected Risk Items
- name: target_version
  format: short_text
  label: Target Version
- name: category
  format: short_text
  label: Category
- name: implementation_notes
  format: long_text
  label: Implementation Notes
- name: triage_result
  label: Triage Result
  # {verdict, notes} written by `build plan` only when it rejects the CR (step 2); an accepted CR has none
- name: impact_analysis
  label: Impact Analysis
  # {assumptions, anchors, unchanged, created, dimensions} written by `build plan`, steps 1-5
- name: target_release
  format: relationship
  target_types:
  - REL
  label: Target Release
lifecycle:
  transitions:
  - from_states:
    - null
    to_state: new
  - from_states:
    - new
    to_state: design
    label: Start Design
  - from_states:
    - design
    to_state: develop
    label: Start Development
    # `develop` is a design that was recorded and approved; a design pull request carries this
    # move, and merging it is the approval.
    criteria:
    - id: design_recorded
      name: Implementation notes written
      check_type: field_not_empty
      field: implementation_notes
      required: true
  - from_states:
    - develop
    to_state: completed
    label: Complete
    # `verify completion` checks these in CI after the fact; checking them here
    # refuses the transition instead.
    criteria:
    - id: implementation_recorded
      name: Implementation notes written
      check_type: field_not_empty
      field: implementation_notes
      required: true
    - id: risk_impact_assessed
      name: Risk impact recorded
      # `field_present`, not `field_not_empty`: an empty list means the risks
      # were assessed and none are affected, which is a complete answer.
      check_type: field_present
      field: affected_risk_items
      required: true
    - id: affected_items_recorded
      name: Affected items recorded
      # What `verify completion` checks; [] means the CR changed no item.
      check_type: field_present
      field: affected_items
      required: true
  # A completed CR whose approval no longer stands (changes were requested after it) goes back to
  # `develop`, and is completed again when the new code is approved. One that a release lists
  # shipped; it is not reopened, a new CR changes it.
  - from_states:
    - completed
    to_state: develop
    label: Reopen
    criteria:
    - id: not_released
      name: Not part of a release
      check_type: not_listed_in
      type: REL
      field: included_items
      required: true
  - from_states:
    - new
    - design
    to_state: rejected
    label: Reject
  # Work stopped before completion — its PR closed unmerged. `rejected` is the
  # triage verdict; `cancelled` is the change abandoned after it was accepted.
  - from_states:
    - new
    - design
    - develop
    to_state: cancelled
    label: Cancel
