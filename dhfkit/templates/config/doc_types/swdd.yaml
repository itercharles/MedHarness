code: SWDD
role: design_detail
has_verification: true
name: Software Detailed Design
description: |-
  Belongs here: a design decision inside one module that a developer given only the software requirement could get meaningfully wrong. It carries both `implements` (the SRS) and `module` (the MODULE).
  Not here: visual-only changes, copy, configuration values or trivial fixes obvious from the requirement.
prefix: SWDD-
directory: 05_swdd
properties:
- id
- name: title
  format: short_text
  label: Title
- name: content
  format: long_text
  label: Content
- name: implements
  format: relationship
  target_types:
  - SRS
  label: Implements
- name: module
  format: relationship
  target_types:
  - MODULE
  label: Module
