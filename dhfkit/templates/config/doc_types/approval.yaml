code: APPROVAL
role: approval
name: Approval
prefix: APR-
directory: 13_approvals
properties:
- id
- name: signer
  format: short_text
  label: Signer
- name: roles
  format: list
  label: Roles
- name: signed_at
  format: short_text
  label: Signed at
  # ISO 8601, UTC.
- name: statement
  format: long_text
  label: Statement
- name: items
  format: list
  label: Approved items
  # Each entry: {id, hash, meaning?}. The hash is `sha256:` and the hex digest of the item
  # file's bytes, so editing the item leaves its approval behind.
- name: key
  format: short_text
  label: Key fingerprint
  # SHA256 fingerprint of the public key that signed this file. The detached signature
  # sits beside it as <id>.yaml.sig.
