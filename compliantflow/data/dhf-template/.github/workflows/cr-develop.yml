name: Develop CR

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'DHF/documents/specs/CR-*-Spec.md'

jobs:
  develop:
    if: ${{ github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Extract CR ID from merged spec
        id: cr
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          SPEC_FILE=$(git diff --name-only "$BASE_SHA" "$MERGE_SHA" | grep -E '^DHF/documents/specs/CR-.*-Spec\.md$' | head -n 1 || true)
          if [ -z "$SPEC_FILE" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          CR_ID=$(basename "$SPEC_FILE" -Spec.md)
          echo "cr_id=$CR_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.cr.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: Install DHF utils dependencies
        if: steps.cr.outputs.skip != 'true'
        run: pip install click jinja2 markdown pydantic PyYAML gitpython

      - name: Transition CR to developing
        if: steps.cr.outputs.skip != 'true'
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}:${PWD}/DHF"
          python -m utils item transition "${{ steps.cr.outputs.cr_id }}" developing --by "github-actions[bot]"

      - name: Clone product repository
        if: steps.cr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PRODUCT_REPO_TOKEN }}
        run: |
          gh repo clone itercharles/CompliantFlow "../CompliantFlow"

      - uses: actions/setup-node@v4
        if: steps.cr.outputs.skip != 'true'        with:
          node-version: '20'

      - name: Install Claude Code
        if: steps.cr.outputs.skip != 'true'        run: npm install -g @anthropic-ai/claude-code

      - name: Implement approved spec
        if: steps.cr.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRODUCT_REPO_TOKEN: ${{ secrets.PRODUCT_REPO_TOKEN }}
          CR_ID: ${{ steps.cr.outputs.cr_id }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            PROMPT=$(sed "s/{{cr_id}}/$CR_ID/g" .github/prompts/cr-develop.md)
            claude -p --dangerously-skip-permissions "$PROMPT"
          else
            echo "ANTHROPIC_API_KEY not set — writing stub implementation for pipeline testing."

            # Stub DHF item: a placeholder SRS linked to the CR
            STUB_SRS="DHF/items/07_srs/$(echo $CR_ID | tr '[:upper:]' '[:lower:]')-stub-srs.yaml"
            cat > "$STUB_SRS" <<EOF
id: $(echo $CR_ID | tr '[:upper:]' '[:lower:]')-stub-srs
title: "[STUB] Placeholder SRS for $CR_ID"
description: >
  This is a stub SRS item generated by the pipeline dry-run (no ANTHROPIC_API_KEY).
  Replace with real content before merging.
derives_from: []
type: SRS
status: draft
EOF

            # Stub code change in product repo
            STUB_CODE="../CompliantFlow/stub-${CR_ID}.md"
            cat > "$STUB_CODE" <<EOF
# Stub implementation for $CR_ID

> **Note:** This file was generated by the pipeline dry-run (no \`ANTHROPIC_API_KEY\`).
> Delete this file and replace with real implementation before merging.

See spec: DHF/documents/specs/${CR_ID}-Spec.md
EOF
          fi

      - name: Push DHF implementation branch
        if: steps.cr.outputs.skip != 'true'
        env:
          CR_ID: ${{ steps.cr.outputs.cr_id }}
        run: |
          git checkout -b "develop/$CR_ID"
          git config user.name "GitHub Actions [bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DHF/items/
          if [ -d DHF/documents/specs ]; then
            git add DHF/documents/specs/
          fi
          git commit -m "feat: implement $CR_ID"
          git push --set-upstream origin "develop/$CR_ID"

      - name: Open DHF items PR
        if: steps.cr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_ID: ${{ steps.cr.outputs.cr_id }}
        run: |
          gh pr create \
            --head "develop/$CR_ID" \
            --base main \
            --title "dhf($CR_ID): implementation updates" \
            --body "Automated DHF implementation updates for $CR_ID."

      - name: Push product repo branch and PR
        if: steps.cr.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.PRODUCT_REPO_TOKEN }}
          CR_ID: ${{ steps.cr.outputs.cr_id }}
        working-directory: ../CompliantFlow
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "PRODUCT_REPO_TOKEN not set — skipping product repo PR."
            exit 0
          fi
          git checkout -b "feat/$CR_ID"
          git config user.name "GitHub Actions [bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --staged --quiet; then
            git commit -m "feat: implement $CR_ID"
            git push --set-upstream origin "feat/$CR_ID"
            gh pr create \
              --head "feat/$CR_ID" \
              --base main \
              --title "feat($CR_ID): implement approved spec" \
              --body "Automated product implementation for $CR_ID."
          else
            echo "No product repo changes to commit."
          fi
