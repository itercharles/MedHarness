name: Analyze CR

on:
  pull_request:
    types: [closed]
    branches: [main]
    paths:
      - 'DHF/items/CR-*.yaml'
  workflow_dispatch:
    inputs:
      cr_id:
        description: 'CR ID to analyze (e.g. CR-056)'
        required: true
        type: string

jobs:
  analyze:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Find new CR items from merged PR
        id: crs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          MANUAL_CR_ID: ${{ inputs.cr_id }}
        run: |
          if [ -n "$MANUAL_CR_ID" ]; then
            echo "cr_id=$MANUAL_CR_ID" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          FILES=$(git diff --name-status "$BASE_SHA" "$MERGE_SHA" | awk '$1 == "A" && $2 ~ /^DHF\/items\/CR-.*\.yaml$/ { print $2 }')
          if [ -z "$FILES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          printf '%s\n' "$FILES" > /tmp/cr_files.txt
          CR_ID=$(basename "$(head -n 1 /tmp/cr_files.txt)" .yaml)
          echo "cr_id=$CR_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        if: steps.crs.outputs.skip != 'true'
        with:
          python-version: '3.11'

      - name: Install DHF utils dependencies
        if: steps.crs.outputs.skip != 'true'
        run: pip install click jinja2 markdown pydantic PyYAML gitpython

      - name: Transition CR to analyzing
        if: steps.crs.outputs.skip != 'true'
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}:${PWD}/DHF"
          python -m utils item transition "${{ steps.crs.outputs.cr_id }}" analyzing --by "github-actions[bot]"

      - uses: actions/setup-node@v4
        if: steps.crs.outputs.skip != 'true'
        with:
          node-version: '20'

      - name: Install Claude Code
        if: steps.crs.outputs.skip != 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Generate CR spec
        if: steps.crs.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PRODUCT_REPO_TOKEN: ${{ secrets.PRODUCT_REPO_TOKEN }}
          CR_ID: ${{ steps.crs.outputs.cr_id }}
        run: |
          SPEC="DHF/documents/specs/${CR_ID}-Spec.md"
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            PROMPT=$(sed "s/{{cr_id}}/$CR_ID/g" .github/prompts/cr-analyze.md)
            claude -p --dangerously-skip-permissions "$PROMPT"
          else
            echo "ANTHROPIC_API_KEY not set — writing stub spec for pipeline testing."
            CR_TITLE=$(python3 -c "
import yaml, sys
with open('DHF/items/${CR_ID}.yaml') as f:
    d = yaml.safe_load(f)
print(d.get('title', 'No title'))
")
            cat > "$SPEC" <<EOF
# ${CR_ID} Plan Spec (stub)

> **Note:** This is a placeholder spec generated because \`ANTHROPIC_API_KEY\` is not
> configured. Replace this content with a real spec before approving.

## Change Request

**ID:** ${CR_ID}
**Title:** ${CR_TITLE}

## Technical Approach

_To be filled in._

## DHF Items to Create or Update

_To be filled in._

## Product Code Changes

_To be filled in._

## Verification and Test Cases

_To be filled in._

## Compliance and Traceability

_To be filled in._
EOF
          fi

      - name: Commit spec branch
        if: steps.crs.outputs.skip != 'true'
        env:
          CR_ID: ${{ steps.crs.outputs.cr_id }}
        run: |
          git checkout -b "spec/$CR_ID"
          git config user.name "GitHub Actions [bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "DHF/items/$CR_ID.yaml" "DHF/documents/specs/$CR_ID-Spec.md"
          git commit -m "feat: analyze $CR_ID"
          git push --set-upstream origin "spec/$CR_ID"

      - name: Open spec PR
        if: steps.crs.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CR_ID: ${{ steps.crs.outputs.cr_id }}
        run: |
          gh pr create \
            --head "spec/$CR_ID" \
            --base main \
            --title "spec($CR_ID): AI analysis plan" \
            --body "Automated spec generated for $CR_ID."

