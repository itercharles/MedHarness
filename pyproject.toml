[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "compliantflow"
version = "0.0.1"
description = "Open-source design-controlled development harness for medical software engineering"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "click",
    "networkx",
    "pyyaml",
    "python-frontmatter",
    "jinja2",
    "python-docx",
    "gitpython",
    "python-dateutil",
    "python-dotenv",
    "dhf_util",
    "markdown",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps",
    "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
ai = ["google-genai"]
docs = ["weasyprint"]
full = ["compliantflow[ai,docs]"]

[project.urls]
Homepage = "https://github.com/compliantflow/compliantflow"
"Bug Tracker" = "https://github.com/compliantflow/compliantflow/issues"
Documentation = "https://github.com/compliantflow/compliantflow#readme"

[project.scripts]
compliantflow = "compliantflow.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["compliantflow*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
compliantflow = ["data/**/*", "data/**/.gitkeep"]
