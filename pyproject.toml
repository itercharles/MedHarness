[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "medharness"
version = "0.6.1"
description = "Open-source design-controlled development infrastructure for medical device and SaMD teams — includes dhfkit"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "MedHarness Contributors" },
]
keywords = [
    "medical-device",
    "iec-62304",
    "iso-14971",
    "iec-82304-1",
    "dhf",
    "design-history-file",
    "traceability",
    "compliance",
    "samd",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "pydantic>=2.0",
    "click",
    "networkx",
    "pyyaml",
    "python-frontmatter",
    "jinja2",
    "python-docx",
    "gitpython",
    "python-dateutil",
    "python-dotenv",
    "markdown",
]

[project.optional-dependencies]
ai = ["google-genai"]
docs = ["weasyprint"]
dev = ["pytest", "pytest-cov"]
full = ["medharness[ai,docs]"]

[project.urls]
Homepage = "https://github.com/itercharles/MedHarness"
Source = "https://github.com/itercharles/MedHarness"
"Bug Tracker" = "https://github.com/itercharles/MedHarness/issues"
Documentation = "https://github.com/itercharles/MedHarness#readme"

[project.scripts]
medharness = "medharness.cli:main"
dhfkit = "dhfkit.cli:main"
dhf = "dhfkit.cli:main"

[tool.setuptools]
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
where = ["."]
include = ["medharness*", "dhfkit*"]
exclude = ["tests*", "dhfkit.tests*"]

[tool.setuptools.package-data]
"dhfkit" = ["templates/**/*"]
"medharness" = ["prompts/**/*"]

[tool.setuptools.exclude-package-data]
"dhfkit" = ["tests", "tests/*", "tests/**/*"]
