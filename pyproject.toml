[build-system]
requires = ["setuptools>=68", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "compliantflow"
dynamic = ["version"]
description = "Compliance checking and DHF management for medical device software"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "click",
    "networkx",
    "pyyaml",
    "python-frontmatter",
    "jinja2",
    "python-docx",
    "gitpython",
    "python-dateutil",
    "python-dotenv",
    "dhf_util",
    "google-genai",
    "markdown",
    "weasyprint",
]

[project.scripts]
compliantflow = "compliantflow.cli:main"

[tool.setuptools_scm]
fallback_version = "0.0.0"

[tool.setuptools.packages.find]
where = ["."]
include = ["compliantflow*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
compliantflow = ["data/**/*", "data/**/.gitkeep"]
