id: TC-SYS-008-001
title: Verify Change Request Creation
content: |
  **Objective**: Verify that users can create change requests with auto-generated IDs
  
  **Preconditions**:
  - CompliantFlow application is running
  - User has access to Change Management page
  
  **Test Steps**:
  1. Navigate to Change Management page
  2. Go to "Submit Change" tab
  3. Fill in the form:
     - Title: "Test Change Request"
     - Type: "bug_fix"
     - Priority: "medium"
     - Created by: "Test User"
     - Description: "Test description"
  4. Click "Submit Change Request"
  
  **Expected Results**:
  - Change request is created with auto-generated ID (CR-XXX format)
  - Success message is displayed
  - YAML file is created in DHF/change_requests/
  - Change request appears in Review Changes tab
  
  **Actual Results**: PASS
  
  **Test Data**: N/A
  
  **Notes**: Verified with CR-001 through CR-005 created successfully
