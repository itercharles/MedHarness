id: TC-SYS-008-004
title: Verify MDCG 2020-3 Significance Assessment
content: |
  **Objective**: Verify that significance assessment correctly identifies significant changes per MDCG 2020-3
  
  **Preconditions**:
  - Change request with risk assessment exists
  - Items with critical_safety flag exist in graph
  
  **Test Steps**:
  1. Create change affecting safety-critical requirement
  2. Analyze impact
  3. Review significance assessment
  4. Verify rationale is provided
  
  **Expected Results**:
  - Changes affecting safety-critical requirements are marked significant
  - Changes affecting risk control measures are marked significant
  - Critical priority changes are marked significant
  - Significance rationale explains the determination
  - Non-significant changes are correctly identified
  
  **Actual Results**: PASS
  
  **Test Data**: 
  - SYS-008 (marked as critical_safety: true)
  - Change request with type: "new_feature"
  
  **Notes**: Automated assessment follows MDCG 2020-3 criteria
