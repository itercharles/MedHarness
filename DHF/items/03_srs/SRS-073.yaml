id: SRS-073
title: build validation reports an installed wheel against its release, without reading
  the user's project
content: '`build validation` shall run every case in a temporary directory, never
  reading the DHF that `--dhf` names, and shall write a report that checks each installed
  file of a wheel against its RECORD, lists each dependency of the release record''s
  tested configuration beside the installed version, and gives a result for every
  test point of the release record with its text. It prints the result, the report''s
  path and the errors as JSON on stdout, and nothing else.'
verification_criteria: From a wheel built with a release record and installed outside
  the source tree, the report shows the installation verifiable with no altered file,
  names the record's version and commit, every dependency of an identical configuration
  is `equal`, it lists all 176 high-risk test points, and every point a case exercises
  passed. A dependency at another version is `different` and one not installed is
  `missing`, and neither fails the validation. The DHF named by `--dhf` is not read
  or created, the report file contains the requirement text, and stdout is one JSON
  object with `result`, `path` and `errors`.
testing: 'T1: An installed wheel is checked against its release record: its files,
  its release, an identical configuration and every high-risk test point.

  T2: A dependency at another version, or not installed, is listed as a deviation
  without failing the validation.

  T3: The DHF that --dhf names is never read or created.

  T4: The report file is written, with the requirement text of each point.

  T5: A PDF library that prints when it is imported does not spoil the JSON on stdout.'
verification_method:
- Test
risk: medium
type: SRS
