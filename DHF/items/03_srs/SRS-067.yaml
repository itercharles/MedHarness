id: SRS-067
title: build approvals' sheet shows each signature that covers a document, and what
  the release pins
content: '`build approvals` shall, for a release `verify approval --release` passes,
  write an approval sheet listing each document with its file, hashes and owning roles
  and every signature that covers it (signer, record, key fingerprint, statement),
  the release''s DHF and approvers-list hashes and the approvers list it pins, so
  that who approved what can be read without the tooling.'
verification_criteria: The exit code is 0, `outcome` is `completed`, `path` names
  the sheet and `documents` and `signatures` count what it shows. The sheet holds
  each manifest document's file and hashes, each signer's name, record ID and key
  fingerprint, the statement, the DHF and approvers hashes, each approver's fingerprint
  and roles; a document with no owning role says no signature is required; a signature
  made without proven presence is marked.
testing: 'T1: A signed release gets a sheet naming every document, signer, record
  and key, and the pinned hashes.

  T2: A signature made without proven presence is marked on the sheet.

  T3: A document no role owns shows that no signature is required.

  T4: The sheet lists the approvers list the release pins.'
risk: medium
verification_method:
- Test
type: SRS
