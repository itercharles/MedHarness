id: SRS-034
title: verify impact accepts a branch that changes exactly the items its CR lists
risk: high
content: '`verify impact` shall make no `dhf_branch` finding when the items the branch
  changes, created, updated or deleted, uncommitted work included, are exactly the
  items the CR lists, apart from the CR, so that a CR that did what it said is not
  blocked on it.'
verification_criteria: '`errors` holds no `dhf_branch` finding and, with `--code-path`
  and a change under it, no `code_branch` finding.'
testing: 'T1: A branch that changes several listed items, created and updated, draws
  no dhf_branch finding.

  T2: An item the branch deleted counts as changed.

  T3: On a real repository, uncommitted changes to the listed items and code draw
  no dhf_branch or code_branch finding from `verify impact`.'
verification_method:
- Test
type: SRS
