id: SWAD-011
title: "PR-CR Automation Architecture"
content: |
  **Architecture Overview:**
  
  The PR-CR automation system uses GitHub Actions workflows to enforce change control 
  and maintain traceability between code changes and change requests.
  
  **Components:**
  
  1. **validate-pr.yml Workflow**
     - Trigger: PR opened, edited, synchronized
     - Responsibilities:
       - Validate CR reference
       - Detect affected items
       - Update CR with traceability data
       - Commit updates to PR branch
  
  2. **CR Data Model**
     - Storage: YAML files in DHF/items/09_cr/
     - Fields:
       - affected_items: List[str] - Item IDs modified by PRs
       - implementation_prs: List[PRInfo] - PR tracking records (number, URL, title)
  
  **Data Flow:**
  
  ```
  PR Created
    ↓
  validate-pr.yml
    ↓
  Extract CR-XXX → Validate CR → Analyze Changes
    ↓                              ↓
  CR Status Check              Git Diff Analysis
    ↓                              ↓
  Update CR YAML ← affected_items + PR info
    ↓
  Commit to PR Branch
    ↓
  PR Merged (via GitHub UI)
  ```
  
  **Integration Points:**
  
  - **GitHub Events API:** Triggers workflows on PR events
  - **Git Operations:** Diff analysis, commits, pushes
  - **YAML Processing:** PyYAML for CR file manipulation
  - **Regex Pattern Matching:** CR-XXX extraction
  
  **Design Patterns:**
  
  - **Event-Driven:** Workflows triggered by GitHub events
  - **Idempotent Updates:** Duplicate prevention in lists
  - **Fail-Fast Validation:** Early exit on validation errors
  
  **Security:**
  
  - Uses GITHUB_TOKEN with write permissions
  - Bot commits identified as github-actions[bot]
  - [skip ci] prevents infinite workflow loops
  
  **Scalability:**
  
  - O(N) complexity for file analysis
  - Stateless workflows (no persistent storage)
  - Parallel PR processing supported
  
