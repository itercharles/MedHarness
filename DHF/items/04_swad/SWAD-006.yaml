id: SWAD-006
title: Traceability Graph Architecture
content: |-
  **Purpose:** Bidirectional traceability graph with analysis capabilities
  
  **Components:**
  
  **GraphEngine**
  - Uses NetworkX directed graph for traceability
  - Maintains bidirectional edges between items
  - Detects orphan items (no upstream/downstream links)
  - Performs change impact analysis
  - Calculates coverage metrics
  
  **Design Decisions:**
  - NetworkX library for graph operations
  - Directed edges represent traceability relationships
  - Node attributes store item metadata
  - Edge attributes store relationship types
  
  **Orphan Detection Algorithm:**
  1. Build complete traceability graph
  2. Identify source item types (e.g., requirements)
  3. Find items with no incoming edges (no upstream)
  4. Find items with no outgoing edges (no downstream)
  5. Report orphans by type
  
  **Change Impact Analysis:**
  1. Start from changed item
  2. Traverse downstream edges
  3. Collect all affected items
  4. Return impact set
  
  **Interfaces:**
  - build_from_items(items: List[Item]) → None
  - find_orphans() → List[dict]
  - get_downstream(uid: str) → Set[str]
  - get_upstream(uid: str) → Set[str]
  - calculate_coverage(source_type: str, target_type: str) → dict
design:
- SRS-001
- SRS-007
- SRS-011
- SRS-016
status: approved
