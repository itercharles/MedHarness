id: SWAD-001
title: Item Management Component
content: |-
  Component for managing DHF items with file-based storage and version control.
  
  **Technologies**:
  - PyYAML for YAML parsing and serialization
  - Pydantic for schema validation
  - GitPython for version control operations
  - Pathlib for file system operations
  
  **Component Structure**:
  - ItemLoader: Load items from YAML files
  - ItemSaver: Save items with Git commits
  - ItemValidator: Validate against schema
  
  **Key Interfaces**:
  ```python
  class ItemLoader:
      def load_all() -> List[Item]
      def load_by_id(uid: str) -> Optional[Item]
      def load_by_type(doc_type: str) -> List[Item]
  
  class ItemSaver:
      def save(item: Item, author: str) -> Path
      def delete(uid: str, author: str) -> bool
  
  class ItemValidator:
      def validate(item: dict, schema: dict) -> (bool, List[str])
  ```
  
  **Design Patterns**:
  - Repository pattern for data access abstraction
  - Validator pattern for schema enforcement
design:
- SRS-001
status: approved
