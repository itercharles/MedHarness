id: SWAD-004
title: Universal Page Template Architecture
content: |-
  **Design Pattern:** Template Method + Strategy
  
  **UniversalPageTemplate**
  - Single page template for all document types
  - Reads configuration to determine behavior
  - Dynamically generates forms
  - Renders workflow transitions
  
  **PageGenerator**
  - Creates page files from configuration
  - Minimal boilerplate code
  - Delegates to UniversalPageTemplate
  
  **Benefits:**
  - No code duplication across pages
  - New document types require only configuration
  - Consistent UI across all types
  - Easy to maintain and update
