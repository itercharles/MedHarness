id: SWAD-004
title: Change Management Component
content: |-
  Component for managing change requests with PR integration and impact tracking.
  
  **Technologies**:
  - GitHub REST API for PR data
  - PyYAML for CR file manipulation
  - Regex for CR reference extraction (CR-XXX pattern)
  - Git diff analysis for affected items
  
  **Component Structure**:
  - ChangeRequestManager: CR lifecycle management
  - PRLinker: Link PRs to CRs
  - ImpactAnalyzer: Identify affected items
  - ChangeControlPolicy: Enforce editing restrictions
  
  **Key Interfaces**:
  ```python
  class ChangeRequestManager:
      def create_cr(data: dict, author: str) -> CR
      def update_cr(uid: str, data: dict) -> CR
      def approve_cr(uid: str, approver: str) -> CR
  
  class PRLinker:
      def link_pr_to_cr(pr_number: int, cr_id: str) -> None
      def extract_affected_items(pr_files: List[str]) -> List[str]
  
  class ImpactAnalyzer:
      def analyze_impact(affected_items: List[str]) -> ImpactReport
  ```
  
  **Design Patterns**:
  - State pattern for CR lifecycle
  - Observer pattern for PR events
  - Strategy pattern for impact analysis
  
  **Integration**:
  - GitHub Actions for automated PR-CR linking
  - Webhook-based event processing
design:
- SRS-006
- SRS-007
status: approved
