id: SWAD-002
title: CompliantFlow Core Components
content: |-
  **CompliantFlowCore**
  - Purpose: Central API and orchestration
  - Responsibilities:
    - Item CRUD operations
    - Graph building coordination
    - Workflow execution
    - Document generation
  - Interfaces:
    - get_item(uid: str) -> dict
    - create_item(data: dict, author: str) -> dict
    - update_item(uid: str, data: dict, author: str) -> dict
    - delete_item(uid: str, author: str) -> bool
    - transition_item(uid: str, to_state: str, author: str) -> dict
  
  **GraphEngine**
  - Purpose: Traceability graph analysis
  - Responsibilities:
    - Build NetworkX graph from items
    - Find orphan items
    - Calculate coverage
    - Perform impact analysis
  - Interfaces:
    - build_from_items(items: List[Item]) -> None
    - find_orphans() -> List[dict]
    - calculate_coverage(req_type: str) -> dict
    - get_downstream(uid: str) -> Set[str]
  
  **WorkflowEngine**
  - Purpose: Lifecycle state management
  - Responsibilities:
    - Validate transitions
    - Execute validation criteria
    - Enforce approval rules
  - Interfaces:
    - validate_transition(item: Item, to_state: str) -> (bool, List[str])
    - execute_transition(item: Item, to_state: str) -> Item
  
  **DocumentGenerator**
  - Purpose: Specification document generation
  - Responsibilities:
    - Render Jinja2 templates
    - Generate markdown
    - Convert to PDF
  - Interfaces:
    - generate_specification(doc_type: str) -> Path
    - render_template(template: str, data: dict) -> str
design:
