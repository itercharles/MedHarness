id: SWAD-005
title: Workflow Engine Component
content: |-
  Component for managing configurable item lifecycle workflows.
  
  **Technologies**:
  - Configuration-driven state machines
  - Python dataclasses for workflow definitions
  - Validation framework for transition criteria
  - YAML for workflow configuration
  
  **Component Structure**:
  - WorkflowEngine: State transition management
  - TransitionValidator: Validate transitions
  - CriteriaExecutor: Execute validation criteria
  - WorkflowLoader: Load from configuration
  
  **Key Interfaces**:
  ```python
  class WorkflowEngine:
      def validate_transition(item: Item, to_state: str) -> (bool, List[str])
      def execute_transition(item: Item, to_state: str, author: str) -> Item
      def get_available_transitions(item: Item) -> List[str]
  
  class CriteriaExecutor:
      def execute(criteria: dict, item: Item) -> (bool, str)
  ```
  
  **Design Patterns**:
  - State pattern for lifecycle management
  - Strategy pattern for validation criteria
  - Chain of responsibility for criteria execution
  
  **Criteria Types**:
  - Field validation (field_not_empty)
  - Manual verification checks
  - Linked item status checks
  - Custom validation functions
  
  **Configuration**:
  - Per-document-type workflows
  - Fail-fast validation at startup
