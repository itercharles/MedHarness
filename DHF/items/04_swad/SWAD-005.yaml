id: SWAD-005
title: Workflow Engine Architecture
content: |-
  **Purpose:** Configuration-driven workflow engine for item lifecycle management
  
  **Components:**
  
  **DynamicWorkflowEngine**
  - Loads lifecycle definitions from configuration
  - Validates state transitions against configured rules
  - Executes validation criteria before transitions
  - Supports extensible validation check types
  
  **Design Decisions:**
  - State machine pattern for lifecycle management
  - Configuration-driven (no hardcoded workflows)
  - Validation criteria defined in configuration
  - Support for approval workflows
  
  **State Transition Flow:**
  1. User requests transition to new state
  2. Engine loads lifecycle configuration for item type
  3. Validates transition is allowed (from → to)
  4. Executes validation criteria (if configured)
  5. Updates item status
  6. Triggers post-transition actions
  
  **Interfaces:**
  - get_initial_state() → str
  - get_available_transitions(current_state: str) → List[Transition]
  - validate_transition(item: Item, to_state: str) → (bool, List[str])
  - execute_transition(item: Item, to_state: str, author: str) → Item
implements:
- SRS-006
- SRS-015
status: approved
