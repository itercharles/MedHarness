id: TC-SYS-026-001
status: approved
title: Verify Compliance Score Color Coding
content: Verify that compliance score displays correct color indicators based on percentage thresholds.
prerequisites: Compliance page with test policy groups
steps:
  - Create test policy group with 95% compliance (should be green)
  - Create test policy group with 75% compliance (should be yellow)
  - Create test policy group with 50% compliance (should be red)
  - Check each group and observe color indicators
expected_result: Green indicator for >= 90%, yellow for >= 70%, red for < 70%
links: ["SYS-026"]
verification_status: PASS
