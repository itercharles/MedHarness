id: TC-SYS-010-001
content: '**Objective**: Verify that users can report defects with all required fields
  per SYS-010.


  **Preconditions**: System is running and user has access to Defect Tracking page.


  **Test Steps**:

  1. Navigate to Defect Tracking page → "Report Defect" tab

  2. Fill in title: "Test defect for reporting"

  3. Fill in description: "Detailed description of the defect"

  4. Select severity: "Major"

  5. Enter reporter name: "QA Tester"

  6. Select affected items from dropdown

  7. Enter steps to reproduce

  8. Click "Report Defect" button


  **Expected Results**:

  - Defect is created with auto-generated ID (DEF-XXX)

  - Success message displays defect ID

  - Defect appears in "Manage Defects" tab

  - Defect file saved to DHF/defects/

  - All entered data is persisted correctly


  **Actual Results**: PASS - Defect DEF-005 created successfully with all fields


  **Status**: PASS'
