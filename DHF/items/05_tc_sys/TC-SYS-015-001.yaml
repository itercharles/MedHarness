id: TC-SYS-015-001
status: draft
content: '**Objective**: Verify that all defect changes are tracked in Git per SYS-015.


  **Preconditions**: Git repository is initialized and configured.


  **Test Steps**:

  1. Create a new defect

  2. Execute: git log --oneline -- DHF/defects/DEF-XXX.yaml

  3. Verify commit message includes "Created defect DEF-XXX"

  4. Verify author information is recorded

  5. Assign defect to investigator

  6. Check git log for update commit

  7. Resolve defect with root cause and resolution

  8. Check git log for resolve commit

  9. Verify all commits have descriptive messages

  10. Verify commit history provides complete audit trail


  **Expected Results**:

  - Each defect operation creates a Git commit

  - Commit messages are descriptive and include defect ID

  - Author information is captured correctly

  - Full audit trail is maintained

  - Changes can be tracked and reverted if needed


  **Actual Results**: PASS - Git commits verified for all operations, audit trail
  complete


  **Status**: PASS'
