id: TC-SYS-014-001
content: '**Objective**: Verify that defects can be linked to affected items per SYS-014.


  **Preconditions**: System has existing items (requirements, tests, etc.).


  **Test Steps**:

  1. Navigate to "Report Defect" tab

  2. Create a new defect

  3. In "Affected Items" field, select multiple items (e.g., SYS-003, TC-SYS-003-001)

  4. Submit defect

  5. Navigate to "Manage Defects" tab

  6. Expand the created defect

  7. Verify affected items are displayed correctly

  8. Open defect YAML file

  9. Verify affected_items array contains selected items

  10. Verify links are maintained across system restarts


  **Expected Results**:

  - Defects can be linked to multiple items

  - Links are displayed in UI

  - Links are persisted in YAML storage

  - Traceability is maintained

  - Links survive system restarts


  **Actual Results**: PASS - Defect traceability links work correctly, data persisted


  **Status**: PASS'
