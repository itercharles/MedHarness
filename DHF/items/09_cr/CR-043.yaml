id: CR-043
title: Machine-Readable Compliance Report Export
description: 'Add a --format json output mode to the compliantflow report compliance
  command (and by extension the validate compliance command) that emits a structured
  JSON document containing every check result: check ID, standard, clause reference,
  result (pass/fail), evidence path, failure reason, and the remediation guidance
  added by CR-035. The existing PDF output is unchanged; JSON is an additional output
  target. The JSON schema is versioned and documented. This output is designed for
  programmatic consumption: AI coding agents reading compliance failures to self-correct,
  external tooling (Slack, Jira) consuming compliance state without parsing PDFs,
  and future dashboard or API integrations.'
justification: The CI gate produces a compliance_report.pdf that is designed for human
  reading. AI coding agents and downstream tooling cannot reliably parse PDFs. A structured
  JSON export makes the compliance gate's full result set programmatically accessible,
  enabling the feedback loop between compliance failures and AI-driven DHF corrections
  that Objective 2 requires.
priority: High
target_version: v2.2.0
affected_items:
- SYS-008
- CRS-011
type: CR
status: planned
