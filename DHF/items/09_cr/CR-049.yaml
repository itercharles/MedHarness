id: CR-049
title: Compliance-Aware PR Review Agent
description: 'Implement a compliantflow review-pr command (and corresponding GitHub
  Actions workflow) that acts as a suggestion layer on pull requests: it parses the
  PR diff, identifies changed DHF YAML items, traverses their item chains via get_item_chain(),
  and produces a markdown checklist of required DHF actions using the LLM backend
  (GeminiBackend or OllamaBackend via the existing LLMBackend protocol). The checklist
  is posted as a PR comment. The baseline scope is DHF YAML changes only — source
  code to DHF item mapping is a v2 enhancement. The agent is explicitly a suggestion
  layer: it has no pass/fail exit code and does not gate the PR. The existing CI gate
  remains the authoritative compliance blocker. Prompt engineering is the primary
  implementation risk and must be validated against representative PR diffs before
  release.'
justification: 'The CI gate catches compliance failures after a commit is made. The
  PR review agent provides earlier, richer feedback: before the commit is merged,
  it tells the author which DHF items are affected by their changes and what DHF updates
  are required. For AI coding agents authoring PRs, this creates a closed loop — the
  agent can read the checklist and update the DHF in the same PR. This is the concrete
  realisation of Objective 3: CompliantFlow as the compliance harness that makes AI
  coding viable for regulated medtech development.'
priority: High
target_version: v3.0.0
