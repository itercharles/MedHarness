id: CR-026
title: Innolitics RDM Migration Tooling
description: Implement a compliantflow migrate rdm command that converts an Innolitics
  RDM repository (requirements in YAML/JSON with reST documents) into a CompliantFlow
  DHF structure. The migration shall map RDM requirement types to CompliantFlow doc
  types, preserve traceability links, convert document content to Markdown, and produce
  a migration report summarising items created, skipped, and requiring manual review.
justification: 'Innolitics RDM is the most widely used open-source medical device
  requirements tool (~500 GitHub stars) and is effectively unmaintained. Its user
  base represents the highest-quality near-term acquisition target: teams already
  doing docs-as-code compliance, pre-qualified for the CLI workflow, and actively
  looking for a supported alternative. Migration tooling eliminates the main switching
  cost. This window is time-bounded — another tool will ship migration support eventually.'
priority: High
affected_items:
- SYS-006
- CRS-008
impact_assessment: Adds compliantflow/migrate/rdm.py (RDMMigrator class) and a new
  `migrate rdm` CLI command group. No changes to existing DHF schema, policy engine,
  or CI pipeline. Migration is opt-in and writes only to DHF/items/. No new runtime
  dependencies — RDM YAML is parsed directly with PyYAML.
assigned_to: charles
type: CR
status: completed
