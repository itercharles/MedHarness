id: CR-023
title: ISO 14971 Governance Policy File
description: 'Create a comprehensive governance YAML file for ISO 14971 (Risk Management
  for Medical Devices) with automated and manual policy checks covering the full risk
  management lifecycle: hazard identification, risk estimation, risk evaluation, risk
  control, residual risk evaluation, and risk management review.'
justification: ISO 14971 is required for all medical device submissions alongside
  IEC 62304. Without it, CompliantFlow cannot claim complete DHF coverage and any
  customer needing risk management traceability (all Class II/III devices) is unserved.
  Full IEC 62304 + IEC 82304-1 + ISO 14971 coverage is a genuine market differentiator
  with no competitor match.
priority: High
affected_items:
- SYS-005
- CRS-011
type: CR
status: draft
