id: CR-025
title: Defect Lifecycle CI Hook
description: Integrate DEF item lifecycle into the CI pipeline so that open defects
  of configured severity levels block merges or fail compliance checks. The system
  shall scan DHF/items for open DEF items, filter by severity/priority threshold,
  and surface them as compliance policy failures with links to the DEF item IDs.
justification: IEC 62304 §9.7 and §9.8 require documented defect management with known-anomaly
  tracking in the release. Currently DEF items exist in the DHF lifecycle but have
  no CI enforcement — a critical bug can be open while a release proceeds. This is
  both a compliance gap and a quality risk.
priority: High
affected_items:
- SYS-005
- SYS-006
- CRS-008
type: CR
status: draft
