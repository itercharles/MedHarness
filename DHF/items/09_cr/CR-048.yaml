id: CR-048
title: Compliance Posture REST API
description: 'Introduce a compliantflow serve command that exposes compliance status,
  traceability queries, and DHF item reads as a versioned, read-only REST API (JSON
  over HTTP). Endpoints cover: GET /status (overall posture summary), GET /items (list
  with filtering), GET /items/{id} (item detail with chain), GET /traceability (matrix),
  GET /compliance/{standard} (full check results), GET /tests (test result summary).
  Authentication is delegated to the RBAC system shipped in v3.0.0 — this CR must
  be sequenced after RBAC role definitions are finalised. The API is the integration
  layer consumed by the full Web UI, Jira/GitHub Issues sync, and AI coding tool plugins.
  All endpoints are read-only in this CR.'
justification: The full Web UI, Jira integration, and AI coding tool plugins all require
  a stable programmatic interface to CompliantFlow data. Building each integration
  by directly importing the Python library is not viable for external tools. A REST
  API layer decouples the presentation and integration concerns from the compliance
  engine, enables third-party integrations, and provides the foundation for the full
  enterprise motion. Must be sequenced after RBAC to avoid retrofitting authentication.
priority: High
target_version: v3.0.0
affected_items:
- SYS-021
- CRS-002
type: CR
status: planned
