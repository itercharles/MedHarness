id: CR-046
title: RDM Migration Completeness Validation
description: 'Extend the compliantflow migrate rdm command to produce a post-migration
  compliance validation report after converting an RDM repository. The report runs
  the full CI gate against the converted DHF and categorises results into: items that
  migrated cleanly and pass all applicable checks; items that migrated but have compliance
  gaps requiring human resolution (with specific remediation guidance from CR-035);
  and content that could not be migrated automatically with explicit manual intervention
  instructions. Output as both a human-readable markdown report and a structured JSON
  remediation plan. Migration is not considered complete until the report is reviewed
  and all blocking gaps are resolved.'
justification: The current migration command converts RDM YAML to CompliantFlow format
  but does not validate that the converted content satisfies compliance requirements.
  A team can complete migration and immediately have a DHF full of compliance gaps
  — the exact compliance debt accumulation the product exists to prevent. Post-migration
  validation converts migration from a one-time script into a managed, compliance-verified
  transition, and gives the RDM user community a clear path to a fully compliant DHF
  from day one.
priority: Medium
target_version: v2.2.0
affected_items:
- SYS-010
type: CR
status: planned
