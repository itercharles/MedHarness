id: CR-044
title: ISO 13485 Governance File
description: 'Author a governance/ISO_13485.yaml policy file covering the ISO 13485:2016
  QMS standard, following the established schema and pattern of IEC_62304.yaml and
  ISO_14971.yaml. Automate the automatable clauses using existing check types: Clause
  4.2 (document control) via file_existence checks for QMS documents in DHF/documents/;
  Clause 7.3 (design and development) via trace_coverage and item_existence checks
  already configured for IEC 62304; Clause 8.2 (monitoring) via all_tests_passing.
  Assign manual policies with evidence_guidance for Clauses 5 (management responsibility),
  6 (resource management), and 8.5 (improvement/CAPA). Include a standard reference
  document in governance/. Note cross-references to IEC 62304 Clause 7.3 overlaps
  explicitly to avoid duplication.'
justification: ISO 13485 is the QMS standard required alongside IEC 62304 for most
  Class II/III SaMD regulatory submissions. Customers who have adopted CompliantFlow
  for IEC 62304 coverage still face a manual ISO 13485 audit process. Adding a fourth
  standard file completes the regulatory coverage story and removes the most common
  remaining manual compliance activity for the primary ICP.
priority: Medium
target_version: v2.2.0
affected_items:
- CRS-011
type: CR
status: planned
