id: CR-028
title: GitLab CI and Jenkins Artifact Integration
description: Extend the test pull command and CI artifact fetcher to support GitLab
  CI pipelines (via GitLab API and GITLAB_TOKEN) and Jenkins (via Jenkins API and
  JENKINS_TOKEN). Each integration shall fetch JUnit XML artifacts by job name and
  run ID, matching the existing GitHub Actions interface.
justification: GitHub Actions is dominant in SaMD startups but a significant portion
  of medtech companies (especially established device manufacturers and defence-adjacent
  teams) run GitLab CI or Jenkins. Limiting artifact integration to GitHub Actions
  blocks these customers from using the automated test import workflow, which is a
  core value proposition of the platform.
priority: Medium
affected_items:
- SYS-007
- CRS-008
impact_assessment: 'Adds GitLabArtifactFetcher and JenkinsArtifactFetcher classes
  to DHF/utils/artifact_fetcher.py, each matching the GitHubArtifactFetcher interface
  (fetch by run_id or commit SHA, return List[ExecutionResult]). The test pull CLI
  command gains a --provider flag (github|gitlab|jenkins, default: github) and reads
  new env vars GITLAB_TOKEN / GITLAB_URL and JENKINS_TOKEN / JENKINS_URL. SYS-007
  is updated to reflect the expanded multi-platform scope. CRS-008 already enumerates
  GitLab CI and Jenkins so no update needed there. No schema changes, no DHFAdapter
  changes, no compliance policy changes. Risk: low — new code paths; existing GitHub
  path is unchanged.'
assigned_to: Claude
type: CR
status: completed
