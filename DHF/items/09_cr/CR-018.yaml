id: CR-018
title: Define component boundaries — DHF / compliantflow / tests
description: "The three-component architecture (DHF data layer, compliantflow analysis\n\
  engine, and test suites) has been implemented across multiple CRs (CR-013 through\n\
  CR-017) but the boundaries between them have never been formally documented or\n\
  enforced. This creates three problems:\n\n1. Import violations: compliantflow CLI\
  \ directly imports utils.junit_parser, bypassing\n   the DHFAdapter protocol it\
  \ was designed to encapsulate.\n2. Private attribute access: SRS tests access test_core._adapter._loader\
  \ (a private\n   attribute) to obtain Item objects, coupling tests to adapter internals.\n\
  3. No public API contract: DHF/utils/__init__.py is empty, making it unclear which\n\
  \   symbols are intended for external use vs internal implementation.\n\nThis CR\
  \ defines the component boundary rules formally, fixes the existing violations,\n\
  and adds a CI-enforced boundary test."
justification: 'Formal boundary definitions are required for IEC 62304 software architecture
  documentation

  (section 5.3) and to prevent regression as the codebase evolves. The fix is also

  prerequisite for safely substituting alternative DHF backends via the adapter protocol,

  since boundary violations make the adapter effectively non-swappable.'
impact_assessment: "- New architecture doc (SYSARCH-012) and implementation spec (SWDD-018)\n\
  - New SYS requirement SYS-034 with test enforcement\n- DHF/utils/__init__.py: add\
  \ explicit public exports\n- DHFAdapter protocol: add import_results_from_file()\
  \ method\n- LocalDHFAdapter: implement import_results_from_file()\n- compliantflow\
  \ CLI: remove direct utils.junit_parser import\n- 11 SRS test files: replace _adapter._loader\
  \ private access with direct ItemLoader usage\n- New test: tests/sys/test_sys_034_boundary.py"
priority: Medium
requested_by: Architecture Review
category: Architecture
affected_items:
- SYSARCH-012
- SWDD-018
- SYS-034
status: draft
