id: CR-010
title: Centralize Relationship Configuration
description: Centralize relationship type configuration into a global registry in
  ProjectConfig, replacing per-doc-type relationship definitions with shared RelationshipType
  models and validation.
justification: Relationship types were duplicated across doc type configs. Centralizing
  them reduces inconsistency and enables relationship metadata to be used programmatically
  across the compliance engine.
impact_assessment: Added RelationshipType model to schema, relationship_types global
  registry to ProjectConfig, validation for relationship_type references, and migrated
  CR doc type as proof of concept. All tests pass.
