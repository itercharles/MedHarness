id: CR-010
title: Centralize Relationship Configuration
content: |-
  Refactor configuration to define relationships in a single central location,
  eliminating duplication between properties and relations sections.
  
  ## Current Problem
  
  Relationships are defined in two places:
  1. In `properties` section with field details
  2. In `relations` section with target type
  
  This creates duplication and maintenance burden.
  
  ## Proposed Solution
  
  ### 1. Global Relationship Registry
  Define all relationships once at project level:
  
  ```yaml
  relationship_types:
    derives_from:
      label: "Derives From"
      description: "Parent requirement this derives from"
      reverse_label: "Derived By"
    implements:
      label: "Implements"
      description: "Requirements this implements"
      reverse_label: "Implemented By"
    target_release:
      label: "Target Release"
      description: "Release this targets"
      reverse_label: "Includes Items"
    mitigates:
      label: "Mitigates"
      description: "Risks this mitigates"
      reverse_label: "Mitigated By"
  ```
  
  ### 2. Simplified Property Definition
  Reference relationships by name:
  
  ```yaml
  properties:
    - name: target_release
      format: relationship
      relationship_type: target_release
      target_types:
        - RELEASE
      cardinality: many  # or 'one'
  ```
  
  ### 3. Remove Relations Section
  The `relations` section becomes redundant - relationship info comes from:
  - Global relationship registry (metadata)
  - Property definition (target types, cardinality)
  
  ## Benefits
  
  1. **Single Source of Truth**: Relationship metadata defined once
  2. **Less Duplication**: No need to repeat in properties and relations
  3. **Better Validation**: Can validate relationship_type references exist
  4. **Clearer Intent**: `format: relationship` is explicit
  5. **Reverse Lookups**: Built-in with reverse_label
  6. **Easier Maintenance**: Change relationship name in one place
  
  ## Implementation Plan
  
  ### Phase 1: Schema & Parser
  - Add `relationship_types` to project config schema
  - Update config parser to validate relationship references
  - Add backward compatibility for old format
  
  ### Phase 2: Core Library
  - Update `_aggregate_relationship_fields()` to use new format
  - Update relationship traversal logic
  - Add reverse lookup helpers
  
  ### Phase 3: UI
  - Update form rendering to use relationship metadata
  - Update detail view to show reverse relationships
  - Update table rendering if needed
  
  ### Phase 4: Migration
  - Migrate existing doc types to new format
  - Update all YAML item files if needed
  - Remove deprecated `relations` sections
  
  ### Phase 5: Testing
  - Update all tests for new format
  - Verify backward compatibility
  - Test reverse lookups
  
  ## Migration Strategy
  
  Support both formats during transition:
  - Old format: `relations` section (deprecated)
  - New format: `relationship_types` + `format: relationship`
  - Gradually migrate doc types
  - Remove old format support after migration complete
  
status: implemented
priority: Medium
category: Technical Improvement
implementation_notes: |-
  Phase 1 complete - infrastructure ready and proven.
  
  Changes:
  - Added RelationshipType model to schema
  - Added relationship_types global registry to ProjectConfig
  - Added validation for relationship_type references
  - Updated _aggregate_relationship_fields() for backward compatibility
  - Added 6 common relationships to global registry
  - Migrated CR doc type as proof of concept
  
  All tests pass (6/6).
  
  Next steps:
  - Migrate remaining doc types (SRS, SYS, CRS, etc.)
  - Remove deprecated relations sections
  - Update UI to use relationship metadata
