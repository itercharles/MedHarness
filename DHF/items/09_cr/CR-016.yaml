id: CR-016
title: Consolidate src/ — move traceability/ and helpers/ into compliantflow/, app.py
  into debug_view/
type: CR
status: draft
description: "Two structural changes to clean up the src/ layout:\n\n1. Move src/traceability/\
  \ → src/compliantflow/traceability/\n   Move src/helpers/     → src/compliantflow/helpers/\n\
  \   Rationale: traceability/ and helpers/ are internal dependencies of the\n   compliantflow\
  \ analysis engine. Exposing them as sibling top-level packages\n   in src/ allowed\
  \ any code to import them directly, bypassing the intended\n   public API (CompliantFlowCore).\
  \ Moving them inside compliantflow/ makes\n   the package boundary explicit.\n\n\
  2. Move src/app.py → src/debug_view/app.py\n   Rationale: app.py is the Streamlit\
  \ entry point for the debug UI. It only\n   loads debug_view/ pages and has no purpose\
  \ outside that context. Co-locating\n   it with the pages it orchestrates makes\
  \ debug_view/ self-contained.\n   Run command updated to: streamlit run src/debug_view/app.py\n\
  \nAll internal imports updated:\n- from traceability.* → from compliantflow.traceability.*\n\
  - from helpers.*      → from compliantflow.helpers.*\n- Path calculations in app.py\
  \ adjusted for new directory depth"
justification: 'src/ previously exposed three separate top-level packages (compliantflow,

  traceability, helpers) when only compliantflow should be the public interface.

  This CR makes compliantflow the single top-level package in src/, with

  traceability and helpers as internal sub-packages, matching the intended

  architecture described in the design.'
priority: Medium
