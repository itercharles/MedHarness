id: CR-012
title: Add CLI layer for CI/CD integration
type: CR
status: implementing
description: 'Add a command-line interface (CLI) package `src/compliantflow/` so that
  CI/CD

  pipelines and external tools can invoke CompliantFlowCore operations without

  starting the Streamlit web UI.


  This replaces the fragile inline Python scripts in Phase 4 of the CI pipeline

  with proper CLI commands that reuse the existing business logic layer.'
justification: 'The current CI Phase 4 bypasses CompliantFlowCore by directly reading
  and writing

  YAML files. This duplicates logic, is hard to test, and breaks when the data model

  changes. A proper CLI layer ensures CI/CD uses the same validated code path as the
  UI.'
