id: CR-036
title: ISO 14971 Compliance Policy Completeness
description: Audit every ISO 14971 clause against the current governance/ISO_14971.yaml
  policy file. Implement missing automated checks covering clauses 4 (general requirements),
  5 (risk analysis), 6 (risk evaluation), 7 (risk control), 8 (residual risk evaluation),
  and 9 (risk-benefit analysis). For each policy that cannot be automated, document
  explicit evidence guidance referencing the specific DHF artifact that satisfies
  it. The CR is complete when the governance file has no undocumented gaps and the
  automated check count is maximised with clear justification for every remaining
  manual check.
justification: ISO 14971 was introduced in CR-023 but coverage is incomplete. Zero-debt
  compliance requires that every applicable clause is either automatically verified
  by the CI gate or has an explicit, auditor-reviewable evidence artefact. Incomplete
  governance coverage means compliance debt can accumulate silently in the ISO 14971
  domain — the exact failure mode that makes CompliantFlow less than its mission.
priority: High
target_version: v2.1.0
affected_items:
- SYS-005
type: CR
status: planned
