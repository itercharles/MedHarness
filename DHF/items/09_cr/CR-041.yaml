id: CR-041
title: Draft Item Pre-Validation
description: Implement a compliantflow validate draft <file> command that validates
  a proposed DHF YAML item against the doc-type field schema (required fields, allowed
  values, format types) and applicable per-item attribute policies from a specified
  standard, without requiring a full CI run or committed state. The command resolves
  the doc type from the item's id prefix (or a --type flag for draft items without
  an id), applies field constraint rules from the extended ProjectSchema (CR-039),
  and runs attribute-level policy checks that can evaluate a single item in isolation.
  Graph-dependent checks (trace_coverage, verification_complete) are explicitly out
  of scope and documented as such. Exits 0 on pass, 1 on failure, with structured
  output consumable by AI agents.
justification: The CI gate provides authoritative compliance enforcement but requires
  a committed state and a full pipeline run. AI coding agents and engineers need a
  fast pre-commit feedback loop — seconds, not minutes — to validate a draft item
  before committing it. Draft pre-validation closes this gap, enabling AI agents to
  self-correct schema and attribute errors locally before the commit rather than discovering
  them at the gate.
priority: High
target_version: v2.2.0
affected_items:
- SYS-008
type: CR
status: planned
