id: CR-033
title: Split RCM implementation_status into two fields
description: 'Split the single implementation_status field on RCM items into two separate
  fields: implementation_status (Planned/Implemented) and verification_status (Not
  Verified/Verified). This is required so that ISO 14971 policies 7.2.a (controls
  implemented) and 7.6.b (controls verified) can both be checked simultaneously via
  attribute_value without conflict. Include a migration script for existing RCM items.'
justification: ISO 14971 §7.2 and §7.6 are sequential checks on the same control measure
  — implementation and subsequent verification of effectiveness. A single status field
  cannot represent both states simultaneously, causing policy 7.2.a to fail for any
  RCM that has progressed to Verified. This is a schema blocker for full ISO 14971
  automation.
priority: High
affected_items:
- SYS-005
- SYS-012
type: CR
status: planned
impact_assessment: 'Schema-only change to DHF/config/doc_types/rcm.yaml: removes Verified
  from implementation_status options and adds a new verification_status field. Existing
  RCM items without implementation_status set require no migration. Any RCM with implementation_status=Verified
  must be updated to implementation_status=Implemented + verification_status=Verified
  (none exist currently). ISO_14971.yaml policies 7.2.a and 7.6.b updated to use attribute_value
  checks on the two separate fields. No runtime code changes required.'
assigned_to: charles
