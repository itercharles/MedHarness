id: CR-031
title: Ollama Air-Gap Deployment Package
description: 'Produce a documented, tested, docker-compose-based deployment package
  for running CompliantFlow with Ollama in an air-gapped environment. The package
  shall include: Ollama container configuration, a recommended open-source model selection
  for semantic compliance checks, environment variable documentation, and a validation
  script that runs a sample compliance check end-to-end without internet access.'
justification: Air-gapped environments are common in defence-adjacent medtech, Class
  III implantable device teams, and hospital-deployed software. These teams cannot
  use Gemini API. The OllamaBackend infrastructure exists but there is no deployment
  guidance, making air-gapped use impractical despite technical feasibility. This
  CR turns an existing capability into a supported, documented offering.
priority: Medium
affected_items:
- SYS-009
type: CR
status: draft
