id: CR-037
title: IEC 62304 Manual Check Reduction
description: '31 of 106 IEC 62304 checks are currently manual. Audit each manual check
  and implement automated equivalents wherever technically feasible using the existing
  check types (attribute_presence, attribute_value, trace_coverage, document_content,
  file_existence, all_tests_passing, verification_complete). For every check that
  remains manual after this audit, document: the specific evidence artefact that satisfies
  it, how CI generates or flags that artefact, and the explicit reason automation
  is not possible. Produce an auditor-reviewable summary of automated vs manual coverage
  with justifications.'
justification: Manual checks are compliance debt waiting to happen — they require
  human action on a schedule that is easy to miss. Every manual check converted to
  an automated gate is a permanent reduction in compliance overhead. The 31 remaining
  manual checks represent the largest single gap between CompliantFlow's current state
  and its zero-debt mission. Even partial reduction materially improves the offering.
priority: High
target_version: v2.1.0
affected_items:
- SYS-008
- CRS-011
type: CR
status: planned
