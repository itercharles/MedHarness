id: CR-040
title: AI Agent Context Package
description: 'Implement a compliantflow context command that outputs the full DHF
  schema, lifecycle rules, valid field values, and compliance policy summaries in
  a machine-readable format (JSON or YAML) optimised for LLM consumption. The output
  covers: all item types with their fields, required flags, allowed values, and ID
  prefix; global lifecycle states with stability flags; applicable compliance policies
  per standard with clause reference and check type. A --summary flag emits policy
  IDs and headings only; --standard filters to one standard. Internally, the command
  assembles from CompliantFlowCore.get_config() (extended by CR-039) and core.get_policy_group()
  calls. No LLM backend required to run this command.'
justification: AI coding agents generating DHF content need to know the schema, lifecycle
  rules, and compliance requirements before generating content — not after failing
  the CI gate. Without a queryable context interface, every AI-generated DHF item
  is a guess against an implicit schema. This command makes the schema and policy
  rules explicit, queryable, and machine-readable, enabling AI tools to generate compliant
  content on the first attempt rather than iterating through CI failures.
priority: High
target_version: v2.2.0
affected_items:
- SYS-006
- SYS-021
type: CR
status: planned
