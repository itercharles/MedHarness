id: CR-013
title: Split DHF data layer from CompliantFlow analysis engine
type: CR
status: draft
description: 'Extract the DHF data layer into a standalone `src/dhf/` package and
  introduce a `DHFAdapter` interface so any backend can plug into CompliantFlow.

  Key changes:

  - Split `DHF/config/project_config.yaml` into `global.yaml` + per-doc-type files
    under `DHF/config/doc_types/`

  - New `src/dhf/` package: models, repository, result_store, document_generation,
    and standalone CLI (`python -m dhf`)

  - New `src/compliantflow/adapters/`: `DHFAdapter` Protocol + `LocalDHFAdapter`

  - `CompliantFlowCore` accepts any `DHFAdapter`; defaults to `LocalDHFAdapter`

  - CompliantFlow CLI trimmed to analysis-only; data CRUD moved to DHF CLI

  - `src/cli/cli.py` moved into `src/compliantflow/cli.py` for symmetry with
    `src/dhf/cli.py`'
justification: 'CompliantFlow bundles data management (YAML CRUD, schema, doc
  generation) and analysis (graph, traceability, compliance, lifecycle) in one
  package. Separating them allows the DHF data layer to be used independently,
  enables alternative backends via the adapter interface, and makes each package
  easier to test and reason about in isolation.'
priority: High
