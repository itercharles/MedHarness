id: CR-030
title: Read-Only Compliance Status Web Dashboard
description: 'Implement a lightweight read-only web dashboard that displays the current
  compliance status, traceability matrix, and test result summary for a DHF. The dashboard
  shall be a single-page application served locally (not cloud-hosted), reading directly
  from the DHF via the existing DHFAdapter, with no write operations. Target personas:
  QA and Regulatory Affairs engineers who are not CLI-comfortable.'
justification: 'The CLI-only interface is a barrier for QA/RA personas who need to
  review compliance status, traceability coverage, and test results but do not work
  in a terminal. A read-only dashboard extends the product to a second persona within
  the same team without compromising the CLI-first architecture. This is a deliberate
  demotion from the original plan: read-only first, full UI later in v3.0.0.'
priority: Medium
affected_items:
- UC-002
- UC-005
- CRS-002
- CRS-011
type: CR
status: planned
implementation_notes: 'Closed without implementation. The CI pipeline (Phase 4) already
  generates traceability_report.pdf and compliance_report.pdf and uploads them as
  the compliance-evidence artifact on every run. These PDF artifacts satisfy the stated
  QA/RA persona need — reviewing compliance status and traceability coverage without
  CLI access — at zero additional implementation cost. A web dashboard would still
  require someone to start a local server (CLI involvement), offers no improvement
  over the PDFs for regulatory review purposes, and adds a Flask dependency and a
  new server process to maintain. If a browser-accessible view becomes necessary in
  future, the appropriate vehicle is the full write-capable Web UI planned for v3.0.0,
  not a read-only intermediate step. Decision: defer to v3.0.0 or close permanently
  once v3.0.0 ships.'
