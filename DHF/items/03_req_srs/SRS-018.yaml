id: SRS-018
title: Orphan Detection in Traceability Matrices
content: |-
  The system shall display orphan items in traceability matrices. For each level
  in a traceability path, items that are not linked to any items in the chain
  shall be displayed as orphan rows.
  
  Orphan rows shall:
  - Show dashes (-) for all levels except the orphan level
  - Display the orphan item ID and title at the orphan level
  - Include a status indicator showing "⚠️ Orphan {doc_type}"
  - Be included in the matrix table alongside normal traceability chains
  
  This ensures complete visibility of all items, including those that lack
  required traceability links.
derives_from:
- SYS-004
status: approved
