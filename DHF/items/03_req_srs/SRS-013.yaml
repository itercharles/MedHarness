id: SRS-013
title: Item Hyperlink Navigation
content: |-
  Software shall provide clickable hyperlinks for item IDs in tables and lists:
  1. Automatically detect item ID columns (format: PREFIX-NUMBER)
  2. Configure detected columns as LinkColumn with query parameter URLs
  3. Display item detail expander when ?item=<ID> query parameter is present
  4. Show item properties (ID, title, status, content) and typed relationships
performance: |-
  - Link rendering: < 100ms added to table display
  - Item detail display: < 200ms
  - Column detection: O(n) where n = number of columns
status: approved
