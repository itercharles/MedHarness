id: SRS-006
derives_from:
- SYS-011
title: PDF Evidence Report Rendering
content: 'The software shall render both traceability and compliance evidence reports
  to PDF files at caller-specified output paths.


  Traceability reports shall include the ordered matrix columns, per-row completeness
  and verification status, and a test results detail section when test results are
  available.


  Compliance reports shall include the evaluated standard identifier, aggregate score,
  pass/fail counts, and per-policy rationale/details.


  Report generation shall create parent output directories automatically and shall
  not modify DHF source items.'
