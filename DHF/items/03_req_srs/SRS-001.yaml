id: SRS-001
title: Traceability Graph Query
content: |-
  The software shall provide an in-memory directed graph of all DHF items and their
  relationships. Queries shall support: item lookup by ID, full connected subgraph
  traversal (upstream/downstream), and traceability matrix construction across
  ordered document types.
derives_from:
- SYS-003
- SYS-004
