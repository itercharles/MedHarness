id: SRS-003
title: CI/CD CLI Interface
content: |-
  The software shall expose two CLI entry points: (1) compliantflow — read-only
  analysis commands (validate traceability, validate coverage, validate compliance,
  traceability matrix/chain); (2) utils — data mutation commands (item CRUD,
  lifecycle transitions, test import, doc generation). All commands shall write
  machine-readable JSON to stdout and human-readable messages to stderr.
derives_from:
- SYS-006
- SYS-007
