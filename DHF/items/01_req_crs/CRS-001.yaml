id: CRS-001
title: DHF Item Definition and Management
content: The system shall allow users to create, edit, and manage DHF requirement items
  (customer requirements, system requirements, software requirements, and detailed design)
  through a configurable item schema. Item types, properties, and allowed values shall
  be defined in a central configuration file without code changes.
rationale: Required for medical device regulatory approval
stakeholder: Regulatory Affairs
priority: Critical
derives_from:
- UC-001
status: approved
