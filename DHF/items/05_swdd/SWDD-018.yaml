id: SWDD-018
title: Orphan Detection Implementation in build_matrix_table
content: |-
  Implementation of orphan detection in the traceability matrix builder.
  
  **Function**: `build_matrix_table()` in `src/pages/02_Traceability.py`
  
  **Algorithm**:
  1. Build normal traceability chains using recursive traversal
  2. Track items already in chains:
     - Create a dictionary mapping each level to a set of item IDs
     - Iterate through all chains and extract item IDs at each level
     - Remove warning icons (⚠️) before adding to the set
  3. Find orphan items at each level:
     - For each level in the path, get all items of that doc_type
     - Check if item ID is in the items_in_chains set
     - If not, create an orphan row
  4. Create orphan rows:
     - Add dashes (-) for all previous levels
     - Add orphan item ID and title at the orphan level
     - Add dashes (-) for all following levels
     - Set status to "⚠️ Orphan {doc_type}"
  5. Append orphan rows to chains list
  
  **Data Structures**:
  - `items_in_chains`: Dict[str, Set[str]] - Maps doc_type to set of item IDs
  - `chains`: List[Dict] - List of chain rows (normal + orphan)
  
  **Edge Cases**:
  - Items with warning icons: Strip ⚠️ before checking membership
  - Last level items: Don't add Title column for orphans at last level
  - Empty chains: Orphan detection still works (all items are orphans)
