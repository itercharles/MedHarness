id: SWDD-021
title: "Affected Items Detection Algorithm"
content: |
  **Unit:** Affected items detection in `validate-pr.yml`
  
  **Purpose:** Automatically detect which DHF items are affected by PR changes
  
  **Design Approach:**
  - Compare PR branch against base branch to identify changed files
  - Extract item identifiers from changed YAML files in DHF structure
  - Map changed test files to corresponding test case identifiers
  - Maintain list without duplicates
  
  **Inputs:** Git diff between branches
  
  **Outputs:** List of affected item IDs
  
implements:
  - SRS-021
guided_by:
  - SWAD-011
category: design
status: draft
