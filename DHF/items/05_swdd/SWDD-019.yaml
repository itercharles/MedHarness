id: SWDD-019
title: Git History Extraction Implementation
content: |
  This module implements git history extraction for CompliantFlow items using
  subprocess calls to git log with specific formatting and parsing.
  
  ## Architecture
  
  The implementation consists of three main functions in `src/utils/git_history.py`:
  
  ### 1. get_item_history(item_path, dhf_root)
  Extracts complete commit history for an item file.
  - Uses `git log --follow` to track file renames
  - Returns list of commit dictionaries with hash, author, email, timestamp, message
  
  ### 2. get_status_changes(item_path, dhf_root)
  Extracts status field changes from git history.
  - Uses `git log --follow -p` to get patches
  - Parses diff output looking for `-status:` and `+status:` lines
  - Returns chronological list of status changes with metadata
  
  ### 3. get_field_changes(item_path, dhf_root, field_name)
  Generic function to track any YAML field changes.
  - Similar to get_status_changes but accepts field name parameter
  - Supports tracking title, content, or any other field
  
  ## UI Integration
  
  The git history is displayed in the item detail expander (`check_and_show_item_detail`
  in `src/utils/ui_helpers.py`):
  - Checks if item has `file_path` metadata
  - Calls `get_status_changes` to extract history
  - Displays as Streamlit dataframe table
  - Shows Date, Author, From, To, Commit columns
  
  ## Data Flow
  
  1. Item loader (`src/traceability/repository/loader.py`) adds `file_path` to Item objects
  2. Items are stored in graph with file_path metadata
  3. When item detail is displayed, file_path is used to query git
  4. Git history is extracted and formatted for display
  
  ## Error Handling
  
  - Gracefully handles missing git repository
  - Returns empty list if file not in git history
  - Displays warning in UI if git history extraction fails
  - Does not block item display if history unavailable
