id: SWDD-001
title: CompliantFlowCore and GraphEngine
content: |-
  CompliantFlowCore (compliantflow/core.py) is the read-only analysis facade. It
  accepts a DHFAdapter and exposes: refresh(), get_all_items(), get_item(),
  build_traceability_matrix(), get_item_chain(), validate(), check_coverage(),
  check_compliance(). GraphEngine (compliantflow/traceability/graph/engine.py)
  builds a NetworkX DiGraph with child-to-parent edge direction from relationship
  fields. Nodes store item dicts; edges are added for each linked UID.
implements:
- SRS-001
