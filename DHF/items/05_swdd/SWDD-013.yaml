id: SWDD-013
title: CLI Implementation
content: |-
  Detailed design of the `compliantflow` CLI package.

  **Package structure**:
  ```
  src/cli/
    cli.py            # all click commands (primary entry point)
  src/compliantflow/
    __main__.py       # backward-compat: delegates to cli.main
  ```

  **Click command hierarchy**:
  ```
  main (group, --dhf option)
    validate (group)
      schema
      traceability
      compliance <GROUP>
    item (group)
      list (--type, --status, --search)
      get <ITEM_ID>
      create --type CODE --data JSON [--author NAME] [--cr CR_ID]
      update <ITEM_ID> --data JSON [--author NAME]
      delete <ITEM_ID> [--author NAME]
      transitions <ITEM_ID>
      transition <ITEM_ID> <TO_STATE> [--by NAME]
    cr (group)
      check-status <CR_ID>
      update <CR_ID> (--item repeatable, --pr-number, --pr-url, --pr-title)
    traceability (group)
      matrix <TYPE> [TYPE...]
      chain <ITEM_ID>
    test (group)
      import <FILE> --format junit [--tester NAME] [--run-id ID] [--run-url URL] [--commit SHA]
      status <TC_ID>
      list [--status STATUS]
    doc (group)
      list
      generate <CODE|ALL>
      export <CODE|ALL>
  ```

  **DHF path resolution** (in order):
  1. `--dhf` CLI option if provided
  2. `COMPLIANTFLOW_DHF` environment variable
  3. Default: `<repo_root>/DHF` where repo_root = parent of `src/`

  **Exit code contract**:
  - 0: success
  - 1: business error (item not found, CR stable, validation failed)
  - 2: click usage error (wrong arguments)

  **Core instantiation**:
  ```python
  core = CompliantFlowCore(dhf_root=dhf_path)
  ```
  One instance per CLI invocation; stdout = machine-readable JSON, stderr = human-readable messages.
implements:
- SRS-012
