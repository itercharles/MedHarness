id: SWDD-013
title: CLI Implementation
content: |-
  Detailed design of the two CLI packages introduced by the DHF data layer split (CR-013).

  **Package structure**:
  ```
  src/compliantflow/
    cli.py         # analysis CLI (entry: python -m compliantflow)
    __main__.py    # delegates to compliantflow.cli.main
  DHF/utils/
    cli.py         # data-layer CLI (entry: python -m utils)
    __main__.py    # delegates to dhf.cli.main
  ```

  **compliantflow CLI — analysis and lifecycle operations**:
  ```
  python -m compliantflow [--dhf PATH]
    validate (group)
      traceability
      compliance <GROUP>
    item (group)
      transitions <ITEM_ID>
      transition <ITEM_ID> <TO_STATE> [--by NAME]
    cr (group)
      check-status <CR_ID>
      update <CR_ID> [--item ITEM_ID]... [--pr-number N] [--pr-url URL] [--pr-title TITLE]
    traceability (group)
      matrix <TYPE> [TYPE...]
      chain <ITEM_ID>
    test (group)
      import <FILE> --format junit --tester NAME [--run-id ID] [--run-url URL] [--commit SHA]
      status <TC_ID>
      list [--status STATUS]
  ```
  Core instantiation: `CompliantFlowCore(dhf_root=dhf_path, auto_commit=False)`.

  **dhf CLI — data-layer operations (no compliantflow dependency)**:
  ```
  python -m utils [--dhf PATH]
    item (group)
      get <ITEM_ID>
      list [--type CODE]
      create --type CODE --data JSON [--author NAME] [--cr CR_ID]
      update <ITEM_ID> --data JSON [--author NAME] [--cr CR_ID]
      delete <ITEM_ID> [--author NAME]
    validate (group)
      schema
    config (group)
      doc-types
    doc (group)
      list
      generate <CODE|ALL>
      export <CODE|ALL>
  ```
  Adapter instantiation: `LocalDHFAdapter(dhf_path, auto_commit=False)`.

  **DHF path resolution** (identical in both CLIs, in order):
  1. `--dhf` CLI option if provided
  2. `COMPLIANTFLOW_DHF` environment variable
  3. Default: `<repo_root>/DHF` (parent of the `src/` directory)

  **Exit code contract** (both CLIs):
  - 0: success
  - 1: business error (item not found, CR stable, validation failed)
  - 2: click usage error (wrong arguments)

  stdout = machine-readable JSON; stderr = human-readable messages.
  One adapter/core instance per CLI invocation; no shared state between invocations.
