usage_guide: |
  ## Running Tests Locally
  
  ```bash
  # Activate virtual environment
  cd src && source venv/bin/activate
  
  # Run all tests
  python3 -m pytest ../tests/ -v
  
  # Run specific test file
  python3 -m pytest ../tests/test_core.py -v
  
  # Run with coverage
  python3 -m pytest ../tests/ --cov=traceability --cov-report=html
  ```
  
  ## GitHub Actions Setup
  
  Tests run automatically on every push/PR. View results in GitHub Actions tab.
  Set GITHUB_TOKEN in .env for API access.
  
  ## Writing New Tests
  
  ```python
  def test_TC_XXX_YYY_description():
      """
      @test_id: TC-XXX-YYY
      @links: SYS-XXX
      """
      assert condition, "Error message"
  ```
  
  ## Troubleshooting
  
  - Tests not showing: Check GitHub Actions, verify artifact uploaded
  - Rate limiting: Use authenticated requests (GITHUB_TOKEN)
  - CI failures: Check requirements.txt, verify PYTHONPATH
