id: SDS-004
content: "Implementation of the change management system using:\n\n**Data Models:**\n\
  - ChangeRequest: Pydantic model with fields for title, description, type, priority,\
  \ \n  status, affected items, risk assessment, and workflow tracking\n- ChangeImpact:\
  \ Model for impact analysis results with categorized affected items\n- Enums: ChangeType,\
  \ ChangePriority, ChangeStatus\n\n**Core Components:**\n- ChangeTracker: CRUD operations\
  \ with auto-ID generation (CR-001, CR-002, etc.)\n- ChangeWorkflow: State machine\
  \ for workflow transitions with validation\n- ImpactAnalyzer: Graph-based impact\
  \ analysis with MDCG 2020-3 significance assessment\n\n**Storage:**\n- YAML files\
  \ in DHF/change_requests/\n- Git integration for version control\n\n**UI:**\n- Streamlit\
  \ page with 3 tabs: Submit, Review, History\n- Form validation and real-time status\
  \ updates\n- CSV export functionality"
