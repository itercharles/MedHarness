id: TC-CRS-011-001
status: approved
title: Verify Compliance Dashboard Functionality
content: Verify that compliance dashboard loads policy groups, executes validation, and displays results with score and evidence.
prerequisites: Compliance page accessible with policy groups in governance directory
steps:
  - Navigate to Compliance page
  - Select a policy group from dropdown
  - Click "Check Compliance" button
  - Observe compliance score and color indicator
  - Review policy validation results table
  - Expand evidence panels for failed policies
expected_result: Dashboard displays compliance score with appropriate color, results table shows all policies with pass/fail status, evidence is available for review
links: ["CRS-011"]
verification_status: PASS
