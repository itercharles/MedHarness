id: TC-CRS-001
test_type: manual
title: User Acceptance Test - Document Export
content: Verify that users can export requirements as PDF documents with proper formatting.
prerequisites: CompliantFlow application running with sample requirements
steps:
  - Navigate to Customer Requirements page
  - Select a requirement
  - Click "Export PDF" button
  - Download and open PDF file
  - Verify formatting and content
expected_result: PDF contains all requirement details with professional formatting
