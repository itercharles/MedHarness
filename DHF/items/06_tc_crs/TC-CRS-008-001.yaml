id: TC-CRS-008-001
title: End-to-End Document Generation Validation
content: |
  Validate that the document generation feature meets the customer requirement 
  for producing regulatory-ready PDF documentation.
  
  **Test Objective**:
  Verify complete document generation workflow from UI to PDF export.
  
  **Test Steps**:
  1. **Export Requirements Specification**:
     - Navigate to System Requirement page
     - Click "📄 Export PDF" button
     - Verify PDF generated successfully
     - Download and open PDF
  
  2. **Verify PDF Content**:
     - Check document header includes: title, version, date, status
     - Verify all SYS requirements included
     - Check each requirement shows: ID, title, content, status, links
     - Verify status badges display correctly (APPROVED, DRAFT, etc.)
     - Check linked items section shows traceability
  
  3. **Verify PDF Formatting**:
     - Professional typography (Calibri/Arial, 11pt)
     - Proper page layout (A4, 2.5cm margins)
     - Headers and footers with page numbers
     - Table of contents or summary section
     - Statistics (total, approved, draft counts)
  
  4. **Generate Traceability Matrix**:
     - Generate traceability matrix PDF
     - Verify CRS → SYS → SDS → Test chains shown
     - Check coverage analysis included
     - Verify orphan detection works
  
  5. **Test Multiple Document Types**:
     - Export CRS specification
     - Export SDS specification
     - Verify each type formatted correctly
  
  **Expected Results**:
  - ✅ PDF export works from UI with one click
  - ✅ All requirement details included in PDF
  - ✅ Professional formatting suitable for submission
  - ✅ Traceability matrix generated correctly
  - ✅ Coverage analysis shows test coverage
  - ✅ Multiple document types supported
  - ✅ PDFs meet regulatory documentation standards
  
  **Acceptance Criteria from CRS-008**:
  - Can export any requirement type as PDF ✅
  - PDFs include all details ✅
  - Professional formatting ✅
  - Traceability matrix available ✅
  - Coverage analysis included ✅
  - One-click export ✅
  - Regulatory-ready output ✅
  
  **Regulatory Compliance**:
  Demonstrates capability to produce DHF documentation meeting FDA 21 CFR 820.30 
  and IEC 62304 requirements for design documentation.
