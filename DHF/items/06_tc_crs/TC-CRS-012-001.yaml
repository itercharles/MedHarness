id: TC-CRS-012-001
status: approved
title: Verify Dynamic Page Generation
content: Verify that document type pages are automatically generated from configuration without hardcoded page files.
prerequisites: Application running with doc_types configured in project_config.yaml
steps:
  - Navigate to application home page
  - Observe sidebar navigation menu
  - Verify all doc_types with page_enabled=true appear as pages
  - Click on a dynamically generated page (e.g., Customer Requirements)
  - Verify page loads and displays document management interface
  - Add new doc_type to configuration with page_enabled=true
  - Restart application
  - Verify new page appears in navigation
expected_result: All enabled document types appear as navigable pages, new types can be added via configuration only
links: ["CRS-012"]
verification_status: PASS
