id: TC-SDS-SOUP-003-001
title: Test SOUP Workflow Transitions
content: |
  Verify that SOUP workflow transitions enforce approval criteria.
  
  **Test Steps**:
  1. Create SOUP item with all required fields
  2. Click "Submit for Review" button
  3. Verify criteria checklist appears:
     - ✅ Purpose documented
     - ✅ Safety class assigned
     - ✅ Linked to SYS requirement
  4. Click "Confirm" to transition
  5. Verify status changes to "under_review"
  6. Click "Approve" button
  7. Complete manual verification
  8. Verify status changes to "approved"
  
  **Expected Result**:
  - Workflow buttons appear correctly
  - Criteria validation works
  - State transitions occur
  - Reviewer and date recorded
