id: TC-SDS-004-001
content: '**Objective**: Verify that the ChangeRequest Pydantic model correctly validates
  data


  **Prerequisites**:

  - Python environment with Pydantic installed

  - ChangeRequest model imported


  **Steps**:

  1. Create ChangeRequest with valid data

  2. Verify all required fields are validated

  3. Test enum validation (ChangeType, ChangePriority, ChangeStatus)

  4. Test optional fields (risk_assessment, review_comments)

  5. Test datetime field handling

  6. Attempt to create with invalid data and verify validation errors


  **Expected Result**:

  - Valid data creates ChangeRequest object successfully

  - Invalid data raises Pydantic ValidationError

  - Enums only accept defined values

  - Datetime fields are properly serialized/deserialized

  - Model serialization (model_dump) works correctly


  **Actual Result**: PASS


  **Notes**: Pydantic v2 validation working as expected'
