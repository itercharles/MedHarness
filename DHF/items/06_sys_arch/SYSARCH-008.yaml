id: SYSARCH-008
title: Analysis Engine Module
content: |-
  Read-only analysis engine that provides traceability, compliance, and graph
  queries over the DHF. Exposed as a Python library (`CompliantFlowCore`) and
  a CLI (`python -m compliantflow`).

  **Responsibilities**:
  - Build a directed graph of all DHF items and their links
  - Provide traceability chains and matrices across doc-type paths
  - Detect orphaned items (no upstream or downstream links)
  - Run automated compliance checks against governance policy groups
  - Surface test result coverage and verification status per requirement

  **Key Components**:
  - `CompliantFlowCore` (`compliantflow/core.py`): single façade; all analysis
    methods are defined here; accepts any `DHFAdapter` implementation
  - `GraphEngine` (`compliantflow/traceability/graph/engine.py`): builds a
    NetworkX DiGraph (edges go child→parent); `nx.descendants` = upstream
  - `PolicyEngine` (`compliantflow/policy.py`): 8 automated check types
    (item_existence, file_existence, document_content, trace_coverage,
    attribute_presence, attribute_value, all_tests_passing, verification_complete)
  - `compliantflow/cli.py`: Click CLI for CI/CD integration

  **Implementation Notes**:
  - All mutations (create/update/delete items, lifecycle transitions) go through
    the DHFAdapter layer directly; CompliantFlowCore is strictly read-only
  - Governance policy groups (`governance/`) are decoupled from DHF data;
    `governance_dir` is passed explicitly to compliance methods
