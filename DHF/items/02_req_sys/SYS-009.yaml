id: SYS-009
satisfies:
- CRS-011
title: Semantic Document Compliance Checks
category: Functional
content: 'The system shall support semantic compliance checks that evaluate DHF document
  content against natural-language requirements using a configurable LLM backend.


  The system shall support at minimum two LLM backends:

  - GeminiBackend: uses the Google Gemini API (requires GEMINI_API_KEY)

  - OllamaBackend: uses a local Ollama instance (requires COMPLIANTFLOW_OLLAMA_URL)


  The system shall select the active backend at runtime via environment variables,
  with no backend configured resulting in semantic checks being skipped with a recorded
  failure.


  Semantic check results shall include the LLM response and a pass/fail determination,
  and shall be indistinguishable in structure from other automated check results.'
verification_method:
- Test
- Inspection
type: SYS
