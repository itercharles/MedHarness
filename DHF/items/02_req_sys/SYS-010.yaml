id: SYS-010
satisfies:
- CRS-008
title: CR-PR Git Evidence Validation
category: Functional
content: 'The system shall validate that Change Requests referenced in CI pipelines
  have associated git evidence (commits linked via PR merge messages) before permitting
  downstream compliance checks to pass.


  The system shall read a CR-PR evidence report from a file path specified by the
  COMPLIANTFLOW_CR_REPORT_PATH environment variable or an explicit report_path parameter.


  The check shall pass if the report contains at least one commit for the given CR,
  and fail if the commit list is empty or the report is not found.


  The evidence report shall be generated by the CI pipeline (not stored in the DHF),
  making it a CI artifact that can be audited independently.'
verification_method:
- Test
type: SYS
