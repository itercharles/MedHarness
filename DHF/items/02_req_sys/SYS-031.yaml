id: SYS-031
title: Test Verification Status Display
content: The system shall display the verification status (verified / failed / not_verified)
  of each requirement item in traceability views, showing which requirements are covered
  by passing test cases and which have failures or no test results.
category: Functional
verification_method:
- Test
critical_safety: false
status: approved
satisfies:
- CRS-008
