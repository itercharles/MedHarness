checklists:
  - id: user_needs_review
    name: User Needs Review Guidance
    description: Guidance for reviewing customer requirements
    applicable_to: [CRS]
    guidance_points:
      - id: g1
        text: Verify the user need is clearly stated
      - id: g2
        text: Verify the user group is identified
      - id: g3
        text: Verify the source is documented
      - id: g4
        text: Check for completeness and clarity
  
  - id: system_requirements_review
    name: System Requirements Review Guidance
    description: Guidance for reviewing system requirements
    applicable_to: [SYS]
    guidance_points:
      - id: g1
        text: Verify requirement is clear and unambiguous
      - id: g2
        text: Verify requirement is traceable to customer needs
      - id: g3
        text: Verify verification method is specified
      - id: g4
        text: Verify safety criticality is assessed
      - id: g5
        text: Check for testability and measurability
  
  - id: design_review
    name: Design Review Guidance
    description: Guidance for reviewing software design specifications
    applicable_to: [SDS]
    guidance_points:
      - id: g1
        text: Verify design implements the requirements
      - id: g2
        text: Verify design is documented sufficiently
      - id: g3
        text: Verify interfaces are clearly defined
      - id: g4
        text: Check for modularity and maintainability
