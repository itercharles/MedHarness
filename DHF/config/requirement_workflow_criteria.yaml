# Workflow Criteria Configuration for Requirements
# Defines criteria that must be met for requirement lifecycle transitions
# Enforces hierarchical approval: CRS → SYS → SDS

# Customer Requirements (CRS) - top level, no parent dependencies
crs_draft_to_approved:
  - id: content_complete
    name: "Content documented"
    description: "Requirement content must be fully documented"
    check_type: "field_not_empty"
    field: "content"
    required: true
  
  - id: title_defined
    name: "Title defined"
    description: "Requirement must have a descriptive title"
    check_type: "field_not_empty"
    field: "title"
    required: true
  
  - id: review_complete
    name: "Review completed"
    description: "Requirement has been reviewed by qualified person"
    check_type: "manual"
    required: true

# System Requirements (SYS) - must have approved CRS parent
sys_draft_to_approved:
  - id: content_complete
    name: "Content documented"
    description: "Requirement content must be fully documented"
    check_type: "field_not_empty"
    field: "content"
    required: true
  
  - id: title_defined
    name: "Title defined"
    description: "Requirement must have a descriptive title"
    check_type: "field_not_empty"
    field: "title"
    required: true
  
  - id: parent_crs_approved
    name: "Parent CRS approved"
    description: "All linked customer requirements must be approved"
    check_type: "linked_items_approved"
    linked_type: "CRS"
    required: true
  
  - id: review_complete
    name: "Review completed"
    description: "Requirement has been reviewed by qualified person"
    check_type: "manual"
    required: true

# Software Design Specs (SDS) - must have approved SYS parent
sds_draft_to_approved:
  - id: content_complete
    name: "Content documented"
    description: "Requirement content must be fully documented"
    check_type: "field_not_empty"
    field: "content"
    required: true
  
  - id: title_defined
    name: "Title defined"
    description: "Requirement must have a descriptive title"
    check_type: "field_not_empty"
    field: "title"
    required: true
  
  - id: parent_sys_approved
    name: "Parent SYS approved"
    description: "All linked system requirements must be approved"
    check_type: "linked_items_approved"
    linked_type: "SYS"
    required: true
  
  - id: review_complete
    name: "Review completed"
    description: "Requirement has been reviewed by qualified person"
    check_type: "manual"
    required: true

# Retirement criteria (same for all requirement types)
crs_approved_to_retired:
  - id: retirement_reason
    name: "Retirement reason documented"
    description: "Reason for retirement must be documented"
    check_type: "field_not_empty"
    field: "retired_reason"
    required: true
  
  - id: impact_assessed
    name: "Impact assessed"
    description: "Impact of retirement on linked items has been assessed"
    check_type: "manual"
    required: true

sys_approved_to_retired:
  - id: retirement_reason
    name: "Retirement reason documented"
    description: "Reason for retirement must be documented"
    check_type: "field_not_empty"
    field: "retired_reason"
    required: true
  
  - id: impact_assessed
    name: "Impact assessed"
    description: "Impact of retirement on linked items has been assessed"
    check_type: "manual"
    required: true

sds_approved_to_retired:
  - id: retirement_reason
    name: "Retirement reason documented"
    description: "Reason for retirement must be documented"
    check_type: "field_not_empty"
    field: "retired_reason"
    required: true
  
  - id: impact_assessed
    name: "Impact assessed"
    description: "Impact of retirement on linked items has been assessed"
    check_type: "manual"
    required: true
