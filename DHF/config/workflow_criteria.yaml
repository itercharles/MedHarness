# Workflow Criteria Configuration
# Define criteria that must be met for each workflow transition
# This configuration can be used for releases, change requests, or any workflow-based process
# Current usage: Release workflow (planning → developing → testing → released)

# Criteria for moving from planning → developing
planning_to_developing:
  - id: all_crs_included
    name: "Change requests included"
    description: "At least one change request must be included in the release"
    check_type: "change_requests_count"
    min_count: 1
  
  - id: all_crs_approved
    name: "All change requests approved"
    description: "All included change requests must be in approved status"
    check_type: "change_requests_approved"
    required: true

# Criteria for moving from developing → testing
developing_to_testing:
  - id: implementation_complete
    name: "Implementation complete"
    description: "All change requests should be implemented (manual check)"
    check_type: "manual"
    required: true
  
  - id: code_review_done
    name: "Code reviews completed"
    description: "All code changes should be reviewed (manual check)"
    check_type: "manual"
    required: true

# Criteria for moving from testing → released
testing_to_released:
  - id: validation_passed
    name: "Validation passed"
    description: "Release must pass all validation checks"
    check_type: "validation_status"
    required: true
  
  - id: all_tests_pass
    name: "All tests passing"
    description: "All tests must have PASS status"
    check_type: "test_status"
    min_percentage: 100
  
  - id: no_critical_defects
    name: "No open critical defects"
    description: "No critical severity defects should be open"
    check_type: "critical_defects"
    max_count: 0
    severity: "warning"  # Warning only, doesn't block

