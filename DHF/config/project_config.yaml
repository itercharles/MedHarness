  - name: title
    format: short_text
    label: Title
  - name: description
    format: long_text
    label: Description
  - name: justification
    format: long_text
    label: Justification
  - name: impact_assessment
    format: long_text
    label: Impact Assessment
  - name: priority
    format: select
    options:
    - High
    - Medium
    - Low
    label: Priority
  - name: requested_by
    format: short_text
    label: Requested By
  - name: assigned_to
    format: short_text
