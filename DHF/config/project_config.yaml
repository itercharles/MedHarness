- code: DEFECT
  name: Defect
  prefix: DEF-
  directory: 08_defect
  properties:
  - id
  - title
  - description
  - severity
  - priority
  - found_in_version
  - affected_components
  - steps_to_reproduce
  - expected_behavior
  - actual_behavior
  - assigned_to
  icon: 🐛
  page_enabled: true
  page_number: 8
  lifecycle:
    states:
    - id: open
      label: Open
      color: error
      icon: 🔴
      is_initial: true
    - id: in_progress
      label: In Progress
      color: warning
      icon: 🔧
    - id: resolved
      label: Resolved
      color: info
      icon: ✅
    - id: verified
      label: Verified
      color: success
      icon: 🎯
    - id: closed
      label: Closed
      color: secondary
      icon: 🔒
    - id: reopened
      label: Reopened
      color: error
      icon: 🔄
    transitions:
    - from: open
      to: in_progress
      label: Start Work
      criteria:
      - id: assigned
        name: Assigned to developer
        check_type: field_not_empty
        field: assigned_to
        required: true
      - id: severity_set
        name: Severity defined
        check_type: field_not_empty
        field: severity
        required: true
    - from: in_progress
      to: resolved
      label: Resolve
      criteria:
      - id: fix_implemented
        name: Fix implemented
        check_type: manual
        required: true
      - id: root_cause
        name: Root cause documented
        check_type: field_not_empty
        field: description
        required: true
    - from: resolved
      to: verified
      label: Verify Fix
      criteria:
      - id: verification_complete
        name: Verification completed
        check_type: manual
        required: true
    - from: verified
      to: closed
      label: Close
      criteria:
      - id: closure_approved
        name: Closure approved
        check_type: manual
        required: true
    - from: closed
      to: reopened
      label: Reopen
      criteria:
      - id: reopen_reason
        name: Reopen reason documented
        check_type: manual
        required: true
    - from: reopened
      to: in_progress
      label: Resume Work
