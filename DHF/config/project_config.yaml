test_integration:
  automated:
    repository: itercharles/CompliantFlow
    workflow_name: Test Suite
    artifact_name: test-results
    token_env: GITHUB_TOKEN
  manual:
    audit_log: test-results/manual_tests.log
    require_verified_by: true
    require_verification_date: true
