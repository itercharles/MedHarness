    - id: submitted
      label: Submitted
      color: info
      icon: 📥
      is_initial: true
    - id: under_review
      label: Under Review
      color: warning
      icon: 🔍
    - id: approved
      label: Approved
      color: success
      icon: ✅
    - id: rejected
      label: Rejected
      color: error
      icon: ❌
