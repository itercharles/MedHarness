- code: SYS
  name: System Requirement
  prefix: SYS-
  directory: 02_req_sys
  allowed_parents:
  - CRS
  - RCM
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: content
    format: long_text
    label: Requirement Description
    required: true
    height: 200
    placeholder: Describe the system requirement in detail...
    help: Provide a clear, testable requirement statement per IEC 62304
  - name: category
    format: select
    label: Category
    required: true
    options:
    - Functional
    - Performance
    - Security
    - Usability
    - Reliability
    - Maintainability
    default: Functional
    help: Select the requirement category
  - name: verification_method
    format: multiselect
    label: Verification Methods
    options:
    - Test
    - Inspection
    - Analysis
    - Demonstration
    help: Select applicable verification methods per IEC 62304 5.7
  - name: critical_safety
    format: checkbox
    label: Critical Safety
  - name: satisfies
    format: item_multiselect
    label: Satisfies (Customer Requirements)
    target_types:
    - CRS
    help: Link to parent customer requirements
  - name: implements
    format: item_multiselect
    label: Implements (Risk Control Measures)
    target_types:
    - RCM
    help: Link to risk control measures this requirement implements
  - name: derives_from
    format: item_multiselect
    label: Derives From
    target_types:
    - CRS
    help: Alternative relationship to customer requirements
  - reviewer
  - review_date
  - status
  relations:
  - target: CRS
    label: satisfies
  - target: RCM
    label: implements
  icon: ⚙️
  page_enabled: true
  page_number: 6
  lifecycle:
    states:
    - id: draft
      label: Draft
      color: warning
      icon: 📝
      is_initial: true
    - id: approved
      label: Approved
      color: success
      icon: ✅
      is_stable: true
    - id: retired
      label: Retired
      color: info
      icon: 🔒
    transitions:
    - from: draft
      to: approved
      label: Approve
      criteria:
      - id: content_complete
        name: Content documented
        check_type: field_not_empty
        field: content
        required: true
      - id: title_defined
        name: Title defined
        check_type: field_not_empty
        field: title
        required: true
      - id: parent_crs_approved
        name: Parent CRS approved
        description: All linked customer requirements must be approved
        check_type: linked_items_approved
        relationship_field: derives_from
        required_status: approved
        required: true
      - id: review_complete
        name: Review completed
        check_type: manual
        required: true
    - from: approved
      to: retired
      label: Retire
      criteria:
      - id: retirement_reason
        name: Retirement reason
        check_type: field_not_empty
        field: retired_reason
        required: true
      - id: impact_assessed
        name: Impact assessed
        check_type: manual
        required: true
  has_verification: true
  verification_states:
  - not_verified
  - verified
  - failed
