  prefix: UC-
  directory: 00_uc
  properties:
  - id
  - title
  - content
  - status
  icon: 👤
  page_enabled: true
  page_number: 4
  lifecycle:
    states:
    - id: draft
      label: Draft
      color: warning
      icon: 📝
      is_initial: true
    - id: approved
      label: Approved
      color: success
      icon: ✅
      is_stable: true
    transitions:
    - from: draft
      to: approved
      label: Approve
- code: CRS
  name: Customer Requirement
  prefix: CRS-
  directory: 01_req_crs
  properties:
  - id
  - title
  - content
  - user_group
  - source
  - reviewer
  - review_date
  - derives_from
  - rationale
  - stakeholder
  - priority
