      to: in_progress
      label: Start Implementation
      criteria:
      - id: assigned
        name: Assigned to developer
        check_type: field_not_empty
        field: assigned_to
        required: true
    - from: in_progress
      to: completed
      label: Complete
      criteria:
      - id: implementation_done
        name: Implementation completed
        check_type: manual
        required: true
      - id: testing_done
        name: Testing completed
        check_type: manual
        required: true
    - from: submitted
      to: cancelled
      label: Cancel
    - from: under_review
      to: cancelled
      label: Cancel
