      label: Revise
      criteria: []
traceability_matrices:
- name: Complete Requirements Chain
  description: Full traceability from use cases through all requirement levels to
    detailed design
  path:
  - UC
  - CRS
  - SYS
  - SRS
  - SWDD
- name: System Requirements to System Architecture
  description: System requirements and their architectural designs
  path:
  - SYS
  - SYS_ARCH
- name: Risk to Control Measures
  description: Risks to risk control measures
  path:
  - RISK
  - RCM
- name: Risk Control to System
  description: Risk control measures to system requirements
  path:
  - RCM
  - SYS
- name: Customer Validation
  description: Customer requirements to validation tests
  path:
  - CRS
  - TC-CRS
- name: System Verification
  description: System requirements to system tests
  path:
  - SYS
  - TC-SYS
- name: Software Requirements Verification
  description: Software requirements to software tests
  path:
  - SRS
  - TC-SRS
document_specifications:
