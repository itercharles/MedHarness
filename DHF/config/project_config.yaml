      color: warning
      icon: 📝
      is_initial: true
    - id: approved
      label: Approved
      color: success
      icon: ✅
      is_stable: true
    - id: retired
      label: Retired
      color: info
      icon: 🔒
    transitions:
    - from: draft
      to: approved
      label: Approve
      criteria:
      - id: content_complete
        name: Content documented
        check_type: field_not_empty
        field: content
        required: true
      - id: title_defined
        name: Title defined
        check_type: field_not_empty
        field: title
        required: true
      - id: parent_crs_approved
        name: Parent CRS approved
        description: All linked customer requirements must be approved
        check_type: linked_items_approved
        linked_type: CRS
        required_status: approved
        required: true
      - id: review_complete
        name: Review completed
        check_type: manual
        required: true
    - from: approved
