change_control:
  enabled: true
  change_request_type: CR
  affected_items_field: affected_items
global_lifecycle:
  states:
  - id: draft
    label: Draft
    action_label: Create
    icon: 📝
    color: warning
    is_initial: true
  - id: in_review
    label: In Review
    action_label: Submit for Review
    icon: 🔍
    color: info
  - id: open
    label: Open
    action_label: Submit
    icon: 📂
    color: info
  - id: in_progress
    label: In Progress
    action_label: Start Work
    icon: 🔧
    color: warning
  - id: resolved
    label: Resolved
    action_label: Resolve
    icon: ✅
    color: success
  - id: approved
    label: Approved
    action_label: Approve
    icon: ✅
    color: success
  - id: implementing
    label: Implementing
    action_label: Start Implementation
    icon: 🔧
    color: warning
  - id: completed
    label: Completed
    action_label: Complete
    icon: 🎯
    color: success
  - id: verified
    label: Verified
    action_label: Verify
    icon: ✓
    color: success
  - id: validated
    label: Validated
    action_label: Validate
    icon: ✓✓
    color: success
  - id: released
    label: Released
    action_label: Release
    icon: 🚀
    color: success
    is_stable: true
  - id: cancelled
    label: Cancelled
    action_label: Cancel
    icon: 🚫
    color: secondary
    is_stable: true
  - id: retired
    label: Retired
    action_label: Retire
    icon: 📦
    color: secondary
    is_stable: true
  - id: closed
    label: Closed
    action_label: Close
    icon: 🚫
    color: secondary
    is_stable: true
doc_types:
- code: UC
  name: Use Case
  prefix: UC-
  directory: 00_uc
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: content
    format: long_text
    label: Content
  icon: 👤
  page_enabled: true
  page_number: 4
  lifecycle:
    transitions:
    - from_states:
      - null
      to_state: draft
    - from_states:
      - draft
      to_state: in_review
      criteria:
      - id: content_complete
        name: Content is complete
        check_type: field_not_empty
        field: content
        required: true
    - from_states:
      - draft
      - in_review
      - approved
      - retired
      to_state: closed
    - from_states:
      - in_review
      to_state: approved
      criteria:
      - id: review_complete
        name: Review completed
        check_type: manual
        required: true
    - from_states:
      - in_review
      to_state: draft
    - from_states:
      - approved
      to_state: retired
- code: CRS
  name: Customer Requirement
  prefix: CRS-
  directory: 01_req_crs
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: content
    format: long_text
    label: Content
  - name: user_group
    format: short_text
    label: User Group
  - name: source
    format: short_text
    label: Source
  - name: derives_from
    format: relationship
    target_types:
    - UC
    label: Derives From
  - name: rationale
    format: long_text
    label: Rationale
  - name: stakeholder
    format: short_text
    label: Stakeholder
  - name: priority
    format: select
    options:
    - Critical
    - High
    - Medium
    - Low
    default: Medium
    label: Priority
  icon: 🎯
  page_enabled: true
  page_number: 5
  lifecycle:
    transitions:
    - from_states:
      - null
      to_state: draft
    - from_states:
      - draft
      to_state: approved
      criteria:
      - id: content_complete
        name: Content documented
        description: Requirement content must be fully documented
        check_type: field_not_empty
        field: content
        required: true
      - id: title_defined
        name: Title defined
        description: Requirement must have a descriptive title
        check_type: field_not_empty
        field: title
        required: true
      - id: review_complete
        name: Review completed
        description: Requirement has been reviewed by qualified person
        check_type: manual
        required: true
      label: Approve
    - from_states:
      - approved
      to_state: retired
      criteria:
      - id: retirement_reason
        name: Retirement reason documented
        description: Reason for retirement must be documented
        check_type: field_not_empty
        field: retired_reason
        required: true
      - id: impact_assessed
        name: Impact assessed
        description: Impact of retirement on linked items assessed
        check_type: manual
        required: true
      label: Retire
  has_verification: true
  verification_states:
  - not_verified
  - verified
  - failed
- code: RISK
  name: Risk Analysis
  prefix: RISK-
  directory: 12_risks
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: hazard
    format: long_text
    label: Hazard
  - name: cause
    format: long_text
    label: Cause
  - name: effect
    format: long_text
    label: Effect
  - name: severity_pre
    format: select
    options:
    - S1
    - S2
    - S3
    - S4
    - S5
    label: Severity (Pre-Mitigation)
  - name: probability_pre
    format: select
    options:
    - P1
    - P2
    - P3
    - P4
    - P5
    label: Probability (Pre-Mitigation)
  - name: severity_post
    format: select
    options:
    - S1
    - S2
    - S3
    - S4
    - S5
    label: Severity (Post-Mitigation)
  - name: probability_post
    format: select
    options:
    - P1
    - P2
    - P3
    - P4
    - P5
    label: Probability (Post-Mitigation)
  - name: risk_acceptability
    format: select
    options:
    - Acceptable
    - ALARP
    - Unacceptable
    label: Risk Acceptability
  - name: risk_benefit
    format: long_text
    label: Risk Benefit
  icon: ⚠️
  page_enabled: true
  page_number: 12
  lifecycle:
    transitions:
    - from_states:
      - null
      to_state: draft
    - from_states:
      - draft
      to_state: in_review
      label: Submit for Review
    - from_states:
      - in_review
      to_state: approved
      label: Approve
    - from_states:
      - in_review
      to_state: draft
      label: Request Changes
- code: RCM
  name: Risk Control Measure
  prefix: RCM-
  directory: 13_rcm
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: content
    format: long_text
    label: Content
  - name: mitigates
    format: relationship
    target_types:
    - RISK
    label: Mitigates
  - name: implements
    format: relationship
    target_types:
    - SYS
    label: Implemented By

  - name: control_type
    format: select
    options:
    - Inherently Safe Design
    - Protective Measure
    - Information for Safety
    label: Control Type
  - name: implementation_status
    format: select
    options:
    - Planned
    - Implemented
    - Verified
    label: Implementation Status
  icon: 🛡️
  page_enabled: true
  page_number: 11
  lifecycle:
    transitions:
    - from_states:
      - null
      to_state: draft
    - from_states:
      - draft
      to_state: approved
      label: Approve
- code: TC-CRS
  name: Customer Validation Test
  prefix: TC-CRS-
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: verifies
    format: relationship
    target_types:
    - CRS
    label: Verifies
  icon: 🧪
  page_enabled: false
- code: TC-SYS
  name: System Verification Test
  prefix: TC-SYS-
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: verifies
    format: relationship
    target_types:
    - SYS
    label: Verifies
  icon: 🧪
  page_enabled: false
- code: TC-SRS
  name: Software Requirements Verification Test
  prefix: TC-SRS-
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: verifies
    format: relationship
    target_types:
    - SRS
    label: Verifies
  icon: 🧪
  page_enabled: false
- code: SYS
  name: System Requirement
  prefix: SYS-
  directory: 02_req_sys
  allowed_parents:
  - CRS
  - RCM
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: content
    format: long_text
    label: Requirement Description
    required: true
    height: 200
    placeholder: Describe the system requirement in detail...
    help: Provide a clear, testable requirement statement per IEC 62304
  - name: category
    format: select
    label: Category
    required: true
    options:
    - Functional
    - Performance
    - Security
    - Usability
    - Reliability
    - Maintainability
    - Change Control
    - Document Management
    default: Functional
    help: Select the requirement category
  - name: verification_method
    format: multiselect
    label: Verification Methods
    options:
    - Test
    - Inspection
    - Analysis
    - Demonstration
    help: Select applicable verification methods per IEC 62304 5.7
  - name: critical_safety
    format: checkbox
    label: Critical Safety
  - name: satisfies
    format: item_multiselect
    label: Satisfies (Customer Requirements)
    target_types:
    - CRS
    help: Link to parent customer requirements
  - name: implements
    format: item_multiselect
    label: Implements (Risk Control Measures)
    target_types:
    - RCM
    help: Link to risk control measures this requirement implements
  - name: derives_from
    format: item_multiselect
    label: Derives From
    target_types:
    - CRS
    help: Alternative relationship to customer requirements
  relations:
  - target: CRS
    label: satisfies
  - target: RCM
    label: implements
  icon: ⚙️
  page_enabled: true
  page_number: 6
  lifecycle:
    transitions:
    - from_states:
      - null
      to_state: draft
    - from_states:
      - draft
      to_state: approved
      criteria:
      - id: content_complete
        name: Content documented
        check_type: field_not_empty
        field: content
        required: true
      - id: title_defined
        name: Title defined
        check_type: field_not_empty
        field: title
        required: true
      - id: parent_crs_approved
        name: Parent CRS approved
        description: All linked customer requirements must be approved
        check_type: linked_items_approved
        relationship_field: derives_from
        required_status: approved
        required: true
      - id: review_complete
        name: Review completed
        check_type: manual
        required: true
      label: Approve
    - from_states:
      - approved
      to_state: retired
      criteria:
      - id: retirement_reason
        name: Retirement reason
        check_type: field_not_empty
        field: retired_reason
        required: true
      - id: impact_assessed
        name: Impact assessed
        check_type: manual
        required: true
      label: Retire
  has_verification: true
  verification_states:
  - not_verified
  - verified
  - failed
- code: SRS
  name: Software Requirement
  prefix: SRS-
  directory: 03_req_srs
  allowed_parents:
  - SYS
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: content
    format: long_text
    label: Content
  - name: derives_from
    format: relationship
    target_types:
    - SYS
    label: Derives From
  - name: performance
    format: long_text
    label: Performance

  icon: 💻
  page_enabled: true
  page_number: 7
  lifecycle:
    transitions:
    - from_states:
      - null
      to_state: draft
    - from_states:
      - draft
      to_state: approved
      label: Approve
  has_verification: true
  verification_states:
  - not_verified
  - verified
  - failed
- code: SYSARCH
  name: System Architecture
  prefix: SYSARCH-
  directory: 06_sys_arch
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: content
    format: long_text
    label: Content
  - name: design
    format: item_multiselect
    target_types:
    - SYS
    label: Designs Requirements
  relations:
  - target: SYS
    label: design
  icon: 🏗️
  page_enabled: true
  page_number: 8
  lifecycle:
    transitions:
    - from_states:
      - null
      to_state: draft
    - from_states:
      - draft
      to_state: approved
      label: Approve
- code: SWDD
  name: Software Detailed Design
  prefix: SWDD-
  directory: 05_swdd
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: content
    format: long_text
    label: Content
  - name: implements
    format: relationship
    target_types:
    - SRS
    label: Implements
  icon: 📋
  page_enabled: true
  page_number: 10
  lifecycle:
    transitions:
    - from_states:
      - null
      to_state: draft
    - from_states:
      - draft
      to_state: approved
      label: Approve
  verification_states:
  - not_verified
  - verified
  - failed
- code: CR
  name: Change Request
  prefix: CR-
  directory: 09_cr
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: content
    format: long_text
    label: Content
  - name: description
    format: long_text
    label: Description
  - name: justification
    format: long_text
    label: Justification
  - name: impact_assessment
    format: long_text
    label: Impact Assessment
  - name: priority
    format: select
    options:
    - High
    - Medium
    - Low
    label: Priority
  - name: requested_by
    format: short_text
    label: Requested By
  - name: assigned_to
    format: short_text
    label: Assigned To
  - name: affected_items
    format: relationship
    label: Affected Items
  - name: implementation_prs
    format: long_text
    label: Implementation PRs (JSON List)
  - name: target_version
    format: short_text
    label: Target Version
  - name: category
    format: short_text
    label: Category
  - name: implementation_notes
    format: long_text
    label: Implementation Notes
  - name: target_release
    format: relationship
    target_types:
    - RELEASE
    label: Target Release
  icon: 📝
  page_enabled: true
  page_number: 9
  lifecycle:
    transitions:
    - from_states:
      - null
      to_state: draft
    - from_states:
      - draft
      to_state: in_review
      criteria:
      - id: description_complete
        name: Description complete
        check_type: field_not_empty
        field: description
        required: true
      - id: justification_provided
        name: Justification provided
        check_type: field_not_empty
        field: justification
        required: true
      label: Submit for Review
    - from_states:
      - in_review
      to_state: approved
      criteria:
      - id: impact_assessed
        name: Impact assessed
        check_type: field_not_empty
        field: impact_assessment
        required: true
      - id: review_complete
        name: Review completed
        check_type: manual
        required: true
      label: Approve
    - from_states:
      - in_review
      to_state: cancelled
      criteria:
      - id: rejection_reason
        name: Rejection reason documented
        check_type: manual
        required: true
      label: Reject
    - from_states:
      - approved
      to_state: implementing
      criteria:
      - id: assigned
        name: Assigned to developer
        check_type: field_not_empty
        field: assigned_to
        required: true
      label: Start Implementation
    - from_states:
      - implementing
      to_state: completed
      criteria:
      - id: implementation_done
        name: Implementation completed
        check_type: manual
        required: true
      - id: testing_done
        name: Testing completed
        check_type: manual
        required: true
      label: Complete
    - from_states:
      - draft
      to_state: cancelled
      label: Cancel
    - from_states:
      - in_review
      to_state: cancelled
      label: Cancel
- code: REL
  name: Release
  prefix: REL-
  directory: 10_release
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: version
    format: short_text
    label: Version
  - name: content
    format: long_text
    label: Content
  - name: included_items
    format: item_multiselect
    target_types:
    - CR
    label: Included Items
  - name: release_notes
    format: long_text
    label: Release Notes
  icon: 🚀
  page_enabled: true
  page_number: 4
  lifecycle:
    transitions:
    - from_states:
      - null
      to_state: draft
    - from_states:
      - draft
      to_state: approved
      criteria:
      - id: version_set
        name: Version defined
        check_type: field_not_empty
        field: version
        required: true
      - id: items_planned
        name: Items planned
        check_type: field_not_empty
        field: included_items
        required: false
      label: Approve
    - from_states:
      - approved
      to_state: released
      criteria:
      - id: verification_complete
        name: Verification completed
        check_type: manual
        required: true
      label: Release
- code: DEF
  name: Defect
  prefix: DEF-
  directory: 14_defects
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: description
    format: long_text
    label: Description
  - name: steps_to_reproduce
    format: long_text
    label: Steps to Reproduce
  - name: severity
    format: select
    options:
    - Critical
    - High
    - Medium
    - Low
    label: Severity
  - name: priority
    format: select
    options:
    - High
    - Medium
    - Low
    label: Priority
  - name: reported_by
    format: short_text
    label: Reported By
  - name: assigned_to
    format: short_text
    label: Assigned To
  - name: violated_requirements
    format: item_multiselect
    target_types:
    - CRS
    - SYS
    - SRS
    - SWDD
    label: Violated Requirements
  - name: affected_items
    format: relationship
    label: Affected Items
  - name: root_cause
    format: long_text
    label: Root Cause Analysis
  - name: resolution
    format: long_text
    label: Resolution
  - name: found_in_release
    format: relationship
    target_types:
    - REL
    label: Found in Release
  - name: fixed_in_release
    format: relationship
    target_types:
    - REL
    label: Fixed in Release
  icon: 🐛
  page_enabled: true
  page_number: 13
  lifecycle:
    transitions:
    - from_states:
      - null
      to_state: draft
    - from_states:
      - draft
      to_state: open
      criteria:
      - id: description_complete
        name: Description complete
        check_type: field_not_empty
        field: description
        required: true
      - id: steps_provided
        name: Steps to reproduce provided
        check_type: field_not_empty
        field: steps_to_reproduce
        required: true
      - id: severity_set
        name: Severity set
        check_type: field_not_empty
        field: severity
        required: true
      label: Submit
    - from_states:
      - open
      to_state: in_progress
      criteria:
      - id: assigned
        name: Assigned to developer
        check_type: field_not_empty
        field: assigned_to
        required: true
      label: Start Work
    - from_states:
      - in_progress
      to_state: resolved
      criteria:
      - id: resolution_provided
        name: Resolution documented
        check_type: field_not_empty
        field: resolution
        required: true
      - id: fix_verified
        name: Fix verified
        check_type: manual
        required: true
      label: Resolve
    - from_states:
      - resolved
      to_state: closed
      criteria:
      - id: closure_verified
        name: Closure verified
        check_type: manual
        required: true
      label: Close
    - from_states:
      - open
      to_state: cancelled
      criteria:
      - id: wont_fix_reason
        name: Won't fix reason documented
        check_type: manual
        required: true
      label: Won't Fix
    - from_states:
      - in_progress
      to_state: open
      label: Reopen
- code: SOUP
  name: Software of Unknown Provenance
  prefix: SOUP-
  directory: 11_soup
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: content
    format: long_text
    label: Content
  - name: name
    format: short_text
    label: Name
  - name: version
    format: short_text
    label: Version
  - name: manufacturer
    format: short_text
    label: Manufacturer
  - name: license
    format: short_text
    label: License
  - name: purpose
    format: long_text
    label: Purpose
  - name: homepage
    format: short_text
    label: Homepage
  - name: cve_count
    format: short_text
    label: CVE Count
  - name: risk_rating
    format: short_text
    label: Risk Rating
  - name: safety_class
    format: short_text
    label: Safety Class
  - name: verification_method
    format: short_text
    label: Verification Method
  icon: 📦
  page_enabled: true
  page_number: 11
  lifecycle:
    transitions:
    - from_states:
      - null
      to_state: draft
    - from_states:
      - draft
      to_state: in_review
      criteria:
      - id: purpose_set
        name: Purpose documented
        description: SOUP usage purpose must be documented per IEC 62304 5.3.4
        check_type: field_not_empty
        field: purpose
        required: true
      - id: safety_class_set
        name: Safety class assigned
        description: Safety classification (A/B/C) must be assigned
        check_type: field_not_empty
        field: safety_class
        required: true
      - id: linked_to_req
        name: Linked to SYS requirement
        description: SOUP must be linked to at least one system requirement
        check_type: has_links
        required: true
      label: Submit for Review
    - from_states:
      - in_review
      to_state: approved
      criteria:
      - id: verification_done
        name: Verification completed
        description: SOUP verification evidence documented
        check_type: manual
        required: true
      label: Approve
    - from_states:
      - under_review
      to_state: rejected
      criteria:
      - id: rejection_reason
        name: Rejection reason
        description: Reason for rejecting SOUP must be documented
        check_type: manual
        required: true
      label: Reject
    - from_states:
      - rejected
      to_state: draft
      criteria: []
      label: Revise
traceability_matrices:
- name: Complete Requirements Chain
  description: Full traceability from use cases through all requirement levels to
    detailed design
  path:
  - UC
  - CRS
  - SYS
  - SRS
  - SWDD
- name: System Requirements to System Architecture
  description: System requirements and their architectural designs
  path:
  - SYS
  - SYSARCH
- name: Risk to Control Measures
  description: Risks to risk control measures
  path:
  - RISK
  - RCM
- name: Risk Control to System
  description: Risk control measures to system requirements
  path:
  - RCM
  - SYS
- name: Customer Validation
  description: Customer requirements to validation tests
  path:
  - CRS
  - TC-CRS
- name: System Verification
  description: System requirements to system tests
  path:
  - SYS
  - TC-SYS
- name: Software Requirements Verification
  description: Software requirements to software tests
  path:
  - SRS
  - TC-SRS
document_specifications:
  UC:
    template: requirements_specification.md.j2
    output: DHF/documents/specifications/Use_Case_Specification.md
    doc_type_name: Use Case
  CRS:
    template: requirements_specification.md.j2
    output: DHF/documents/specifications/Customer_Requirement_Specification.md
    doc_type_name: Customer Requirement
