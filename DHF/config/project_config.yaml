      icon: 📝
      is_initial: true
    - id: approved
      label: Approved
      color: success
      icon: ✅
      is_stable: true
    - id: retired
      label: Retired
      color: info
      icon: 🔒
    transitions:
    - from: draft
      to: approved
      label: Approve
      criteria:
      - id: content_complete
        name: Content documented
        description: Requirement content must be fully documented
        check_type: field_not_empty
        field: content
        required: true
      - id: title_defined
        name: Title defined
        description: Requirement must have a descriptive title
        check_type: field_not_empty
        field: title
        required: true
      - id: review_complete
        name: Review completed
        description: Requirement has been reviewed by qualified person
        check_type: manual
        required: true
    - from: approved
      to: retired
      label: Retire
      criteria:
      - id: retirement_reason
        name: Retirement reason documented
        description: Reason for retirement must be documented
        check_type: field_not_empty
        field: retired_reason
        required: true
      - id: impact_assessed
        name: Impact assessed
        description: Impact of retirement on linked items assessed
        check_type: manual
        required: true
  has_verification: true
  verification_states:
  - not_verified
  - verified
  - failed
- code: RISK
  name: Risk Analysis
  prefix: RISK-
