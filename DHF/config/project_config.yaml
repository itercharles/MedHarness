    - id: in_progress
      label: In Progress
      color: warning
      icon: 🔧
    - id: completed
      label: Completed
      color: success
      icon: 🎯
      is_stable: true
    - id: cancelled
      label: Cancelled
      color: secondary
      icon: 🚫
      is_stable: true
    transitions:
    - from: submitted
      to: under_review
      label: Start Review
      criteria:
      - id: description_complete
        name: Description complete
        check_type: field_not_empty
        field: description
        required: true
      - id: justification_provided
        name: Justification provided
        check_type: field_not_empty
        field: justification
        required: true
    - from: under_review
      to: approved
      label: Approve
      criteria:
      - id: impact_assessed
        name: Impact assessed
        check_type: field_not_empty
        field: impact_assessment
        required: true
      - id: review_complete
        name: Review completed
        check_type: manual
        required: true
    - from: under_review
      to: rejected
      label: Reject
      criteria:
      - id: rejection_reason
        name: Rejection reason documented
        check_type: manual
        required: true
    - from: approved
      to: in_progress
      label: Start Implementation
      criteria:
      - id: assigned
        name: Assigned to developer
        check_type: field_not_empty
        field: assigned_to
        required: true
    - from: in_progress
      to: completed
      label: Complete
      criteria:
      - id: implementation_done
        name: Implementation completed
        check_type: manual
        required: true
      - id: testing_done
        name: Testing completed
        check_type: manual
        required: true
    - from: submitted
      to: cancelled
      label: Cancel
    - from: under_review
      to: cancelled
      label: Cancel
