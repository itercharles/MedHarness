change_control:
  enabled: true
  change_request_type: CR
  affected_items_field: affected_items

global_lifecycle:
  states:
    - id: draft
      label: Draft
      action_label: Create  # Action to reach this state
      icon: 📝
      color: warning
      is_initial: true
    - id: in_review
      label: In Review
      action_label: Submit for Review
      icon: 🔍
      color: info
    - id: approved
      label: Approved
      action_label: Approve
      icon: ✅
      color: success
    - id: implementing
      label: Implementing
      action_label: Start Implementation
      icon: 🔧
      color: warning
    - id: completed
      label: Completed
      action_label: Complete
      icon: 🎯
      color: success
    - id: verified
      label: Verified
      action_label: Verify
      icon: ✓
      color: success
    - id: validated
      label: Validated
      action_label: Validate
      icon: ✓✓
      color: success
    - id: accepted
      label: Accepted
      action_label: Accept
      icon: 👍
      color: success
    - id: retired
      label: Retired
      action_label: Retire
      icon: 📦
      color: secondary
      is_stable: true
    - id: closed
      label: Closed
      action_label: Close
      icon: 🚫
      color: secondary
      is_stable: true

doc_types:
- code: UC
  name: Use Case
  prefix: UC-
  directory: 00_uc
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: content
    format: long_text
    label: Content
  icon: 👤
  page_enabled: true
  page_number: 4
  lifecycle:
    # Per-doc-type: define current_state and which states can be transitioned to
    # The action is implicitly defined by the target state's action_label
    transitions:
      - current_state: null  # Initial creation
        allowed_next_states: [draft]
      - current_state: draft
        allowed_next_states: [in_review, closed]
      - current_state: in_review
        allowed_next_states: [approved, draft, closed]
      - current_state: approved
        allowed_next_states: [retired]
      - current_state: retired
        allowed_next_states: [closed]
- code: CRS
  name: Customer Requirement
  prefix: CRS-
  directory: 01_req_crs
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: content
    format: long_text
    label: Content
  - name: user_group
    format: short_text
    label: User Group
  - name: source
    format: short_text
    label: Source
  - name: reviewer
    format: short_text
    label: Reviewer
  - name: review_date
    format: date
    label: Review Date
  - name: derives_from
    format: relationship
    target_types:
    - UC
    label: Derives From
  - name: rationale
    format: long_text
    label: Rationale
  - name: stakeholder
    format: short_text
    label: Stakeholder
  - name: priority
    format: select
    options:
    - High
    - Medium
    - Low
    default: Medium
    label: Priority
  - name: status
    format: select
    options:
    - draft
    - approved
    - retired
    label: Status
  icon: 🎯
  page_enabled: true
  page_number: 5
  lifecycle:
    states:
    - id: draft
      label: Draft
      color: warning
      icon: 📝
      is_initial: true
    - id: approved
      label: Approved
      color: success
      icon: ✅
      is_stable: true
    - id: retired
      label: Retired
      color: info
      icon: 🔒
    transitions:
    - from: draft
      to: approved
      label: Approve
      criteria:
      - id: content_complete
        name: Content documented
        description: Requirement content must be fully documented
        check_type: field_not_empty
        field: content
        required: true
      - id: title_defined
        name: Title defined
        description: Requirement must have a descriptive title
        check_type: field_not_empty
        field: title
        required: true
      - id: review_complete
        name: Review completed
        description: Requirement has been reviewed by qualified person
        check_type: manual
        required: true
    - from: approved
      to: retired
      label: Retire
      criteria:
      - id: retirement_reason
        name: Retirement reason documented
        description: Reason for retirement must be documented
        check_type: field_not_empty
        field: retired_reason
        required: true
      - id: impact_assessed
        name: Impact assessed
        description: Impact of retirement on linked items assessed
        check_type: manual
        required: true
  has_verification: true
  verification_states:
  - not_verified
  - verified
  - failed
- code: RISK
  name: Risk Analysis
  prefix: RISK-
  directory: 12_risks
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: hazard
    format: long_text
    label: Hazard
  - name: cause
    format: long_text
    label: Cause
  - name: effect
    format: long_text
    label: Effect
  - name: severity_pre
    format: select
    options:
    - S1
    - S2
    - S3
    - S4
    - S5
    label: Severity (Pre-Mitigation)
  - name: probability_pre
    format: select
    options:
    - P1
    - P2
    - P3
    - P4
    - P5
    label: Probability (Pre-Mitigation)
  - name: severity_post
    format: select
    options:
    - S1
    - S2
    - S3
    - S4
    - S5
    label: Severity (Post-Mitigation)
  - name: probability_post
    format: select
    options:
    - P1
    - P2
    - P3
    - P4
    - P5
    label: Probability (Post-Mitigation)
  - name: risk_acceptability
    format: select
    options:
    - Acceptable
    - ALARP
    - Unacceptable
    label: Risk Acceptability
  - name: risk_benefit
    format: long_text
    label: Risk Benefit
  - name: mitigates
    format: relationship
    target_types:
    - RCM
    label: Mitigated By
  - name: reviewer
    format: short_text
    label: Reviewer
  - name: review_date
    format: date
    label: Review Date
  icon: ⚠️
  page_enabled: true
  page_number: 12
  lifecycle:
    states:
    - id: draft
      label: Draft
      color: warning
      icon: 📝
      is_initial: true
    - id: under_review
      label: Under Review
      color: info
      icon: 🔍
    - id: approved
      label: Approved
      color: success
      icon: ✅
      is_stable: true
    transitions:
    - from: draft
      to: under_review
      label: Submit for Review
    - from: under_review
      to: approved
      label: Approve
    - from: under_review
      to: draft
      label: Request Changes
- code: RCM
  name: Risk Control Measure
  prefix: RCM-
  directory: 13_rcm
  properties:
  - id
  - name: title
    format: short_text
    label: Title
  - name: content
    format: long_text
    label: Content
  - name: mitigates
    format: relationship
    target_types:
    - RISK
    label: Mitigates
  - name: implements
    format: relationship
    target_types:
    - SYS
    label: Implemented By
  - name: status
    format: select
    label: Status
    options:
    - draft
    - approved
  - name: control_type
    format: select
    options:
    - Inherently Safe Design
