code: SOUP
role: soup
name: Software of Unknown Provenance
prefix: SOUP-
directory: 09_soup
properties:
- id
- name: title
  format: short_text
  label: Title
- name: content
  format: long_text
  label: Content
- name: name
  format: short_text
  label: Name
- name: version
  format: short_text
  label: Version
- name: manufacturer
  format: short_text
  label: Manufacturer
- name: license
  format: short_text
  label: License
- name: purpose
  format: long_text
  label: Purpose
- name: homepage
  format: short_text
  label: Homepage
- name: ecosystem
  format: short_text
  label: Package Ecosystem
  # OSV ecosystem identifier for vulnerability scanning, e.g. PyPI, npm, Go, Maven
- name: cve_count
  format: short_text
  label: CVE Count
- name: accepted_vulns
  format: list
  label: Accepted Vulnerabilities
  # Vulnerabilities assessed under IEC 62304 §8.1.2 and judged acceptable.
  # Each entry needs both keys or it keeps blocking 'verify soup':
  #   - id: GHSA-xxxx-yyyy-zzzz
  #     rationale: "Affected API is not reachable from our code paths."
  # Acceptance is per-ID, so newly published vulnerabilities still block.
- name: risk_rating
  format: short_text
  label: Risk Rating
- name: safety_class
  format: short_text
  label: Safety Class
- name: verification_method
  format: short_text
  label: Verification Method
