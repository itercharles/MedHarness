name: Link PR to CR

on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  link-to-cr:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      
      - name: Extract CR ID
        id: extract
        run: |
          CR_ID=$(echo "${{ github.event.pull_request.title }}" | grep -oE "CR-[0-9]+" | head -1)
          echo "cr_id=$CR_ID" >> $GITHUB_OUTPUT
      
      - name: Update PR Status to Merged
        run: |
          CR_ID="${{ steps.extract.outputs.cr_id }}"
          CR_FILE="DHF/items/09_cr/${CR_ID}.yaml"
          
          # Use Python to update CR YAML
          python3 << 'PYTHON_SCRIPT'
          import yaml
          
          cr_file = "DHF/items/09_cr/${{ steps.extract.outputs.cr_id }}.yaml"
          
          with open(cr_file, 'r') as f:
              cr_data = yaml.safe_load(f)
          
          # Find and update the PR entry
          pr_number = ${{ github.event.pull_request.number }}
          merged_at = "${{ github.event.pull_request.merged_at }}"
          
          if 'implementation_prs' in cr_data:
              for pr in cr_data['implementation_prs']:
                  if pr.get('pr_number') == pr_number:
                      pr['status'] = 'merged'
                      pr['merged_at'] = merged_at
                      print(f"Updated PR #{pr_number} status to merged")
                      break
          
          # Write back
          with open(cr_file, 'w') as f:
              yaml.dump(cr_data, f, default_flow_style=False, sort_keys=False)
          
          print(f"Updated {cr_file}")
          PYTHON_SCRIPT
      
      - name: Commit CR Update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "DHF/items/09_cr/${{ steps.extract.outputs.cr_id }}.yaml"
          git commit -m "[skip ci] Track PR #${{ github.event.pull_request.number }} in ${{ steps.extract.outputs.cr_id }}"
          git push
