name: CI Pipeline

# Layered CI model matching WebTPS/DHF pattern:
#
#   1. TESTING          — product test suites in parallel, upload JUnit evidence
#   2. ACCEPTANCE GATE  — test-coverage + compliance-check
#   3. EVIDENCE (main)  — evidence bundle generation (needs ACCEPTANCE GATE)

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  actions: read

jobs:

  # ── TESTING ──────────────────────────────────────────────────────────────
  # Product test suites. Each uploads JUnit evidence for the acceptance gate.
  # Both run in parallel. dhf_util tests live in the DHF repo CI.

  tests-sys:
    name: Test | SYS API
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Run SYS tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          pytest tests/sys/ -v -s --junitxml=sys-test-results.xml

      - name: Upload SYS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sys-test-results
          path: sys-test-results.xml

  tests-crs:
    name: Test | CRS API
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Run CRS tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          pytest tests/crs/ -v -s --junitxml=crs-test-results.xml

      - name: Upload CRS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crs-test-results
          path: crs-test-results.xml

  # ── ACCEPTANCE GATE ──────────────────────────────────────────────────────
  # Runs after all test suites complete.  Two gates in parallel:
  #   test-coverage   — requirement→test coverage from JUnit evidence
  #   compliance-check — policy enforcement per configured standards

  test-coverage:
    name: Gate | Test Coverage (requirement → test)
    runs-on: ubuntu-latest
    needs: [tests-sys, tests-crs]
    steps:
      - name: Check out tool repo
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Download test evidence
        uses: actions/download-artifact@v4
        with:
          path: test-results/

      - name: Run test-coverage gate
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          python -m compliantflow --dhf compliantflow-dhf/DHF ci test-coverage \
            --junit-dir test-results/

  compliance-check:
    name: Gate | Compliance Check (standards)
    runs-on: ubuntu-latest
    needs: [tests-sys, tests-crs]
    steps:
      - name: Check out tool repo
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Run compliance check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          python -m compliantflow ci compliance-check \
            --dhf compliantflow-dhf/DHF \
            --governance-dir compliantflow-dhf/governance \
            --standard IEC_62304 \
            --standard IEC_82304_1

  # ── EVIDENCE (main only) ─────────────────────────────────────────────────
  # Generates the DHF evidence bundle after the acceptance gate passes on main.

  evidence-bundle:
    name: Evidence | Bundle
    runs-on: ubuntu-latest
    needs: [test-coverage, dhf-validation, compliance-check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !cancelled()
    steps:
      - name: Check out tool repo
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install system dependencies for PDF export
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libharfbuzz0b libpangoft2-1.0-0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Download test evidence
        uses: actions/download-artifact@v4
        with:
          path: test-results/

      - name: Generate evidence bundle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          python -m compliantflow --dhf compliantflow-dhf/DHF ci evidence bundle \
            --out-dir dhf-artifacts \
            --junit-dir test-results \
            --coverage-pair UC:CRS \
            --coverage-pair CRS:SYS \
            --coverage-pair SYS:SRS \
            --coverage-pair SRS:SWDD \
            --traceability-type UC \
            --traceability-type CRS \
            --traceability-type SYS \
            --traceability-type SRS \
            --traceability-type SWDD \
            --compliance-standard IEC_62304 \
            --compliance-standard IEC_82304_1 \
            --governance-dir compliantflow-dhf/governance \
            --run-id "${{ github.run_id }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}"

      - name: Upload DHF release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dhf-release-artifacts
          path: dhf-artifacts/
