name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  phase1-srs:
    name: Phase 1 - SRS Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r requirements.txt
      
      - name: Run Unit Tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}/src"
          pytest tests/ --ignore=tests/crs/ --ignore=tests/sys/ --junitxml=unit-test-results.xml --cov=src --cov-report=xml
      
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: unit-test-results.xml

  # Phase 2: SYS API Tests (System Requirements)
  phase2-sys:
    name: Phase 2 - SYS API Tests
    runs-on: ubuntu-latest
    needs: phase1-srs
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run SYS Tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}/src"
          pytest tests/sys/ -v -s --junitxml=sys-test-results.xml

      - name: Upload SYS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sys-test-results
          path: sys-test-results.xml


  # Phase 3: CRS API Tests (Customer Requirements)
  phase3-crs:
    name: Phase 3 - CRS API Tests
    runs-on: ubuntu-latest
    needs: phase2-sys
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run CRS API Tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}/src"
          pytest tests/crs/ -v -s --junitxml=crs-test-results.xml

      - name: Upload CRS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crs-test-results
          path: crs-test-results.xml

  phase-import-results:
    name: Phase 3.5 - Import Test Results to DHF
    runs-on: ubuntu-latest
    needs: [phase1-srs, phase2-sys, phase3-crs]
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download test result artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts

      - name: Import test results to DHF
        run: |
          export PYTHONPATH="${PWD}/src"
          for xml in test-artifacts/*/*.xml; do
            echo "Importing $xml"
            python -m compliantflow --dhf DHF test import "$xml" \
              --format junit \
              --tester "GitHub Actions" \
              --run-id "${{ github.run_id }}" \
              --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --commit "${{ github.sha }}" || echo "Warning: import failed for $xml"
          done

      - name: Commit test results to DHF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add DHF/test-results/results.yaml 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No test result changes to commit"
            exit 0
          fi

          git commit -m "CI: Import test results from run ${{ github.run_id }}"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
          echo "✅ Test results imported and committed to DHF"

  phase4-cr:
    name: Phase 4 - Insert Impacted Items to CR
    needs: [phase-import-results]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate CR Reference
        id: validate
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          # PR title MUST start with CR-NNN (e.g. "CR-012: add CLI layer")
          if echo "$PR_TITLE" | grep -qE "^CR-[0-9]+"; then
            CR_ID=$(echo "$PR_TITLE" | grep -oE "^CR-[0-9]+" | head -1)
            echo "Found CR: $CR_ID"
            echo "cr_id=$CR_ID" >> $GITHUB_OUTPUT
          else
            echo "::error::PR title must start with CR-NNN (e.g. 'CR-012: description')"
            echo "::error::Current title: $PR_TITLE"
            exit 1
          fi
      
      - name: Validate CR Exists
        run: |
          CR_FILE="DHF/items/09_cr/${{ steps.validate.outputs.cr_id }}.yaml"
          if [ ! -f "$CR_FILE" ]; then
            echo "::error::CR ${{ steps.validate.outputs.cr_id }} does not exist"
            exit 1
          fi
          echo "CR ${{ steps.validate.outputs.cr_id }} exists"
      
      - name: Check CR Status
        run: |
          export PYTHONPATH="${PWD}/src"
          python -m compliantflow --dhf DHF cr check-status ${{ steps.validate.outputs.cr_id }}

      - name: Analyze Changed Items
        id: analyze
        run: |
          # Get base branch for comparison
          git fetch origin ${{ github.base_ref }}
          BASE_SHA=$(git merge-base HEAD origin/${{ github.base_ref }})
          
          # Get list of changed files compared to base
          CHANGED_FILES=$(git diff --name-only $BASE_SHA HEAD)
          
          AFFECTED_ITEMS=""
          
          # 1. Detect changed YAML items in DHF/items/ (exclude CR files)
          YAML_FILES=$(echo "$CHANGED_FILES" | grep "^DHF/items/.*\.yaml$" | grep -v "^DHF/items/09_cr/" || true)
          for file in $YAML_FILES; do
            if [ -f "$file" ]; then
              ITEM_ID=$(grep "^id:" "$file" | cut -d' ' -f2)
              if [ -n "$ITEM_ID" ]; then
                AFFECTED_ITEMS="$AFFECTED_ITEMS\n  - $ITEM_ID"
              fi
            fi
          done
          
          # 2. Detect changed test files
          TEST_FILES=$(echo "$CHANGED_FILES" | grep "^tests/.*\.py$" || true)
          for file in $TEST_FILES; do
            if [ -f "$file" ]; then
              BASENAME=$(basename "$file" .py)
              if [[ $BASENAME =~ ^test_([a-z]+)_([0-9]+)_ ]]; then
                TYPE=$(echo "${BASH_REMATCH[1]}" | tr '[:lower:]' '[:upper:]')
                NUMBER="${BASH_REMATCH[2]}"
                TEST_ID="TC-${TYPE}-${NUMBER}"
                
                # Add test ID (automated tests are valid even without YAML files)
                AFFECTED_ITEMS="$AFFECTED_ITEMS\n  - $TEST_ID"
              fi
            fi
          done
          
          echo "affected_items<<EOF" >> $GITHUB_OUTPUT
          echo -e "$AFFECTED_ITEMS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Update CR with Affected Items and PR Info
        run: |
          # Build --item flags from affected items detected in previous step
          ITEM_FLAGS=""
          while IFS= read -r item; do
            item=$(echo "$item" | sed 's/^[[:space:]]*-[[:space:]]*//' | tr -d '[:space:]')
            if [ -n "$item" ]; then
              ITEM_FLAGS="$ITEM_FLAGS --item $item"
            fi
          done <<< "${{ steps.analyze.outputs.affected_items }}"

          export PYTHONPATH="${PWD}/src"
          python -m compliantflow --dhf DHF cr update ${{ steps.validate.outputs.cr_id }} \
            $ITEM_FLAGS \
            --pr-number ${{ github.event.pull_request.number }} \
            --pr-url "${{ github.event.pull_request.html_url }}" \
            --pr-title "${{ github.event.pull_request.title }}"
      
      - name: Commit CR Update to PR Branch
        run: |
          CR_FILE="DHF/items/09_cr/${{ steps.validate.outputs.cr_id }}.yaml"
          
          # Check if CR was actually modified
          if git diff --quiet "$CR_FILE"; then
            echo "No changes to CR file"
            exit 0
          fi
          
          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # Commit and push to PR branch
          git add "$CR_FILE"
          git commit -m "Auto-update ${{ steps.validate.outputs.cr_id }} affected_items"
          git push origin HEAD:${{ github.head_ref }}
          
          echo "✅ Updated CR with affected items and pushed to PR branch"
