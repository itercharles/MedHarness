name: CI Pipeline

# Staged CI model:
#
# PR flow:
#   1. cr-validation         — PR title CR references
#   2. tests-*               — product test suites (upload JUnit artifacts)
#   3. test-coverage         — requirement→test coverage gate
#   4. dhf-validation        — structural DHF gate (schema, traceability, design coverage)
#   5. compliance-check      — compliance policy enforcement gate
#
# Main/post-merge flow:
#   6. evidence-bundle       — evidence artifacts, DHF docs, reports

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      full_verification:
        description: "Run evidence bundle generation"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:

  # ── Push smoke tests ─────────────────────────────────────────────────────

  push-smoke:
    name: Push Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out tool repo
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            pytest \
            pydantic \
            click \
            networkx \
            pyyaml \
            python-frontmatter \
            jinja2 \
            gitpython \
            python-dateutil \
            python-dotenv \
            markdown
          pip install -e compliantflow-dhf/

      - name: Run focused smoke tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          pytest \
            tests/sys/test_sys_027_init.py \
            tests/sys/test_sys_043_cr_workflow_complete.py \
            tests/sys/test_sys_044_cr_intake_github_issue.py \
            compliantflow-dhf/dhf_util/tests/test_change_requests.py \
            -q

  # ── PR: CR validation ────────────────────────────────────────────────────

  cr-validation:
    name: CR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Extract CR IDs from PR title
        id: extract-cr
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          CR_IDS=$(echo "$PR_TITLE" | grep -oE 'CR-[0-9]+' | sort -u | tr '\n' ' ' || true)
          echo "cr_ids=$CR_IDS" >> "$GITHUB_OUTPUT"
          if [ -z "$CR_IDS" ]; then
            echo "✗ No CR ID found in PR title. Include a CR reference e.g. 'feat(CR-012): description'" >&2
            exit 1
          else
            echo "Found CR IDs in title: $CR_IDS" >&2
          fi

      - name: Check out tool repo
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Check CR status for each referenced CR
        env:
          CR_IDS: ${{ steps.extract-cr.outputs.cr_ids }}
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          FAILED=0
          for CR_ID in $CR_IDS; do
            echo "--- Checking $CR_ID ---" >&2
            python -m compliantflow --dhf compliantflow-dhf/DHF cr check-status "$CR_ID" || FAILED=1
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "✗ One or more CR validations failed." >&2
            exit 1
          fi
          echo "✓ All referenced CRs are valid." >&2

  # ── Product test jobs ────────────────────────────────────────────────────

  tests-dhf-utils:
    name: DHF Utils Tests
    runs-on: ubuntu-latest
    needs: cr-validation
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out tool repo
        uses: actions/checkout@v4
        with:
          path: compliantflow

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e compliantflow-dhf/
          pip install -r compliantflow/requirements.txt

      - name: Run dhf_util tests
        run: |
          pytest compliantflow-dhf/dhf_util/tests/ -v --junitxml=dhf-util-test-results.xml

      - name: Upload DHF utils test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhf-utils-test-results
          path: dhf-utils-test-results.xml

  tests-sys:
    name: SYS API Tests
    runs-on: ubuntu-latest
    needs: cr-validation
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Run SYS tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          pytest tests/sys/ -v -s --junitxml=sys-test-results.xml

      - name: Upload SYS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sys-test-results
          path: sys-test-results.xml

  tests-crs:
    name: CRS API Tests
    runs-on: ubuntu-latest
    needs: cr-validation
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Run CRS tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          pytest tests/crs/ -v -s --junitxml=crs-test-results.xml

      - name: Upload CRS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crs-test-results
          path: crs-test-results.xml

  # ── Requirement→test coverage gate ────────────────────────────────────────

  test-coverage:
    name: Test Coverage Gate
    runs-on: ubuntu-latest
    needs: [tests-sys, tests-crs]
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out tool repo
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Download test results
        uses: actions/download-artifact@v4
        with:
          path: test-results/

      - name: Run test-coverage gate
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          python -m compliantflow --dhf compliantflow-dhf/DHF ci test-coverage \
            --junit-dir test-results/

  # ── Structural DHF validation gate ────────────────────────────────────────

  dhf-validation:
    name: DHF Validation Gate
    runs-on: ubuntu-latest
    needs: [tests-sys, tests-crs]
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out tool repo
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Run structural DHF validation
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          python -m compliantflow ci dhf-validate \
            --dhf compliantflow-dhf/DHF \
            --run-schema \
            --run-traceability \
            --coverage-pair UC:CRS \
            --coverage-pair CRS:SYS \
            --coverage-pair SYS:SRS \
            --coverage-pair SRS:SWDD \
            --fail-on-uncovered

  # ── Compliance policy enforcement gate ────────────────────────────────────

  compliance-check:
    name: Compliance Check Gate
    runs-on: ubuntu-latest
    needs: [tests-sys, tests-crs]
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out tool repo
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Run compliance check
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          python -m compliantflow ci compliance-check \
            --dhf compliantflow-dhf/DHF \
            --governance-dir compliantflow-dhf/governance \
            --standard IEC_62304 \
            --standard IEC_82304_1

  # ── Evidence bundle (main/post-merge only) ────────────────────────────────

  evidence-bundle:
    name: Evidence Bundle
    runs-on: ubuntu-latest
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_verification)
    permissions:
      contents: read
    steps:
      - name: Check out tool repo
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Run test suites and collect JUnit evidence
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          mkdir -p test-results
          pytest tests/sys/ -v -s --junitxml=test-results/sys-test-results.xml || true
          pytest tests/crs/ -v -s --junitxml=test-results/crs-test-results.xml || true

      - name: Generate evidence bundle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          python -m compliantflow --dhf compliantflow-dhf/DHF ci evidence bundle \
            --out-dir release-artifacts \
            --junit-dir test-results \
            --coverage-pair UC:CRS \
            --coverage-pair CRS:SYS \
            --coverage-pair SYS:SRS \
            --coverage-pair SRS:SWDD \
            --traceability-type UC \
            --traceability-type CRS \
            --traceability-type SYS \
            --traceability-type SRS \
            --traceability-type SWDD \
            --compliance-standard IEC_62304 \
            --compliance-standard IEC_82304_1 \
            --governance-dir compliantflow-dhf/governance \
            --run-id "${{ github.run_id }}" \
            --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}" \
            --continue-on-gate-failure

      - name: Upload DHF release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dhf-release-artifacts
          path: release-artifacts/

      - name: Close referenced CRs in DHF
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.DHF_REPO_TOKEN }}
        run: |
          CR_IDS=$(git log -1 --format="%s" | grep -oE 'CR-[0-9]+' | sort -u | tr '\n' ' ')
          if [ -z "$CR_IDS" ]; then
            echo "No CR IDs found in commit message — skipping CR closure." >&2
            exit 0
          fi
          echo "Closing CR(s): $CR_IDS" >&2
          gh workflow run cr-transition.yml \
            --repo itercharles/compliantflow-dhf \
            --field cr_ids="$CR_IDS" \
            --field to_state=closed \
            --field triggered_by="GitHub Actions (CompliantFlow post-merge)" \
            --field commit_sha="${GITHUB_SHA}"
