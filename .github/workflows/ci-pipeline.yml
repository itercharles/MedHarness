name: CI Pipeline

# Two-gate model:
#
# PR (design gate) — code may only merge when:
#   - CR exists in DHF and is planned
#   - DHF requirements/design docs are already updated
#   - Tool tests pass
#   - Compliance check passes against current DHF state (read-only)
#
# Post-merge (verification gate) — runs after merge to main:
#   - Re-runs tests, imports results into DHF (committed back)
#   - Runs compliance check with --persist (committed back)
#   - Generates evidence reports
#
# Works for any DHF type (git repo or 3rd-party API via adapter).
# DHF_REPO_TOKEN must have read access for PR jobs, write access for post-merge.

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:
    inputs:
      full_verification:
        description: "Run full evidence recording, compliance persistence, and report generation"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:

  push-smoke:
    name: Push Smoke Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Check out tool repo
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Run focused smoke tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          pytest \
            tests/sys/test_sys_027_init.py \
            tests/sys/test_sys_043_cr_workflow_complete.py \
            tests/sys/test_sys_044_cr_intake_github_issue.py \
            compliantflow-dhf/dhf_util/tests/test_change_requests.py \
            -q

  # ── PR PIPELINE (design gate) ─────────────────────────────────────────────

  phase0-cr-validation:
    name: Phase 0 - CR Validation
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Extract CR IDs from PR title
        id: extract-cr
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          CR_IDS=$(echo "$PR_TITLE" | grep -oE 'CR-[0-9]+' | sort -u | tr '\n' ' ' || true)
          echo "cr_ids=$CR_IDS" >> "$GITHUB_OUTPUT"
          if [ -z "$CR_IDS" ]; then
            echo "✗ No CR ID found in PR title. Include a CR reference e.g. 'feat(CR-012): description'" >&2
            exit 1
          else
            echo "Found CR IDs in title: $CR_IDS" >&2
          fi

      - name: Check out tool repo
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Check CR status for each referenced CR
        env:
          CR_IDS: ${{ steps.extract-cr.outputs.cr_ids }}
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          FAILED=0
          for CR_ID in $CR_IDS; do
            echo "--- Checking $CR_ID ---" >&2
            python -m compliantflow --dhf compliantflow-dhf/DHF cr check-status "$CR_ID" || FAILED=1
          done
          if [ "$FAILED" -eq 1 ]; then
            echo "✗ One or more CR validations failed." >&2
            exit 1
          fi
          echo "✓ All referenced CRs are valid." >&2

  phase1-dhf-utils:
    name: Phase 1 - DHF Utils Tests
    runs-on: ubuntu-latest
    needs: phase0-cr-validation
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out tool repo
        uses: actions/checkout@v4
        with:
          path: compliantflow

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e compliantflow-dhf/
          pip install -r compliantflow/requirements.txt

      - name: Run dhf_util tests
        run: |
          pytest compliantflow-dhf/dhf_util/tests/ -v --junitxml=dhf-util-test-results.xml

      - name: Upload DHF utils test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dhf-utils-test-results
          path: dhf-utils-test-results.xml

  phase2-sys:
    name: Phase 2 - SYS API Tests
    runs-on: ubuntu-latest
    needs: phase0-cr-validation
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Run SYS tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          pytest tests/sys/ -v -s --junitxml=sys-test-results.xml

      - name: Upload SYS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sys-test-results
          path: sys-test-results.xml

  phase3-crs:
    name: Phase 3 - CRS API Tests
    runs-on: ubuntu-latest
    needs: phase0-cr-validation
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Run CRS tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          pytest tests/crs/ -v -s --junitxml=crs-test-results.xml

      - name: Upload CRS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crs-test-results
          path: crs-test-results.xml

  phase3-5-cr-report:
    name: Phase 3.5 - CR-PR Evidence Report
    runs-on: ubuntu-latest
    needs: phase0-cr-validation
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')
    steps:
      - name: Check out tool repo
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Generate CR-PR evidence report
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          mkdir -p cr-reports
          python -c "
          import json, sys, os, subprocess
          sys.path.insert(0, '.')
          from dhf_util.local_adapter import LocalDHFAdapter
          adapter = LocalDHFAdapter('compliantflow-dhf/DHF', auto_commit=False)
          crs = adapter.list_items('CR')
          merged = {}
          for cr in crs:
              cr_id = cr['id']
              args = ['python', '-m', 'compliantflow', '--dhf', 'compliantflow-dhf/DHF',
                      'cr', 'generate-report', cr_id]
              try:
                  result = subprocess.run(
                      args,
                      capture_output=True,
                      text=True,
                      env=os.environ,
                      timeout=60,
                  )
                  try:
                      merged[cr_id] = json.loads(result.stdout)
                  except json.JSONDecodeError:
                      merged[cr_id] = {'cr_id': cr_id, 'error': 'parse_failed'}
              except subprocess.TimeoutExpired:
                  merged[cr_id] = {'cr_id': cr_id, 'error': 'timeout'}
              print(f'Processed {cr_id}', file=sys.stderr)
          with open('cr-reports/cr_pr_linkage.json', 'w') as f:
              json.dump(merged, f, indent=2)
          print(f'Generated merged report with {len(crs)} CR(s)', file=sys.stderr)
          "

      - name: Upload CR-PR evidence reports
        uses: actions/upload-artifact@v4
        with:
          name: cr-pr-reports
          path: cr-reports/

  # Phase 4 (design gate): validates DHF is in the right state BEFORE code merges.
  # Read-only — imports test results ephemerally to check coverage, but does not
  # write back to DHF. No --persist. Writing happens post-merge.
  phase4-design-gate:
    name: Phase 4 - Compliance Design Gate
    runs-on: ubuntu-latest
    needs: [phase2-sys, phase3-crs, phase3-5-cr-report]
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')
    steps:
      - name: Check out tool repo
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Download SYS test results
        uses: actions/download-artifact@v4
        with:
          name: sys-test-results
          path: test-results/

      - name: Download CRS test results
        uses: actions/download-artifact@v4
        with:
          name: crs-test-results
          path: test-results/

      - name: Import test results (ephemeral — validates coverage, not committed)
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for xml in test-results/*.xml; do
            python -m compliantflow --dhf compliantflow-dhf/DHF test import "$xml" \
              --format junit \
              --tester "GitHub Actions" \
              --run-id "${{ github.run_id }}" \
              --run-url "$RUN_URL" \
              --commit "${{ github.sha }}" || true
          done

      - name: Check coverage (UC→CRS→SYS→SYSARCH)
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          python -m compliantflow --dhf compliantflow-dhf/DHF validate coverage \
            UC:CRS CRS:SYS SYS:SYSARCH

      - name: Check traceability
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          python -m compliantflow --dhf compliantflow-dhf/DHF validate traceability || true

      - name: IEC 62304 compliance check (read-only — no persist)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          python -m compliantflow --dhf compliantflow-dhf/DHF validate compliance IEC_62304 \
            --governance-dir compliantflow-dhf/governance

      - name: IEC 82304-1 compliance check (read-only — no persist)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          python -m compliantflow --dhf compliantflow-dhf/DHF validate compliance IEC_82304_1 \
            --governance-dir compliantflow-dhf/governance \
            --persist || true

  # ── POST-MERGE PIPELINE (verification gate) ───────────────────────────────
  #
  # Runs after merge to main. Re-runs tests, commits results and compliance
  # run records back to the DHF. This is the permanent audit trail.
  #
  # Requires DHF_REPO_TOKEN to have write access to compliantflow-dhf.

  post-merge-verification:
    name: Post-Merge - Record Verification Evidence
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.full_verification
    permissions:
      contents: read
    steps:
      - name: Check out tool repo
        uses: actions/checkout@v4

      - name: Check out compliantflow-dhf (with write access)
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Run SYS tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          pytest tests/sys/ -v --junitxml=sys-test-results.xml

      - name: Run CRS tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          pytest tests/crs/ -v --junitxml=crs-test-results.xml

      - name: Import test results into DHF
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          RUN_URL="https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          for xml in sys-test-results.xml crs-test-results.xml; do
            python -m compliantflow --dhf compliantflow-dhf/DHF test import "$xml" \
              --format junit \
              --tester "GitHub Actions" \
              --run-id "${{ github.run_id }}" \
              --run-url "$RUN_URL" \
              --commit "${{ github.sha }}" || true
          done

      - name: Run IEC 62304 compliance check (persist to DHF)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          python -m compliantflow --dhf compliantflow-dhf/DHF validate compliance IEC_62304 \
            --governance-dir compliantflow-dhf/governance \
            --persist

      - name: Run IEC 82304-1 compliance check (persist to DHF)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          python -m compliantflow --dhf compliantflow-dhf/DHF validate compliance IEC_82304_1 \
            --governance-dir compliantflow-dhf/governance \
            --persist || true

      - name: Commit verification evidence back to DHF
        run: |
          cd compliantflow-dhf
          git config user.name "GitHub Actions [bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add DHF/test-results/ DHF/compliance-runs/
          if ! git diff --staged --quiet; then
            git commit -m "ci: record verification evidence for ${GITHUB_SHA::7} [skip ci]"
            git push
          else
            echo "No new verification evidence to commit." >&2
          fi

      - name: Close referenced CRs in DHF
        env:
          GH_TOKEN: ${{ secrets.DHF_REPO_TOKEN }}
        run: |
          # Extract CR IDs from the merge commit subject (matches PR title)
          CR_IDS=$(git log -1 --format="%s" | grep -oE 'CR-[0-9]+' | sort -u | tr '\n' ' ')
          if [ -z "$CR_IDS" ]; then
            echo "No CR IDs found in commit message — skipping CR closure." >&2
            exit 0
          fi
          echo "Closing CR(s): $CR_IDS" >&2
          gh workflow run cr-transition.yml \
            --repo itercharles/compliantflow-dhf \
            --field cr_ids="$CR_IDS" \
            --field to_state=closed \
            --field triggered_by="GitHub Actions (CompliantFlow post-merge)" \
            --field commit_sha="${GITHUB_SHA}"

      - name: Generate evidence reports
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          python -m compliantflow --dhf compliantflow-dhf/DHF report traceability \
            UC CRS SYS SYSARCH \
            --output traceability_report.pdf
          python -m compliantflow --dhf compliantflow-dhf/DHF report compliance IEC_62304 \
            --governance-dir compliantflow-dhf/governance \
            --output compliance_report.pdf

      - name: Upload evidence reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compliance-evidence
          path: |
            traceability_report.pdf
            compliance_report.pdf
