name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  phase1-dhf-utils:
    name: Phase 1 - DHF Utility Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r requirements.txt

      - name: Run DHF Utility Tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}:${PWD}/DHF"
          pytest DHF/utils/tests/ --junitxml=unit-test-results.xml --cov=compliantflow --cov-report=xml

      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: unit-test-results.xml

  # Phase 2: SYS API Tests (System Requirements)
  phase2-sys:
    name: Phase 2 - SYS API Tests
    runs-on: ubuntu-latest
    needs: phase1-dhf-utils
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run SYS Tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}:${PWD}/DHF"
          pytest tests/sys/ -v -s --junitxml=sys-test-results.xml

      - name: Upload SYS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sys-test-results
          path: sys-test-results.xml


  # Phase 3: CRS API Tests (Customer Requirements)
  phase3-crs:
    name: Phase 3 - CRS API Tests
    runs-on: ubuntu-latest
    needs: phase2-sys
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run CRS API Tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}:${PWD}/DHF"
          pytest tests/crs/ -v -s --junitxml=crs-test-results.xml

      - name: Upload CRS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crs-test-results
          path: crs-test-results.xml

  # Phase 3.5 (Import test results) removed — CR-019.
  # Test results remain in GitHub Actions artifacts (source of truth).
  # Use: python -m compliantflow --dhf DHF test pull [--run-id RUN_ID]
  # to fetch results from artifacts into local cache on demand.
  # See SYSARCH-013 for the architecture rationale.

  # Phase 4 (CR auto-update) removed — CR affected_items and PR linkage
  # will be managed by a dedicated workflow in a future iteration.
  # See SYSARCH-011 for the GitOps-implicit PR linkage design rationale.
