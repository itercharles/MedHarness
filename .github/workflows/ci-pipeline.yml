name: CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  phase1-srs:
    name: Phase 1 - SRS Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r requirements.txt
      
      - name: Run Unit Tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}/src:${PWD}/DHF"
          pytest tests/ --ignore=tests/crs/ --ignore=tests/sys/ --junitxml=unit-test-results.xml --cov=src --cov-report=xml
      
      - name: Upload unit test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: unit-test-results.xml

  # Phase 2: SYS API Tests (System Requirements)
  phase2-sys:
    name: Phase 2 - SYS API Tests
    runs-on: ubuntu-latest
    needs: phase1-srs
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run SYS Tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}/src:${PWD}/DHF"
          pytest tests/sys/ -v -s --junitxml=sys-test-results.xml

      - name: Upload SYS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sys-test-results
          path: sys-test-results.xml


  # Phase 3: CRS API Tests (Customer Requirements)
  phase3-crs:
    name: Phase 3 - CRS API Tests
    runs-on: ubuntu-latest
    needs: phase2-sys
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -r requirements.txt

      - name: Run CRS API Tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}/src:${PWD}/DHF"
          pytest tests/crs/ -v -s --junitxml=crs-test-results.xml

      - name: Upload CRS test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crs-test-results
          path: crs-test-results.xml

  phase-import-results:
    name: Phase 3.5 - Import Test Results to DHF
    runs-on: ubuntu-latest
    needs: [phase1-srs, phase2-sys, phase3-crs]
    if: github.event_name == 'pull_request'
    steps:
      - name: Check out code
        uses: actions/checkout@v3
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Download test result artifacts
        uses: actions/download-artifact@v4
        with:
          path: test-artifacts

      - name: Import test results to DHF
        run: |
          export PYTHONPATH="${PWD}/src:${PWD}/DHF"
          for xml in test-artifacts/*/*.xml; do
            echo "Importing $xml"
            python -m compliantflow --dhf DHF test import "$xml" \
              --format junit \
              --tester "GitHub Actions" \
              --run-id "${{ github.run_id }}" \
              --run-url "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
              --commit "${{ github.sha }}" || echo "Warning: import failed for $xml"
          done

      - name: Commit test results to DHF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add DHF/test-results/results.yaml 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No test result changes to commit"
            exit 0
          fi

          git commit -m "CI: Import test results from run ${{ github.run_id }}"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
          echo "✅ Test results imported and committed to DHF"

  # Phase 4 (CR auto-update) removed — CR affected_items and PR linkage
  # will be managed by a dedicated workflow in a future iteration.
  # See SYSARCH-011 for the GitOps-implicit PR linkage design rationale.
