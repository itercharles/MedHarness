name: CI Pipeline

# MedHarness's own CI — layer-based gates:
#
#   1. TESTING          — unit, integration, contract, dhfkit (parallel)
#   2. COMPATIBILITY    — scaffold, example smoke, CLI, template checks
#   3. AUDIT            — OSS build hygiene

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  actions: read

jobs:

  # ── LAYER-BASED TESTING ──────────────────────────────────────────────────

  tests-unit:
    name: Test | Unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # [dev] carries `build`, which test_packaging_templates.py needs to
          # inspect the wheel. Without it that suite skips and packaging faults
          # reach PyPI unnoticed.
          pip install -e ".[dev,docs]"
      - name: Install WeasyPrint's native libraries
        # The PDF tests skip without them, and a skipped test guards nothing.
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Run unit tests
        env:
          MEDHARNESS_REQUIRE_PDF: "1"
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          pytest tests/unit/ tests/guards/ -v

  tests-integration:
    name: Test | Integration
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e ".[docs]"
      - name: Install WeasyPrint's native libraries
        # The PDF tests skip without them, and a skipped test guards nothing.
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
      - name: Run integration tests
        env:
          MEDHARNESS_REQUIRE_PDF: "1"
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          pytest tests/integration/ -v

  tests-contract:
    name: Test | Contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .
      - name: Run contract tests
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          pytest tests/contract/ -v

  tests-dhf-util:
    name: Test | dhfkit Engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v7
      # This suite installs from uv.lock rather than resolving fresh, so the
      # locked versions are the ones a test run actually exercises. Every other
      # job installs with pip, which is how users install.
      #
      # [dev] carries jsonschema, which test_sbom.py needs to check the SBOM
      # against the official CycloneDX schema. Without it that check skips and
      # "bomFormat: CycloneDX" ships as an unverified claim.
      - name: Install from the lockfile
        run: uv sync --locked --extra dev
      - name: Run dhfkit tests
        run: uv run pytest dhfkit/tests/ -v

  # ── COMPATIBILITY CHECKS ─────────────────────────────────────────────────

  check-scaffold:
    name: Check | Scaffold
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Verify scaffold generates expected structure
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          python -c "
          from medharness.scaffold import scaffold_dhf
          from pathlib import Path
          import tempfile
          with tempfile.TemporaryDirectory() as tmp:
              dhf_dir = Path(tmp) / 'test-dhf'
              scaffold_dhf(dhf_dir)
              assert (dhf_dir / 'DHF' / 'config' / 'global.yaml').exists()
              assert not (dhf_dir / 'DHF' / 'config' / 'doc_types').exists()  # defaults are inherited
              assert (dhf_dir / 'DHF' / 'items').exists()
              assert (dhf_dir / 'DHF' / 'README.md').exists()
              assert not (dhf_dir / '.github' / 'prompts').exists()
              assert not (dhf_dir / 'AI-harness').exists()
              # CI is not part of the release payload — adopters copy it from
              # docs/adopting.md, so init must not claim to create it.
              assert not (dhf_dir / '.github' / 'workflows').exists()
              print('OK: scaffold structure valid')
          "

  check-starter:
    name: Check | Starter DHF
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Scaffold starter DHF and run core workflow
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          python -c "
          from medharness.scaffold import scaffold_dhf, replace_placeholders
          from pathlib import Path
          import tempfile, subprocess, sys
          with tempfile.TemporaryDirectory() as tmp:
              dhf_dir = Path(tmp) / 'starter-dhf'
              scaffold_dhf(dhf_dir)
              replace_placeholders(dhf_dir, 'Test Project')
              dhf = str(dhf_dir / 'DHF')
              subprocess.run([sys.executable, '-m', 'medharness', '--dhf', dhf, 'verify', 'dhf'], check=True)
              # The starter items say 'Replace with your own': strict refuses them, so they cannot ship.
              strict = subprocess.run([sys.executable, '-m', 'medharness', '--dhf', dhf, 'verify', 'dhf', '--strict'], capture_output=True, text=True)
              assert strict.returncode == 1 and 'placeholder text' in strict.stdout, strict
              subprocess.run([sys.executable, '-m', 'medharness', '--dhf', dhf, 'item', 'list', '--type', 'CRS'], check=True)
              subprocess.run([sys.executable, '-m', 'medharness', '--dhf', dhf, 'item', 'list', '--type', 'SYS'], check=True)
              # A release of the starter content is refused until the project replaces it, or opts out.
              refused = subprocess.run([sys.executable, '-m', 'medharness', '--dhf', dhf, 'build', 'release', '--version', '0.0.0', '--out-dir', str(Path(tmp) / 'refused')], capture_output=True, text=True)
              assert refused.returncode == 1, refused
              global_yaml = dhf_dir / 'DHF' / 'config' / 'global.yaml'
              global_yaml.write_text(global_yaml.read_text() + '\nplaceholder_patterns: []\n')
              subprocess.run([sys.executable, '-m', 'medharness', '--dhf', dhf, 'build', 'release', '--version', '0.0.0', '--out-dir', str(Path(tmp) / 'release')], check=True)
              print('OK: starter DHF workflow valid')
          "

  check-cli-entrypoints:
    name: Check | CLI Entrypoints
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e .
      - name: Verify CLI entrypoint
        run: |
          export PYTHONPATH="${PYTHONPATH}:${PWD}"
          python -m medharness --help > /dev/null
          medharness --help > /dev/null
          echo 'OK: CLI entrypoint available'

  # ── LOCKFILE ──────────────────────────────────────────────────────────────

  check-lockfile:
    name: Check | Lockfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - name: Assert uv.lock matches pyproject.toml
        run: uv lock --check
