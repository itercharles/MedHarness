name: Release

# Triggered when a vX.Y.Z tag is pushed.
# Preflight checks run first; build+publish only proceeds on success.
# MedHarness releases contain only the installable Python package.

on:
  push:
    tags:
      - 'v*'

jobs:
  preflight:
    name: Release preflight checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Assert pyproject.toml version matches tag
        run: |
          PKG_VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: pyproject.toml version ($PKG_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION"

      - name: Assert CHANGELOG.md contains version
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          if ! grep -qF "$VERSION" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md does not mention version $VERSION"
            exit 1
          fi
          echo "Changelog check passed."

      - name: Assert version not already on PyPI
        run: |
          VERSION="${{ steps.tag.outputs.version }}"
          PACKAGE="medharness"
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$PACKAGE/$VERSION/json" || echo "curl_error")
          if [ "$STATUS" = "curl_error" ] || [ -z "$STATUS" ]; then
            echo "WARNING: Could not reach PyPI — skipping duplicate-version check."
          elif [ "$STATUS" = "200" ]; then
            echo "ERROR: $PACKAGE==$VERSION already exists on PyPI — did you forget to bump the version?"
            exit 1
          fi
          echo "PyPI check passed: $PACKAGE $VERSION not yet published."

  build-and-publish:
    name: Build and publish wheel
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: |
          rm -rf build dist
          python -m build --wheel
          python -m build --sdist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Upload wheel to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.whl
