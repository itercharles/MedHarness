name: Release

# Triggered when a vX.Y.Z tag is pushed.
# Builds the wheel, downloads CI-produced DHF artifacts, and assembles the
# delivery bundle.  All DHF documents (specs, plans, compliance reports,
# traceability) are produced by the post-merge-verification job in
# ci-pipeline.yml and consumed as the dhf-release-artifacts artifact.
#
# Required secrets:
#   DHF_REPO_TOKEN  — GitHub PAT with repo scope to read compliantflow-dhf
#   GEMINI_API_KEY  — Google Gemini API key (for CI, not release; release is consumer-only)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build and upload release bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Sync product template from root AI-harness
        run: python scripts/sync_product_template.py

      - name: Build wheel
        run: python -m build --wheel

      - name: Find latest CI run for this commit
        id: ci-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COMMIT_SHA="${{ github.sha }}"
          # Find all successful CI pipeline runs for this commit, newest first
          RUN_IDS=$(gh run list \
            --repo "${{ github.repository }}" \
            --branch main \
            --workflow ci-pipeline.yml \
            --limit 20 \
            --json databaseId,headSha,status,conclusion \
            --jq "[.[] | select(.headSha == \"${COMMIT_SHA}\" and .status == \"completed\" and .conclusion == \"success\")] | sort_by(-.databaseId) | .[].databaseId" \
            2>/dev/null || echo "")
          if [ -z "$RUN_IDS" ]; then
            echo "::error::No successful CI pipeline run found for commit ${COMMIT_SHA}. Run post-merge-verification first."
            exit 1
          fi
          # Find the first run that actually has dhf-release-artifacts
          for run_id in $RUN_IDS; do
            ARTIFACT_CHECK=$(gh api "repos/${{ github.repository }}/actions/runs/$run_id/artifacts" \
              --jq '.artifacts[] | select(.name == "dhf-release-artifacts") | .name' 2>/dev/null || echo "")
            if [ -n "$ARTIFACT_CHECK" ]; then
              echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
              echo "Found CI run $run_id with dhf-release-artifacts" >&2
              exit 0
            fi
          done
          echo "::error::No CI run for commit ${COMMIT_SHA} contains dhf-release-artifacts. Run post-merge-verification with full_verification=true."
          exit 1

      - name: Download DHF release artifacts
        uses: actions/download-artifact@v4
        with:
          name: dhf-release-artifacts
          path: /tmp/release-artifacts
          run-id: ${{ steps.ci-run.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Assemble delivery bundles
        run: |
          # Derive version from the built whl filename — single source of truth
          WHL=$(ls dist/*.whl | head -1)
          VERSION=$(basename "${WHL}" | sed 's/compliantflow-\([^-]*\)-.*/\1/')
          SHA="${GITHUB_SHA:0:7}"

          # --- compliantflow-x.y.z-hash.zip: whl + GETTING_STARTED ---
          CF_DIR="/tmp/cf-${VERSION}-${SHA}"
          mkdir -p "${CF_DIR}"
          cp dist/*.whl "${CF_DIR}/"
          cp GETTING_STARTED.md "${CF_DIR}/"
          find "${CF_DIR}" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find "${CF_DIR}" -name "*.pyc" -delete 2>/dev/null || true
          find "${CF_DIR}" -name ".DS_Store" -delete 2>/dev/null || true
          cd /tmp
          zip -r "compliantflow-${VERSION}-${SHA}.zip" "cf-${VERSION}-${SHA}/"
          echo "CF_ZIP=/tmp/compliantflow-${VERSION}-${SHA}.zip" >> "$GITHUB_ENV"

          # --- DHF-x.y.z-hash.zip: CI-produced specs, plans, compliance, traceability ---
          DHF_DIR="/tmp/dhf-${VERSION}-${SHA}"
          mkdir -p "${DHF_DIR}"
          cp -r /tmp/release-artifacts/. "${DHF_DIR}/"
          find "${DHF_DIR}" -name ".DS_Store" -delete 2>/dev/null || true
          cd /tmp
          zip -r "DHF-${VERSION}-${SHA}.zip" "dhf-${VERSION}-${SHA}/"
          echo "DHF_ZIP=/tmp/DHF-${VERSION}-${SHA}.zip" >> "$GITHUB_ENV"

      - name: Upload delivery bundles to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.CF_ZIP }}
            ${{ env.DHF_ZIP }}