name: Release

# Triggered when a vX.Y.Z tag is pushed.
# Builds the wheel on Ubuntu (canonical build environment per Development Plan §6.1),
# assembles the customer delivery bundle, and uploads it to the GitHub Release.

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build and upload release bundle
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Build wheel
        run: python -m build --wheel

      - name: Assemble release bundle
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BUILD="${{ github.run_number }}"
          BUNDLE_NAME="compliantflow-${VERSION}-build-${BUILD}"
          BUNDLE_DIR="/tmp/${BUNDLE_NAME}"

          mkdir -p "${BUNDLE_DIR}"

          # Wheel
          cp dist/*.whl "${BUNDLE_DIR}/"

          # Starter kit contents
          cp GETTING_STARTED.md "${BUNDLE_DIR}/"
          cp -r dhf-template "${BUNDLE_DIR}/"

          # Remove any cached Python files from the template
          find "${BUNDLE_DIR}" -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          find "${BUNDLE_DIR}" -name "*.pyc" -delete 2>/dev/null || true
          find "${BUNDLE_DIR}" -name ".DS_Store" -delete 2>/dev/null || true

          cd /tmp
          zip -r "${BUNDLE_NAME}.zip" "${BUNDLE_NAME}/"
          echo "BUNDLE_ZIP=/tmp/${BUNDLE_NAME}.zip" >> "$GITHUB_ENV"
          echo "BUNDLE_NAME=${BUNDLE_NAME}" >> "$GITHUB_ENV"

      - name: Upload release bundle to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.BUNDLE_ZIP }}
            dist/*.whl
