name: Release

# Triggered when a vX.Y.Z tag is pushed.
# Preflight checks run first; build+publish only proceeds on success.
# MedHarness releases contain only the installable Python package.

on:
  push:
    tags:
      - 'v*'

jobs:
  preflight:
    name: Release preflight checks
    runs-on: ubuntu-24.04
    # Read-only: preflight inspects the tag, pyproject, changelog, and PyPI.
    # Declared explicitly so the job cannot inherit a broader default.
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Assert tag points at the current tip of origin/main
        run: |
          git fetch origin main
          TAG_COMMIT=$(git rev-list -n 1 "$GITHUB_REF")
          MAIN_TIP=$(git rev-parse origin/main)
          if [ "$TAG_COMMIT" != "$MAIN_TIP" ]; then
            echo "ERROR: Tag points at $TAG_COMMIT but origin/main is at $MAIN_TIP."
            echo "Only tag the current tip of main for a release."
            exit 1
          fi
          echo "Tip check passed: tag commit matches origin/main HEAD."

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Extract tag version
        id: tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Assert pyproject.toml version matches tag
        env:
          TAG_VERSION: ${{ steps.tag.outputs.version }}
        run: |
          PKG_VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: pyproject.toml version ($PKG_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi
          echo "Version check passed: $PKG_VERSION"

      - name: Assert CHANGELOG.md contains version
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          if ! grep -qF "$VERSION" CHANGELOG.md; then
            echo "ERROR: CHANGELOG.md does not mention version $VERSION"
            exit 1
          fi
          echo "Changelog check passed."

      - name: Assert version not already on PyPI
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          PACKAGE="medharness"
          STATUS=$(curl -sf -o /dev/null -w "%{http_code}" "https://pypi.org/pypi/$PACKAGE/$VERSION/json" || echo "curl_error")
          if [ "$STATUS" = "curl_error" ] || [ -z "$STATUS" ]; then
            echo "WARNING: Could not reach PyPI — skipping duplicate-version check."
          elif [ "$STATUS" = "200" ]; then
            echo "ERROR: $PACKAGE==$VERSION already exists on PyPI — did you forget to bump the version?"
            exit 1
          fi
          echo "PyPI check passed: $PACKAGE $VERSION not yet published."

  tests:
    name: Test the tagged source
    needs: preflight
    runs-on: ubuntu-24.04
    # Read-only: the suite runs against the tag and nothing is written back.
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      # The same lockfile and extras the CI jobs test with, so the environment
      # recorded below is the one the suite ran in.
      - name: Install from the lockfile
        run: uv sync --locked --extra dev --extra docs

      - name: Install WeasyPrint's native libraries
        # The PDF tests skip without them, and a skipped test guards nothing.
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0

      - name: Run the full test suite
        env:
          MEDHARNESS_REQUIRE_PDF: "1"
        run: |
          set -o pipefail
          mkdir -p test-results
          uv run --no-sync pytest -q --junitxml=test-results/junit.xml 2>&1 | tee test-results/pytest-output.txt

      # The constraints file pins every runtime and docs dependency to the version
      # the suite passed with. `uv export` reads the lockfile, so it lists exactly
      # what `uv sync` installed, and --no-emit-project leaves medharness itself out
      # (the install names it with `medharness[docs]==<version>`).
      - name: Record the tested configuration
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p evidence
          uv export --frozen --no-hashes --no-emit-project --no-dev --extra docs \
            --no-header --no-annotate > "evidence/medharness-${VERSION}-tested-with.txt"
          mv test-results/junit.xml "evidence/medharness-${VERSION}-junit.xml"
          . /etc/os-release
          {
            echo "medharness ${VERSION}"
            echo "tag: ${GITHUB_REF_NAME}"
            echo "commit: $(git rev-parse HEAD)"
            echo "pytest: $(tail -n 1 test-results/pytest-output.txt)"
            echo "python: $(uv run --no-sync python --version)"
            echo "runner: ubuntu-24.04 (${PRETTY_NAME})"
          } > "evidence/medharness-${VERSION}-test-summary.txt"

      # What `build validation` compares an installation against, carried in the wheel
      # (ADR-005): written here, beside the tested-with list it is read from.
      - name: Write the release record
        run: |
          uv run --no-sync python scripts/write_release_record.py --version "${GITHUB_REF_NAME#v}" \
            --commit "$(git rev-parse HEAD)" --evidence-dir evidence --dhf DHF \
            --out release-record/release.json

      - name: Upload the release evidence
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: evidence/
          if-no-files-found: error

      - name: Upload the release record
        uses: actions/upload-artifact@v4
        with:
          name: release-record
          path: release-record/release.json
          if-no-files-found: error

  build-and-publish:
    name: Build and publish wheel
    needs: [preflight, tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install build tools
        run: pip install build

      - name: Put the release record into the package
        uses: actions/download-artifact@v4
        with:
          name: release-record
          path: medharness/validation

      - name: Build sdist and wheel
        run: |
          rm -rf build dist
          python -m build --wheel
          python -m build --sdist

      - name: Assert the wheel carries the release record
        run: unzip -l dist/*.whl | grep -q 'medharness/validation/release.json'

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Download the release evidence
        uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: evidence

      - name: Upload wheel and test evidence to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/*.whl
            evidence/*
