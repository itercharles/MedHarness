name: DHF PR Review

# Suggestion layer — analyses DHF changes in a PR and posts a compliance
# action checklist as a comment. No pass/fail exit code; does not gate merges.

on:
  pull_request:
    types: [opened, synchronize]
    paths:
      - 'DHF/items/**'
      - '**/*.yaml'

permissions:
  contents: read
  pull-requests: write

jobs:
  review-dhf-changes:
    name: DHF Compliance Review (suggestion)
    runs-on: ubuntu-latest
    if: ${{ secrets.GEMINI_API_KEY != '' }}
    steps:
      - name: Checkout CompliantFlow
        uses: actions/checkout@v4

      - name: Checkout DHF repository
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -e ".[dev]" --quiet

      - name: Get PR diff
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff ${{ github.event.pull_request.number }} > pr.diff
          echo "diff_lines=$(wc -l < pr.diff)" >> "$GITHUB_OUTPUT"

      - name: Run DHF PR review
        id: review
        env:
          PYTHONPATH: ".:compliantflow-dhf/DHF"
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m compliantflow \
            --dhf compliantflow-dhf/DHF \
            review-pr \
            --diff pr.diff \
            > review_output.md 2>&1 || true
          echo "Generated review output ($(wc -l < review_output.md) lines)"

      - name: Post review as PR comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete previous bot review comments to avoid spam
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "$(cat review_output.md)" \
            --edit-last 2>/dev/null || \
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "$(cat review_output.md)"
