name: DHF PR Review

# Suggestion layer — analyses DHF changes in a PR and posts a compliance
# action checklist as a comment. No pass/fail exit code; does not gate merges.

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Pull request number to review"
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write

jobs:
  review-dhf-changes:
    name: DHF Compliance Review (suggestion)
    runs-on: ubuntu-latest
    steps:
      - name: Check review configuration
        id: config
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -n "$GEMINI_API_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "GEMINI_API_KEY is not configured; skipping review."
          fi

      - name: Checkout CompliantFlow
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v4

      - name: Checkout DHF repository
        if: steps.config.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: itercharles/compliantflow-dhf
          token: ${{ secrets.DHF_REPO_TOKEN }}
          path: compliantflow-dhf

      - name: Set up Python
        if: steps.config.outputs.enabled == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.config.outputs.enabled == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e compliantflow-dhf/

      - name: Get PR diff
        if: steps.config.outputs.enabled == 'true'
        id: diff
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr diff "${{ inputs.pr_number }}" > pr.diff
          echo "diff_lines=$(wc -l < pr.diff)" >> "$GITHUB_OUTPUT"

      - name: Run DHF PR review
        if: steps.config.outputs.enabled == 'true'
        id: review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python -m compliantflow \
            --dhf compliantflow-dhf/DHF \
            review-pr \
            --diff pr.diff \
            > review_output.md 2>&1 || true
          echo "Generated review output ($(wc -l < review_output.md) lines)"

      - name: Post review as PR comment
        if: steps.config.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete previous bot review comments to avoid spam
          gh pr comment "${{ inputs.pr_number }}" \
            --body "$(cat review_output.md)" \
            --edit-last 2>/dev/null || \
          gh pr comment "${{ inputs.pr_number }}" \
            --body "$(cat review_output.md)"
